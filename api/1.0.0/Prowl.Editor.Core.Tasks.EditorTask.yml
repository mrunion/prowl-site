  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Core.Tasks
  summary: >-
    Resumes on the main thread once the condition holds, checked every editor frame. Unlike awaiting a task,

    this survives entering and leaving play mode and script reloads, which end the game's async session.

    A condition that throws resumes the wait by rethrowing it.
  example: []
  syntax:
    content: public EditorTask.IdleAwaitable IdleOnCondition(Func<bool> condition)
    parameters:
    - id: condition
      type: System.Func{System.Boolean}
    return:
      type: Prowl.Editor.Core.Tasks.EditorTask.IdleAwaitable
    content.vb: Public Function IdleOnCondition(condition As Func(Of Boolean)) As EditorTask.IdleAwaitable
