  name: WheelCollider
  nameWithType: WheelCollider
  fullName: Prowl.Runtime.WheelCollider
  type: Class
  source:
    remote:
      path: Prowl.Runtime/Components/Physics/WheelCollider.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: WheelCollider
    path: ../Prowl/Prowl.Runtime/Components/Physics/WheelCollider.cs
    startLine: 139
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    A raycast-vehicle wheel. Ground contact is a grid of downward rays across the wheel face. Each ray finds the

    surface below it, and the wheel's contact with that surface is solved exactly for its round profile, so it sits

    precisely on slopes and still rides over bumps and kerbs between rays. Suspension is a spring and damper tuned

    from a natural frequency, and grip follows a friction curve on slip ratio and slip angle, solved together with

    the wheel's spin so it stays stable for any mass and holds still on slopes and moving platforms.


    The wheel applies forces to the nearest enabled <xref href="Prowl.Runtime.Rigidbody3D" data-throw-if-not-resolved="false"></xref> above it; it does not add a collision

    shape of its own. Place the wheel GameObject so its position marks the top of the suspension travel; the wheel

    hangs below along -up. Positive <xref href="Prowl.Runtime.WheelCollider.SteerAngle" data-throw-if-not-resolved="false"></xref> turns toward the wheel's right.
  example: []
  syntax:
    content: >-
      [AddComponentMenu("Physics/Wheel Collider", "")]

      [ComponentIcon("")]

      public sealed class WheelCollider : MonoBehaviour, IDisposable, ISerializationCallbackReceiver
    content.vb: >-
      <AddComponentMenu("Physics/Wheel Collider", "")>

      <ComponentIcon("")>

