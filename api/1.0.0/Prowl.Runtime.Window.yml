- uid: Prowl.Runtime.Window.ContentScale
  commentId: P:Prowl.Runtime.Window.ContentScale
  id: ContentScale
  parent: Prowl.Runtime.Window
  langs:
  - csharp
  - vb
  name: ContentScale
  nameWithType: Window.ContentScale
  fullName: Prowl.Runtime.Window.ContentScale
  type: Property
  source:
    remote:
      path: Prowl.Runtime/Window.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: ContentScale
    path: ../Prowl/Prowl.Runtime/Window.cs
    startLine: 77
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Physical-to-logical pixel ratio for the window's current display.


    <p>

    On Windows, resolves <code>glfwGetWindowContentScale</code> via the native GLFW context

    to capture the system DPI factor (e.g. 1.25 at 125%). This is needed because

    <code>FramebufferSize / Size</code> only reflects the ratio when the process is

    per-monitor DPI-aware; if DPI awareness failed at startup the OS virtualises

    the framebuffer (fb == win) and the ratio collapses to 1.

    </p>

    <p>

    On macOS and Linux the GLFW proc address is not reachable via this path, so we

    fall back to <code>FramebufferSize / Size</code> which is always correct on those

    platforms (Retina: 3024 fb / 1512 points = 2; 1× monitor: 1).

    </p>
  example: []
  syntax:
    content: public static float ContentScale { get; }
    parameters: []
    return:
      type: System.Single
    content.vb: Public Shared ReadOnly Property ContentScale As Single
  overload: Prowl.Runtime.Window.ContentScale*
