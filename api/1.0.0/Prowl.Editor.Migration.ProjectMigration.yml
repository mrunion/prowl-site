  summary: >-
    Brings a project saved with an older engine version up to <xref href="Prowl.Editor.Projects.Project.CurrentVersion" data-throw-if-not-resolved="false"></xref>.

    Every format change is a <xref href="Prowl.Editor.Migration.MigrationStep" data-throw-if-not-resolved="false"></xref> listed by the <xref href="Prowl.Editor.Migration.MigrationRelease" data-throw-if-not-resolved="false"></xref> it shipped in,

    and the steps run in version order, so a project from any older version walks up one step at a time.
