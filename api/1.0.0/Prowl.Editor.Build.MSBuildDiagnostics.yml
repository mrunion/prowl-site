  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Build
  summary: Reads MSBuild's canonical diagnostic format into <xref href="Prowl.Editor.Build.BuildIssue" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    MSBuild emits diagnostics in one documented shape, <code>origin : severity code : message [project]</code>,

    where the origin may carry a line and column. Matching that shape recovers the code, the file and the

    line, which a search for the substring ": error " throws away.


    <p>

    The severity words are localised when the toolchain is, so callers must run the tool with an

    invariant UI language. <xref href="Prowl.Editor.Build.MSBuildDiagnostics.InvariantEnvironment" data-throw-if-not-resolved="false"></xref> carries the variables that do it.

    </p>
  example: []
