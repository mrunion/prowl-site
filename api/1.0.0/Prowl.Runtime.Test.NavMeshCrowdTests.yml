  nameWithType: NavMeshCrowdTests.Agent_AloneOnAStraightPath_DoesNotDriftSideways(bool)
  fullName: Prowl.Runtime.Test.NavMeshCrowdTests.Agent_AloneOnAStraightPath_DoesNotDriftSideways(bool)
  type: Method
  source:
    remote:
      path: Prowl.Runtime.Test/NavMeshCrowdTests.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: Agent_AloneOnAStraightPath_DoesNotDriftSideways
    path: ../Prowl/Prowl.Runtime.Test/NavMeshCrowdTests.cs
    startLine: 170
  assemblies:
  - Prowl.Runtime.Test
  namespace: Prowl.Runtime.Test
  summary: >-
    With nothing in range to dodge, an agent must travel the straight line it was given —

    exactly, not approximately. Velocity-obstacle sampling picks from a discrete candidate set,

    so running it against zero obstacles still rounds the chosen velocity, and the rounding

    walks the agent centimetres off its line by the time it arrives. Skipping it also skips the

    most expensive part of the crowd step.


    <p></p>


    The floor is deliberately far wider than the walk: the same query consumes navmesh boundary

    segments, so on a floor whose edge sits inside the agent's collision query range there IS

    something in range and avoidance correctly stays on. <xref href="Prowl.Runtime.Test.NavMeshObstacleTests" data-throw-if-not-resolved="false"></xref>

    covers the other half — that a blocker in range still deflects it.
  example: []
  syntax:
    content: >-
      [Theory]

      [InlineData(new object[] { true })]

      [InlineData(new object[] { false })]

      public void Agent_AloneOnAStraightPath_DoesNotDriftSideways(bool alongX)
    parameters:
    - id: alongX
      type: System.Boolean
    content.vb: >-
      <Theory>

      <InlineData(New Object() { True })>

      <InlineData(New Object() { False })>

      Public Sub Agent_AloneOnAStraightPath_DoesNotDriftSideways(alongX As Boolean)
  overload: Prowl.Runtime.Test.NavMeshCrowdTests.Agent_AloneOnAStraightPath_DoesNotDriftSideways*
