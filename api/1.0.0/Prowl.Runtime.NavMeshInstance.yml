  summary: >-
    A registered navmesh inside a <xref href="Prowl.Runtime.NavMeshWorld" data-throw-if-not-resolved="false"></xref>: the instantiated Detour navmesh,

    its query pool, and the lock that lets queries run from any thread while tile mutations

    (rebakes, partial rebuilds) exclude them. Obtained from

    <xref href="Prowl.Runtime.NavMeshWorld.AddNavMeshData(Prowl.Runtime.NavMeshData)" data-throw-if-not-resolved="false"></xref>; advanced users can reach the raw Detour objects

    through <xref href="Prowl.Runtime.NavMeshInstance.NativeNavMesh" data-throw-if-not-resolved="false"></xref>.
