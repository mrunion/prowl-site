  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    A kinematic character that moves by sweeping its own shape through the world. It walks along the

    ground, slides along walls and ceilings, climbs steps, snaps down stairs and slopes, and rides

    whatever it stands on. It never becomes a rigidbody, so pushing things is left to the caller

    through <xref href="Prowl.Runtime.CharacterController.Hits" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [AddComponentMenu("Physics/Character Controller", "")]

      [ComponentIcon("")]

      public class CharacterController : MonoBehaviour, IDisposable, ISerializationCallbackReceiver
    content.vb: >-
      <AddComponentMenu("Physics/Character Controller", "")>

      <ComponentIcon("")>

      Public Class CharacterController Inherits MonoBehaviour Implements IDisposable, ISerializationCallbackReceiver
