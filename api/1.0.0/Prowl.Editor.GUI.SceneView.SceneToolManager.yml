  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.GUI.SceneView
  summary: >-
    Tracks which <xref href="Prowl.Editor.GUI.SceneView.SceneTool" data-throw-if-not-resolved="false"></xref>s are live. There is no exclusive "active tool": every

    available tool ticks every frame and they coexist, because <xref href="Prowl.Editor.GUI.SceneView.HandleContext" data-throw-if-not-resolved="false"></xref> already

    decides which handle owns the cursor. A tool that wants to be modal owns that decision itself -

    it draws a toggle in the tool strip and returns early while switched off, which is both simpler

    than an activation state machine and more flexible than one.


    <p>Availability is the only gating: a global tool is always available, a component-scoped tool

    is available while a matching component is selected. <xref href="Prowl.Editor.GUI.SceneView.SceneTool.OnActivated(Prowl.Editor.GUI.SceneView.SceneToolContext)" data-throw-if-not-resolved="false"></xref> and

    <xref href="Prowl.Editor.GUI.SceneView.SceneTool.OnDeactivated" data-throw-if-not-resolved="false"></xref> fire on those transitions.</p>
