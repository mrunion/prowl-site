    id: LinkId
    path: ../Prowl/Prowl.Runtime/Components/Navigation/NavMeshLink.cs
    startLine: 106
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Persistent id stamped on the baked connections, resolving a traversing agent back
        to this component (<xref href="Prowl.Runtime.NavMeshAgent.CurrentOffMeshLinkData" data-throw-if-not-resolved="false"></xref>). Derived from the
        component's <xref href="Prowl.Runtime.MonoBehaviour.Identifier" data-throw-if-not-resolved="false"></xref>, which the scene persists, so it survives
        a reload and a duplicated object gets its own. Resolution is best-effort — baked data can
        outlive the component that produced it — so don't hang gameplay-critical logic on
        <code>CurrentOffMeshLinkData.Link</code>.
  example: []
  syntax:
    content: public int LinkId { get; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public ReadOnly Property LinkId As Integer
  overload: Prowl.Runtime.NavMeshLink.LinkId*
