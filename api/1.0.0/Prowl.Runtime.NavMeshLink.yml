    id: NavMeshLink
    path: ../Prowl/Prowl.Runtime/Components/Navigation/NavMeshLink.cs
    startLine: 22
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Connects two navmesh positions that aren't walkably connected — a jump over a gap, a drop off a

    ledge, a ladder. Agents whose area mask includes <xref href="Prowl.Runtime.NavMeshLink.Area" data-throw-if-not-resolved="false"></xref> traverse it as part of

    pathing; the crowd animates the hop and manual traversal is not supported. Links are BAKED data,

    kept beside the layers and re-injected whenever a tile is re-contoured, so carving and links

    coexist; with <xref href="Prowl.Runtime.NavMeshLink.AutoRebuild" data-throw-if-not-resolved="false"></xref> on this component rebuilds the tiles around its endpoints

    when it changes. Traversal cost comes from the area's cost, so price a link by giving it its own

    area. Enabled outside play too, because a bake gathers links from the registry only enabled links

    are in.
  example: []
  syntax:
    content: >-
      [AddComponentMenu("Navigation/NavMesh Link", "")]

      [ComponentIcon("")]

      public class NavMeshLink : MonoBehaviour, IDisposable, ISerializationCallbackReceiver
    content.vb: >-
      <AddComponentMenu("Navigation/NavMesh Link", "")>

      <ComponentIcon("")>

