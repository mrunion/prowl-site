  summary: 'Creates a disk-backed cache rooted at the given directory, with a byte budget and age limit for pruning. maxBytes is generous on purpose: the cost of a miss is reprocessing the asset. maxAge: entries untouched for this long go regardless of how much room is left.'
  example: []
  syntax:
    content: public LocalVariantCache(string root, long maxBytes = 8589934592, TimeSpan? maxAge = null)
