  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.UI
  summary: >-
    Emits a triangle fan that fills a fraction of <code class="paramref">r</code> per the image fill

    modes. Horizontal/Vertical clip the rect on one axis; Radial90/180/360 sweep an

    arc from a corner / edge-midpoint / center. <code class="paramref">amount</code> is clamped to

    [0,1]. UV is mapped 1:1 to the original rect so the texture appears un-stretched.
  example: []
  syntax:
    content: public void AddFilled(Rect r, Color tint, FillMethod method, int origin, float amount, bool clockwise)
    parameters:
