    - id: method
      type: Prowl.Runtime.UI.FillMethod
    - id: origin
      type: System.Int32
    - id: amount
      type: System.Single
    - id: clockwise
      type: System.Boolean
    content.vb: Public Sub AddFilled(r As Rect, tint As Color, method As FillMethod, origin As Integer, amount As Single, clockwise As Boolean)
