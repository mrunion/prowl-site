  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.UI
  summary: >-
    Tessellates a rounded rectangle by replacing each corner with an arc of

    <code class="paramref">cornerSegments</code> triangles. The result is a triangle fan

    from the rect's center. Use <code class="paramref">radius</code> = 0 for a sharp rect

    (callers should prefer <xref href="Prowl.Runtime.UI.UIMeshBuilder.AddQuad(Prowl.Vector.Rect%2cProwl.Vector.Color%2cProwl.Vector.Float2%2cProwl.Vector.Float2)" data-throw-if-not-resolved="false"></xref> in that case).
  example: []
  syntax:
    content: public void AddRoundedRect(Rect r, float radius, Color tint, int cornerSegments = 6)
    parameters:
    - id: r
      type: Prowl.Vector.Rect
    - id: radius
      type: System.Single
    - id: tint
      type: Prowl.Vector.Color
    - id: cornerSegments
      type: System.Int32
    content.vb: Public Sub AddRoundedRect(r As Rect, radius As Single, tint As Color, cornerSegments As Integer = 6)
  overload: Prowl.Runtime.UI.UIMeshBuilder.AddRoundedRect*
