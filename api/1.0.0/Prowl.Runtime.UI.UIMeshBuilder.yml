  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.UI
  summary: >-
    Adds a nine-slice quad: <code class="paramref">outer</code> is the on-screen rectangle,

    <code class="paramref">inner</code> is the unstretched center region in *pixel* offsets

    from the outer rect's edges (left, top, right, bottom). UV space is 0-1 for

    the source texture, with the same four borders given as normalized fractions

    in <code class="paramref">uvBorders</code>.
  example: []
  syntax:
    content: public void AddNineSlice(Rect outer, Float4 inner, Float4 uvBorders, Color tint)
    parameters:
    - id: outer
      type: Prowl.Vector.Rect
    - id: inner
      type: Prowl.Vector.Float4
    - id: uvBorders
      type: Prowl.Vector.Float4
    - id: tint
