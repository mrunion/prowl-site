  type: Method
  source:
    remote:
      path: Prowl.Runtime/Game.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: RunHeadless
    path: ../Prowl/Prowl.Runtime/Game.cs
    startLine: 282
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Runs the game without a window, graphics device or audio - only the simulation loop

    (gameplay, physics, scripts). Intended for dedicated servers and for headless build

    verification. The loop runs until <xref href="Prowl.Runtime.Game.RequestHeadlessQuit" data-throw-if-not-resolved="false"></xref> / Ctrl+C, or until the

    frame/time limit in <code class="paramref">options</code> is reached.
  example: []
  syntax:
    content: public void RunHeadless(HeadlessRunOptions? options = null)
    parameters:
    - id: options
      type: Prowl.Runtime.HeadlessRunOptions
    content.vb: Public Sub RunHeadless(options As HeadlessRunOptions = Nothing)
  overload: Prowl.Runtime.Game.RunHeadless*
