    path: ../Prowl/Prowl.Runtime/Game.cs
    startLine: 462
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Called each frame right before <code>Paper.BeginFrame</code>. Sets Paper's logical resolution

    to the window's logical size (OS points) and <code>DisplayFramebufferScale</code> to

    <xref href="Prowl.Runtime.Window.ContentScale" data-throw-if-not-resolved="false"></xref>. Quill's <code>TransformPoint</code> multiplies every vertex

    by <code>DisplayFramebufferScale</code>, so vertices span <code>[0, winSize × cs]</code> =

    <code>[0, fbSize]</code>, exactly matching the orthographic projection set up by

    <xref href="Prowl.Runtime.GUI.PaperRenderer.UpdateProjection(System.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.


    <p>

    A widget declared <code>Width(100)</code> occupies 100 logical points = 100 physical pixels at

    1× DPI and 200 physical pixels at 2× (Retina) DPI the same physical size on screen

    regardless of display density, with higher pixel quality on HiDPI displays.

    </p>
  example: []
  syntax:
    content: protected virtual void PreparePaperFrame()
    content.vb: Protected Overridable Sub PreparePaperFrame()
  overload: Prowl.Runtime.Game.PreparePaperFrame*
