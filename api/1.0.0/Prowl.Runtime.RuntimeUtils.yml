- uid: Prowl.Runtime.RuntimeUtils.ResolveType(System.String)
  commentId: M:Prowl.Runtime.RuntimeUtils.ResolveType(System.String)
  id: ResolveType(System.String)
  parent: Prowl.Runtime.RuntimeUtils
  langs:
  - csharp
  - vb
  name: ResolveType(string)
  nameWithType: RuntimeUtils.ResolveType(string)
  fullName: Prowl.Runtime.RuntimeUtils.ResolveType(string)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Utils/RuntimeUtils.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: ResolveType
    path: ../Prowl/Prowl.Runtime/Utils/RuntimeUtils.cs
    startLine: 164
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Resolves a type from an assembly-qualified name across ALL loaded assembly load contexts,

    including the collectible context user scripts are loaded into. <xref href="System.Type.GetType(System.String)" data-throw-if-not-resolved="false"></xref>

    can only bind names into the default context by CLR rule, so it returns null for any type

    declared in a user assembly - which is why persisted type names (asset entries, and anything

    else round-tripped through <xref href="System.Type.AssemblyQualifiedName" data-throw-if-not-resolved="false"></xref>) need this instead.
  remarks: >-
    Unlike <xref href="Prowl.Runtime.RuntimeUtils.FindType(System.String)" data-throw-if-not-resolved="false"></xref>, this honors the assembly recorded in the name and never falls

    back to a loose simple-name match, so it cannot return the wrong type when two assemblies

    declare types that share a name. Assemblies are matched on simple name only: a script assembly

    keeps its name but gets a fresh version and load context on every hot-reload, so matching full

    identity would miss it. Returns null rather than throwing for malformed or unloadable names.
  example: []
  syntax:
    content: public static Type? ResolveType(string assemblyQualifiedName)
    parameters:
    - id: assemblyQualifiedName
      type: System.String
    return:
      type: System.Type
    content.vb: Public Shared Function ResolveType(assemblyQualifiedName As String) As Type
  overload: Prowl.Runtime.RuntimeUtils.ResolveType*
  nameWithType.vb: RuntimeUtils.ResolveType(String)
  fullName.vb: Prowl.Runtime.RuntimeUtils.ResolveType(String)
  name.vb: ResolveType(String)
