- uid: Prowl.Runtime.Test.NavMeshCollectorTests.Terrain_NavMeshTracksTheSurfaceItCovers
  commentId: M:Prowl.Runtime.Test.NavMeshCollectorTests.Terrain_NavMeshTracksTheSurfaceItCovers
  id: Terrain_NavMeshTracksTheSurfaceItCovers
  parent: Prowl.Runtime.Test.NavMeshCollectorTests
