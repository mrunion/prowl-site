  nameWithType: NavMeshCollectorTests.Terrain_NavMeshTracksTheSurfaceItCovers()
  fullName: Prowl.Runtime.Test.NavMeshCollectorTests.Terrain_NavMeshTracksTheSurfaceItCovers()
  type: Method
  source:
    remote:
      path: Prowl.Runtime.Test/NavMeshCollectorTests.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: Terrain_NavMeshTracksTheSurfaceItCovers
    path: ../Prowl/Prowl.Runtime.Test/NavMeshCollectorTests.cs
    startLine: 309
  assemblies:
  - Prowl.Runtime.Test
  namespace: Prowl.Runtime.Test
  summary: >-
    The navmesh has to track a curved surface, not stretch across it. Polygons carry height

    only at their corners, and region growing hands a whole hillside to one polygon, so without

    height detail the mesh spans dips as a flat sheet and sinks into rises — measured at nearly

    a metre on this terrain, which is gentle. Sampling the whole surface is what catches that:

    a spot check would land on a polygon corner and read exactly right.
  example: []
  syntax:
    content: >-
      [Fact]

      public void Terrain_NavMeshTracksTheSurfaceItCovers()
    content.vb: >-
      <Fact>

      Public Sub Terrain_NavMeshTracksTheSurfaceItCovers()
  overload: Prowl.Runtime.Test.NavMeshCollectorTests.Terrain_NavMeshTracksTheSurfaceItCovers*
  attributes:
  - type: Xunit.FactAttribute
    ctor: Xunit.FactAttribute.#ctor
    arguments: []
