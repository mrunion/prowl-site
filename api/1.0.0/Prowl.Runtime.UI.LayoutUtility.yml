  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.UI
  summary: >-
    Resolves the sizes the layout system arranges against: <xref href="Prowl.Runtime.UI.ILayoutElement" data-throw-if-not-resolved="false"></xref> components take

    priority (a nested <xref href="Prowl.Runtime.UI.LayoutGroup" data-throw-if-not-resolved="false"></xref> reports its content size this way), otherwise the

    element's intrinsic size (its <xref href="Prowl.Vector.RectTransform.SizeDelta" data-throw-if-not-resolved="false"></xref> on axes with fixed anchors).
  remarks: >-
    Results are memoized for the duration of one canvas layout pass. A nested group answers a size query

    by querying all of its own children, so without the memo the cost multiplies at every nesting level -

    each of the three queries below would re-walk the entire subtree beneath it.
