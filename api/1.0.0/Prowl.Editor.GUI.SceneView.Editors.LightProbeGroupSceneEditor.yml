  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.GUI.SceneView.Editors
  summary: >-
    Scene-view editor for <xref href="Prowl.Runtime.LightProbeGroup" data-throw-if-not-resolved="false"></xref>: click to

    select probes (Shift adds, Ctrl toggles), drag the position handle to move the selection, and

    Add / Delete / Duplicate / Select-All from the toolbar or keyboard. Built on the public

    <xref href="Prowl.Editor.GUI.SceneView.TransformHandles" data-throw-if-not-resolved="false"></xref> transform API (dogfooding it for a non-GameObject target).
  example: []
  syntax:
    content: >-
      [ComponentSceneTool(typeof(LightProbeGroup))]

      public class LightProbeGroupSceneEditor : SceneTool
    content.vb: >-
      <ComponentSceneTool(GetType(LightProbeGroup))>

      Public Class LightProbeGroupSceneEditor Inherits SceneTool
