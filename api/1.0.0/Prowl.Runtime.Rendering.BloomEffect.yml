  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Weights the first blur by brightness so single pixel sparkles can't flicker the bloom.
        Also dims small bright sources noticeably, so leave it off unless sparkles are a problem.
  example: []
  syntax:
    content: public bool AntiFlicker
    return:
      type: System.Boolean
    content.vb: Public AntiFlicker As Boolean
