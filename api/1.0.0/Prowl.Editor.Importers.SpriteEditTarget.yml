  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Importers
  summary: >-
    Set when <xref href="Prowl.Editor.Importers.SpriteEditTarget.Settings" data-throw-if-not-resolved="false"></xref> has been edited and not yet folded back into the
        texture's import-settings compound. The compound is what the inspector diffs to decide whether
        anything needs applying, so this only marks "needs re-serializing", not "needs saving".
  example: []
  syntax:
    content: public bool Dirty
    return:
      type: System.Boolean
    content.vb: Public Dirty As Boolean
