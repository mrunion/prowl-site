  summary: >-
    An asset is editor-only (excluded from build packaging by default - see <xref href="Prowl.Editor.Build.AssetCollector.Collect(Prowl.Editor.EditorAssetBackend%2cSystem.Collections.Generic.List%7bSystem.Guid%7d%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref>'s

    "still needed" check for the dependency override) when it lives under an Editor/ folder, or when

    its importer declares <xref href="Prowl.Editor.Importers.AssetImporter.IsEditorOnlyAsset" data-throw-if-not-resolved="false"></xref> (scripts, plugins,

    assembly definitions - things that aren't real runtime data assets).
