  fullName: Prowl.Runtime.Test.NavMeshLinkTests.Links_MarkedFromAChangeHandler_SurviveTheDrain()
  type: Method
  source:
    remote:
      path: Prowl.Runtime.Test/NavMeshLinkTests.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: Links_MarkedFromAChangeHandler_SurviveTheDrain
    path: ../Prowl/Prowl.Runtime.Test/NavMeshLinkTests.cs
    startLine: 179
  assemblies:
  - Prowl.Runtime.Test
  namespace: Prowl.Runtime.Test
  summary: >-
    Draining the batch raises NavMeshChanged, and a handler is free to disable a link from it —

    which marks tiles while the drain is still running. Those marks have to survive: the batch

    is swapped out before draining, so they land in the next frame's instead of being dropped

    when this one finishes. (A handler that dirties a surface not already in the batch would

    also have mutated the collection mid-enumeration; the swap covers both, this covers the

    half that is deterministic to reproduce.)
  example: []
  syntax:
    content: >-
      [Fact]

      public void Links_MarkedFromAChangeHandler_SurviveTheDrain()
    content.vb: >-
      <Fact>

      Public Sub Links_MarkedFromAChangeHandler_SurviveTheDrain()
  overload: Prowl.Runtime.Test.NavMeshLinkTests.Links_MarkedFromAChangeHandler_SurviveTheDrain*
