    path: ../Prowl/Prowl.Runtime/Navigation/NavMeshWorld.cs
    startLine: 28
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Per-scene navigation state: the registered navmeshes, the query API over them, and (once

    agents register) the crowd simulation. Owned by <xref href="Prowl.Runtime.Resources.Scene.Navigation" data-throw-if-not-resolved="false"></xref> the

    same way physics state is owned by <xref href="Prowl.Runtime.Resources.Scene.Physics" data-throw-if-not-resolved="false"></xref>.


    <p></p>


    Queries are thread-safe: each takes a pooled Detour query under a read lock, so gameplay

    code may path-find from worker threads. Tile mutations take the write lock and invalidate

    pooled queries.
