  type: Method
  source:
    remote:
      path: Prowl.Editor/EditorRegistries.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: FindSceneDropHandler
    path: ../Prowl/Prowl.Editor/EditorRegistries.cs
    startLine: 616
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor
  summary: >-
    The handler registered closest to <code class="paramref">assetType</code> in its inheritance chain.

    Specificity decides, not registration order, so an asset type that derives from another

    (Model from PrefabAsset) is not captured by the handler for its base just because that one was

    registered with a lower Order. Order still breaks ties between equally specific handlers.
