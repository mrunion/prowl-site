  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Importers
  summary: >-
    Reads a texture's alpha channel into an 8-bit, bottom-left-origin grid (length <code>w*h</code>), or null

    if readback fails / the format is unsupported. Shared by the slicing tools and the importer's

    tight-mesh pass. Requires a GL context (returns null off the render thread).
  example: []
  syntax:
    content: public static byte[]? ReadAlpha(Texture2D tex)
    parameters:
    - id: tex
      type: Prowl.Runtime.Resources.Texture2D
    return:
      type: System.Byte[]
    content.vb: Public Shared Function ReadAlpha(tex As Texture2D) As Byte()
