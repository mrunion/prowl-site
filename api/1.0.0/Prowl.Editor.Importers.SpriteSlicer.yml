  summary: >-
    Auto-slicing tools that generate a fresh list of <xref href="Prowl.Editor.Importers.SpriteSliceData" data-throw-if-not-resolved="false"></xref> rects from a texture.

    Grid parameters use top-left display space; results are <xref href="Prowl.Runtime.Resources.SpriteRect" data-throw-if-not-resolved="false"></xref>s in bottom-left / UV

    space. Tools that skip empty cells (and the Automatic tool) need the texture's alpha, read via

    <xref href="Prowl.Editor.Importers.SpriteSlicer.ReadAlpha(Prowl.Runtime.Resources.Texture2D)" data-throw-if-not-resolved="false"></xref> (shared with the importer's tight-mesh path).
