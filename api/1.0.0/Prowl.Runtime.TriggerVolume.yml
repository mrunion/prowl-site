  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    A non-solid sensor volume. It does not collide with or push anything; instead it queries the physics

    world each fixed step for overlapping rigidbodies and raises enter/stay/exit events. Use it for pickups,

    checkpoints, damage zones, detectors, and similar gameplay triggers.


    Only bodies that can be identified (a <xref href="Prowl.Runtime.Rigidbody3D" data-throw-if-not-resolved="false"></xref>) are reported. Static geometry shares a

    per-layer body and has no component to hand back, so it is ignored. <xref href="Prowl.Runtime.CharacterController" data-throw-if-not-resolved="false"></xref>s have

    no body, so they are tested directly and reported through the separate character callbacks.
  example: []
  syntax:
    content: >-
      [AddComponentMenu("Physics/Trigger Volume", "")]

      [ComponentIcon("")]

      public sealed class TriggerVolume : MonoBehaviour, IDisposable, ISerializationCallbackReceiver
    content.vb: >-
      <AddComponentMenu("Physics/Trigger Volume", "")>

      <ComponentIcon("")>

      Public NotInheritable Class TriggerVolume Inherits MonoBehaviour Implements IDisposable, ISerializationCallbackReceiver
