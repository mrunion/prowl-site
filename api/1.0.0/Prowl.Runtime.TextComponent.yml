  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Retained-mode text element. Produces one textured quad per glyph using Scribe's

    <xref href="Prowl.Scribe.FontSystem" data-throw-if-not-resolved="false"></xref> for shaping/atlas allocation; the resulting mesh is drawn

    through the standard UI pipeline (the <code>Default/DefaultText</code> shader sampling the

    shared glyph atlas owned by <xref href="Prowl.Runtime.UI.UIFontSystem" data-throw-if-not-resolved="false"></xref>).
  example: []
  syntax:
    content: >-
      [AddComponentMenu("UI/Text", "")]

      [ComponentIcon("T")]

      public class TextComponent : Graphic, IDisposable, ISerializationCallbackReceiver, IColorTint, ILayoutElement
