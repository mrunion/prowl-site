    id: ContentVersion
    path: ../Prowl/Prowl.Runtime/Components/UI/TextComponent.cs
    startLine: 87
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    When Scribe grows the atlas (a new glyph or pixel-size variant) every existing AtlasGlyph UV is

    recomputed against the new texture dimensions, so any cached glyph mesh points at the wrong

    region. Reporting the atlas version here makes the canvas re-bake this text in both play and

    edit mode.
  example: []
  syntax:
    content: public override int ContentVersion { get; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Overrides ReadOnly Property ContentVersion As Integer
