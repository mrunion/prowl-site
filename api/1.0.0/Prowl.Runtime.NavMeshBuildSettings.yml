  summary: >-
    The resolved input to a bake: an agent type's physical envelope plus the surface-level

    rasterization overrides, composed by <xref href="Prowl.Runtime.NavMeshAgentTypes.GetBuildSettings(System.Int32%2cProwl.Runtime.NavMeshBuildOverrides)" data-throw-if-not-resolved="false"></xref>. A baked

    <xref href="Prowl.Runtime.NavMeshData" data-throw-if-not-resolved="false"></xref> keeps a snapshot, so later edits to the agent table or the surface do

    not change what an existing navmesh was built with.
