  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Build a complete navmesh from geometry sources. Returns null when nothing walkable was

    produced (no geometry, all down-facing, cancelled) — never an empty NavMeshData.
  example: []
  syntax:
    content: public static NavMeshData? Build(NavMeshBuildSettings settings, IReadOnlyList<NavMeshGeometrySource> sources, int defaultArea = 0, int threads = 0, CancellationToken cancellation = default, AABB? worldBounds = null, IReadOnlyList<NavMeshAreaVolume>? volumes = null, IReadOnlyList<NavMeshLinkSource>? links = null)
    parameters:
    - id: settings
      type: Prowl.Runtime.NavMeshBuildSettings
      description: Agent envelope + voxelization parameters. Snapshotted into the result.
    - id: sources
      type: System.Collections.Generic.IReadOnlyList{Prowl.Runtime.NavMeshGeometrySource}
      description: Collected geometry. Vertices are transformed by each source's matrix during flattening.
    - id: defaultArea
      type: System.Int32
      description: Area for sources that don't specify one (see <xref href="Prowl.Runtime.NavMeshAreas" data-throw-if-not-resolved="false"></xref>).
    - id: threads
      type: System.Int32
      description: Worker threads for tile building. 0 or 1 builds single-threaded (deterministic tile order).
    - id: cancellation
      type: System.Threading.CancellationToken
      description: Cancels between tiles; a cancelled build returns null.
    - id: worldBounds
      type: System.Nullable{Prowl.Vector.AABB}
      description: >-
        Explicit XZ extent for the tile grid. Size the grid from this rather
            than from the geometry so <code>RebuildTiles</code> can add tiles anywhere inside it later. The
            vertical range still unions with the geometry.
    - id: volumes
      type: System.Collections.Generic.IReadOnlyList{Prowl.Runtime.NavMeshAreaVolume}
      description: >-
        Convex area volumes stamped over the rasterized geometry. They never
            create walkable surface; a Not Walkable volume erases it.
    - id: links
      type: System.Collections.Generic.IReadOnlyList{Prowl.Runtime.NavMeshLinkSource}
      description: >-
        Off-mesh connections, placed in the tile containing their start point and
            re-injected as each tile is contoured — runtime tiles rebuild from geometry-only layers.
    return:
      type: Prowl.Runtime.NavMeshData
