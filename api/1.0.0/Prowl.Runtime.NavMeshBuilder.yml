    id: BuildTilesInBounds
    path: ../Prowl/Prowl.Runtime/Navigation/NavMeshBuilder.cs
    startLine: 161
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Rebuild the compressed layers of the tiles intersecting

    <code class="paramref">worldMin</code>..<code class="paramref">worldMax</code> against fresh geometry, keeping

    the original bake's tile grid. A region entirely outside the baked bounds is a no-op, since

    growing the bounds needs a full rebuild. Returns one entry per affected tile; an empty

    layer list means the tile is now empty. Apply with <xref href="Prowl.Runtime.NavMeshSurface.ApplyRebuiltTiles(System.Collections.Generic.IReadOnlyList%7bProwl.Runtime.NavMeshTileRebuild%7d)" data-throw-if-not-resolved="false"></xref>,

    which refreshes obstacle state so existing carves re-apply to the regenerated tiles.


    <p></p>


    XZ anchors to the ORIGINAL bake bounds, never the current geometry, or tile (0,0) shifts and

    every tile misaligns against the live navmesh. Y follows the current geometry because Recast

    clips spans to the heightfield's vertical range.
  example: []
  syntax:
    content: public static List<NavMeshTileRebuild> BuildTilesInBounds(NavMeshData data, IReadOnlyList<NavMeshGeometrySource> sources, Float3 worldMin, Float3 worldMax, int defaultArea = 0, CancellationToken cancellation = default, IReadOnlyList<NavMeshAreaVolume>? volumes = null)
    parameters:
    - id: data
      type: Prowl.Runtime.NavMeshData
    - id: sources
      type: System.Collections.Generic.IReadOnlyList{Prowl.Runtime.NavMeshGeometrySource}
    - id: worldMin
      type: Prowl.Vector.Float3
    - id: worldMax
      type: Prowl.Vector.Float3
    - id: defaultArea
      type: System.Int32
    - id: cancellation
      type: System.Threading.CancellationToken
    - id: volumes
      type: System.Collections.Generic.IReadOnlyList{Prowl.Runtime.NavMeshAreaVolume}
    return:
      type: System.Collections.Generic.List{Prowl.Runtime.NavMeshTileRebuild}
    content.vb: Public Shared Function BuildTilesInBounds(data As NavMeshData, sources As IReadOnlyList(Of NavMeshGeometrySource), worldMin As Float3, worldMax As Float3, defaultArea As Integer = 0, cancellation As CancellationToken = Nothing, volumes As IReadOnlyList(Of NavMeshAreaVolume) = Nothing) As List(Of NavMeshTileRebuild)
