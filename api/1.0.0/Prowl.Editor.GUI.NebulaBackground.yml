  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.GUI
  summary: >-
    The single editor-backdrop draw path, shared by the editor shell and the launcher: applies
        the theme settings, advances the animation (respecting speed / frozen), then paints the animated
        nebula, a static nebula, a gradient, a solid colour or a wallpaper image per the Effects settings.
        <code class="paramref">showStarsAndComets</code> is true for the launcher and false inside a project.
  example: []
  syntax:
    content: public static void DrawEditorBackground(Paper paper, NebulaBackground nebula, string id, float w, float h, float dt, bool showStarsAndComets)
