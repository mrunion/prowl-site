      type: System.String
    - id: w
      type: System.Single
    - id: h
      type: System.Single
    - id: dt
      type: System.Single
    - id: showStarsAndComets
      type: System.Boolean
    content.vb: Public Shared Sub DrawEditorBackground(paper As Paper, nebula As NebulaBackground, id As String, w As Single, h As Single, dt As Single, showStarsAndComets As Boolean)
