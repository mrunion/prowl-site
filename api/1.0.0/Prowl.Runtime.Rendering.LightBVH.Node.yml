  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Stackless rope BVH node. Layout matches the GPU exactly (2 float4):
      <code>(Min.xyz, Hit) / (Max.xyz, Miss)</code>.

    <p>

    Internal: <code>Hit</code> = first child index, <code>Miss</code> = escape index.

    Leaf:     <code>Hit</code> = encoded slot ( <code>-(slot+1)</code> ), <code>Miss</code> = escape index.

    Escape index of -1 = "traversal complete".

    </p>
