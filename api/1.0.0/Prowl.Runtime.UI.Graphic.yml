    path: ../Prowl/Prowl.Runtime/Components/UI/Graphic.cs
    startLine: 19
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.UI
  summary: >-
    Base for every UI element that actually draws something. Owns the tint, the optional material

    override, and whether the element takes part in pointer hit-testing.
  remarks: >-
    Behaviours that produce no geometry (layout groups, <xref href="Prowl.Runtime.UI.CanvasGroup" data-throw-if-not-resolved="false"></xref>, <xref href="Prowl.Runtime.UI.RectMask" data-throw-if-not-resolved="false"></xref>,

    <xref href="Prowl.Runtime.UI.Selectable" data-throw-if-not-resolved="false"></xref>) derive from <xref href="Prowl.Runtime.UI.UIBehaviour" data-throw-if-not-resolved="false"></xref> directly and are never raycast targets,

    so a bare layout panel no longer swallows clicks meant for what is behind it.
  example: []
  syntax:
    content: 'public abstract class Graphic : UIBehaviour, IDisposable, ISerializationCallbackReceiver, IColorTint'
    content.vb: Public MustInherit Class Graphic Inherits UIBehaviour Implements IDisposable, ISerializationCallbackReceiver, IColorTint
