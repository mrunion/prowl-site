  commentId: M:Prowl.Runtime.Resources.Mesh.EnsureInstanceVAO(System.Int32,Prowl.Runtime.GraphicsBuffer@)
  id: EnsureInstanceVAO(System.Int32,Prowl.Runtime.GraphicsBuffer@)
