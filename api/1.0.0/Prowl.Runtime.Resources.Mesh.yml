  langs:
  - csharp
  - vb
  name: EnsureInstanceVAO(int, out GraphicsBuffer)
  nameWithType: Mesh.EnsureInstanceVAO(int, out GraphicsBuffer)
  fullName: Prowl.Runtime.Resources.Mesh.EnsureInstanceVAO(int, out Prowl.Runtime.GraphicsBuffer)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Resources/Mesh.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: EnsureInstanceVAO
    path: ../Prowl/Prowl.Runtime/Resources/Mesh.cs
    startLine: 671
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: >-
    Ensures the instanced rendering VAO and buffer exist for this mesh with

    enough capacity for <code class="paramref">instanceCount</code> instances. Does NOT

    upload data caller must encode a <code>cmd.UpdateBuffer(instanceBuffer, ...)</code>

    in the same CommandBuffer as their <code>cmd.DrawIndexedInstanced</code> so the

    upload is sequenced against the draw.


    <p>

    The instanceBuffer is shared per-mesh across all InstancedMeshRenderables

    using this mesh. Multiple batches can encode different uploads + draws into

    one CommandBuffer; the executor processes them in order so each draw sees

    its own data. If <code class="paramref">instanceCount</code> exceeds current capacity,

    the old buffer is queued for DEFERRED dispose (after frame end) so previously

    encoded commands holding the old handle still execute against valid GL state.

    </p>
  example: []
  syntax:
    content: public GraphicsVertexArray EnsureInstanceVAO(int instanceCount, out GraphicsBuffer instanceBuf)
    parameters:
    - id: instanceCount
      type: System.Int32
      description: Maximum number of instances this call needs to draw.
    - id: instanceBuf
      type: Prowl.Runtime.GraphicsBuffer
      description: 'Output: the instance buffer to upload data into via cmd.UpdateBuffer.'
    return:
      type: Prowl.Runtime.GraphicsVertexArray
      description: The instanced VAO to bind for drawing.
    content.vb: Public Function EnsureInstanceVAO(instanceCount As Integer, instanceBuf As GraphicsBuffer) As GraphicsVertexArray
  overload: Prowl.Runtime.Resources.Mesh.EnsureInstanceVAO*
  nameWithType.vb: Mesh.EnsureInstanceVAO(Integer, GraphicsBuffer)
  fullName.vb: Prowl.Runtime.Resources.Mesh.EnsureInstanceVAO(Integer, Prowl.Runtime.GraphicsBuffer)
  name.vb: EnsureInstanceVAO(Integer, GraphicsBuffer)
