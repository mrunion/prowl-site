  source:
    remote:
      path: Prowl.Runtime/Components/Physics/TerrainCollider.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: LocalToWorld
    path: ../Prowl/Prowl.Runtime/Components/Physics/TerrainCollider.cs
    startLine: 48
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    The grid placement, refreshed from the transform once per frame rather than read per query. The

    broad phase samples this from Jitter's worker threads, and Transform's cached world matrix is not

    safe to touch concurrently; caching also keeps the per-sample height lookup off it entirely.


    <p></p>


    The grid is defined in terrain-local space, so position, rotation and scale all live in these

    matrices rather than being baked into the samples. That is what lets terrain be turned to any

    orientation and still collide correctly.
  example: []
  syntax:
    content: public Float4x4 LocalToWorld { get; }
    parameters: []
    return:
      type: Prowl.Vector.Float4x4
    content.vb: Public ReadOnly Property LocalToWorld As Float4x4
  overload: Prowl.Runtime.TerrainCollider.LocalToWorld*
  implements:
  - Prowl.Runtime.ITerrainHeightProvider.LocalToWorld
