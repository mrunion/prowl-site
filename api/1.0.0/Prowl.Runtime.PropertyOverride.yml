  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Which member of which object this overrides, relative to the instance root.


    <p></p>


    Format: <code>{objectSourceId}/{componentSourceId}/{memberPath}</code>, or

    <code>{objectSourceId}/$/{memberPath}</code> for a member of the GameObject itself. The source

    identifiers say which prefab object each part addresses, so the path survives objects being

    added, removed or reordered on either side.
  example: []
  syntax:
    content: >-
      [SerializeField]

      public string Path
    return:
      type: System.String
    content.vb: >-
      <SerializeField>

      Public Path As String
