  namespace: Prowl.Editor.Build
  summary: Runs the dotnet CLI, streaming its output and reporting any diagnostic it emits.
  example: []
  syntax:
    content: protected static Task<(int exitCode, string stdout, string stderr)> RunDotnetAsync(string arguments, BuildProgress? progress = null, CancellationToken cancellation = default, Action<BuildIssue>? onDiagnostic = null, BuildStage stage = default)
    parameters:
    - id: arguments
      type: System.String
    - id: progress
      type: Prowl.Editor.Build.BuildProgress
    - id: cancellation
      type: System.Threading.CancellationToken
    - id: onDiagnostic
      type: System.Action{Prowl.Editor.Build.BuildIssue}
      description: >-
        Receives each parsed diagnostic with its code, file and line. Diagnostics are recognised by

        MSBuild's canonical format rather than by searching for a substring, which is why the process is

        pinned to an invariant UI language: the severity words are localised otherwise.
    - id: stage
      type: Prowl.Editor.Build.BuildStage
    return:
      type: System.Threading.Tasks.Task{System.ValueTuple{System.Int32,System.String,System.String}}
