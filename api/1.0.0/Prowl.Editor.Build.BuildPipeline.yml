  source:
    remote:
      path: Prowl.Editor/Projects/Build/BuildPipeline.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: PlanStageAsync
    path: ../Prowl/Prowl.Editor/Projects/Build/BuildPipeline.cs
    startLine: 51
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Build
  summary: >-
    The work for one stage, streamed so a large project never materialises every operation at once.

    Must yield in a stable order for identical inputs, or the build stops being reproducible.
  remarks: >-
    Planning is interleaved with execution rather than done once up front. A single plan can only

    describe a build that copies files it already knows about; the moment assets are processed, a

    later stage cannot be planned until an earlier one has run, because it does not yet know what

    was produced.
  example: []
  syntax:
    content: public abstract IAsyncEnumerable<BuildOperation> PlanStageAsync(BuildStage stage, IBuildContext context, CancellationToken ct)
    parameters:
    - id: stage
      type: Prowl.Editor.Build.BuildStage
    - id: context
      type: Prowl.Editor.Build.IBuildContext
    - id: ct
      type: System.Threading.CancellationToken
    return:
      type: System.Collections.Generic.IAsyncEnumerable{Prowl.Editor.Build.BuildOperation}
    content.vb: Public MustOverride Function PlanStageAsync(stage As BuildStage, context As IBuildContext, ct As CancellationToken) As IAsyncEnumerable(Of BuildOperation)
  overload: Prowl.Editor.Build.BuildPipeline.PlanStageAsync*
