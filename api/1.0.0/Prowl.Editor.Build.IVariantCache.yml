  type: Method
  source:
    remote:
      path: Prowl.Editor/Projects/Build/Assets/IVariantCache.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: PruneAsync
    path: ../Prowl/Prowl.Editor/Projects/Build/Assets/IVariantCache.cs
    startLine: 55
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Build
  summary: >-
    Discards whatever the cache no longer wants to keep, by its own policy. Returns how many entries

    went.
  remarks: >-
    A cache keyed by content grows without bound otherwise. Every edit of an asset produces a new key

    and leaves the previous variant behind, and nothing will ever ask for it again. On the interface

    rather than only on the local implementation, because a shared cache has the same problem and the

    caller should not have to know which kind it is holding.
  example: []
  syntax:
    content: ValueTask<int> PruneAsync(CancellationToken ct = default)
    parameters:
    - id: ct
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.ValueTask{System.Int32}
    content.vb: Function PruneAsync(ct As CancellationToken = Nothing) As ValueTask(Of Integer)
  overload: Prowl.Editor.Build.IVariantCache.PruneAsync*
