- uid: Prowl.Runtime.Rendering.RenderingData.FallbackTarget
  commentId: F:Prowl.Runtime.Rendering.RenderingData.FallbackTarget
  id: FallbackTarget
  parent: Prowl.Runtime.Rendering.RenderingData
  langs:
  - csharp
  - vb
  name: FallbackTarget
  nameWithType: RenderingData.FallbackTarget
  fullName: Prowl.Runtime.Rendering.RenderingData.FallbackTarget
  type: Field
  source:
    remote:
      path: Prowl.Runtime/Rendering/RenderPipeline.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: FallbackTarget
    path: ../Prowl/Prowl.Runtime/Rendering/RenderPipeline.cs
    startLine: 44
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Where this render goes when the camera has no <xref href="Prowl.Runtime.Camera.Target" data-throw-if-not-resolved="false"></xref> asset of its own.

    Null means the backbuffer. Set by whoever is presenting the camera - the Game View, the scene

    view, an asset preview.


    <p>

    It lives on the call rather than on the Camera on purpose. A per-render destination held as

    component state is reachable by anything that serializes the scene, and a camera saved pointing

    at a viewer's texture renders every frame into something nobody presents.

    </p>
  example: []
  syntax:
    content: public RenderTexture? FallbackTarget
    return:
      type: Prowl.Runtime.Resources.RenderTexture
    content.vb: Public FallbackTarget As RenderTexture
