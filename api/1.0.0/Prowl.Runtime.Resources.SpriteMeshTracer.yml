    path: ../Prowl/Prowl.Runtime/Resources/Sprite.cs
    startLine: 601
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: >-
    Ear-clipping triangulation of a simple polygon. Appends triangle indices (into <code class="paramref">poly</code>)

    to <code class="paramref">outIndices</code> and returns false if the polygon is degenerate. Holes aren't handled;

    a hole loop just triangulates as a solid, which is harmless since its texels are transparent.
  example: []
  syntax:
    content: public static bool Triangulate(Float2[] poly, List<int> outIndices)
    parameters:
    - id: poly
      type: Prowl.Vector.Float2[]
    - id: outIndices
      type: System.Collections.Generic.List{System.Int32}
    return:
      type: System.Boolean
    content.vb: Public Shared Function Triangulate(poly As Float2(), outIndices As List(Of Integer)) As Boolean
