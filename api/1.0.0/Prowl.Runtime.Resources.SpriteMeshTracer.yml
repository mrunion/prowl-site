  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: >-
    Extracts the opaque region's boundary as closed loops of grid-corner points. Each unit boundary

    between an opaque and a transparent (or out-of-bounds) cell becomes an oriented edge with the opaque

    side on its left; the edges are then stitched into loops. Outer loops wind counter-clockwise.
  example: []
  syntax:
    content: public static List<Float2[]> TraceContours(byte[] alpha, int width, int height, byte alphaThreshold = 1)
    parameters:
    - id: alpha
      type: System.Byte[]
    - id: width
      type: System.Int32
    - id: height
      type: System.Int32
    - id: alphaThreshold
      type: System.Byte
    return:
      type: System.Collections.Generic.List{Prowl.Vector.Float2[]}
    content.vb: Public Shared Function TraceContours(alpha As Byte(), width As Integer, height As Integer, alphaThreshold As Byte = 1) As List(Of Float2())
  overload: Prowl.Runtime.Resources.SpriteMeshTracer.TraceContours*
  nameWithType.vb: SpriteMeshTracer.TraceContours(Byte(), Integer, Integer, Byte)
  fullName.vb: Prowl.Runtime.Resources.SpriteMeshTracer.TraceContours(Byte(), Integer, Integer, Byte)
  name.vb: TraceContours(Byte(), Integer, Integer, Byte)
