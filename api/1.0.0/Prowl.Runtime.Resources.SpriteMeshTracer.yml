    path: ../Prowl/Prowl.Runtime/Resources/Sprite.cs
    startLine: 387
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: >-
    Traces + simplifies + triangulates a binary alpha mask. <code class="paramref">alpha</code> is row-major with a

    bottom-left origin (length <code>width*height</code>); a texel counts as opaque when its value is &gt;=

    <code class="paramref">alphaThreshold</code>. <code class="paramref">simplifyTolerance</code> is the maximum deviation (in

    pixels) allowed when collapsing the staircase outline into straight edges; higher = fewer vertices.
  example: []
  syntax:
    content: public static SpriteMeshTracer.TracedMesh Generate(byte[] alpha, int width, int height, byte alphaThreshold = 1, float simplifyTolerance = 1.5)
    parameters:
    - id: alpha
      type: System.Byte[]
    - id: width
      type: System.Int32
    - id: height
      type: System.Int32
    - id: alphaThreshold
      type: System.Byte
    - id: simplifyTolerance
      type: System.Single
    return:
      type: Prowl.Runtime.Resources.SpriteMeshTracer.TracedMesh
    content.vb: Public Shared Function Generate(alpha As Byte(), width As Integer, height As Integer, alphaThreshold As Byte = 1, simplifyTolerance As Single = 1.5) As SpriteMeshTracer.TracedMesh
