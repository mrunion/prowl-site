  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Importers
  summary: >-
    Generate every enabled feature for the mesh and attach them as sub-assets.

    Sub-asset names are <code>{meshName}_{featureKey}</code> for deterministic GUIDs

    across reimports.
  example: []
  syntax:
    content: public static void GenerateAll(Mesh mesh, EchoObject? settings, ImportContext ctx, string ownerIdentity)
    parameters:
    - id: mesh
      type: Prowl.Runtime.Resources.Mesh
    - id: settings
      type: Prowl.Echo.EchoObject
    - id: ctx
      type: Prowl.Editor.Importers.ImportContext
    - id: ownerIdentity
      type: System.String
      description: >-
        The sub-asset identity of the mesh these features belong to, so each
            feature keys off its owner plus its own spec key. Registration order would not do here: a feature
            that stops generating shifts every later one onto the wrong GUID.
    content.vb: Public Shared Sub GenerateAll(mesh As Mesh, settings As EchoObject, ctx As ImportContext, ownerIdentity As String)
