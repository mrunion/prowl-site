  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Build
  summary: Every pipeline the editor can build with, in a stable order.
  remarks: >-
    Constructed here rather than only reflected over, because a pipeline that cannot be constructed

    cannot be built with either, and the Build window needs a live instance for its name and icon

    anyway. One that throws is left out with a warning instead of being offered and failing later.
  example: []
  syntax:
    content: public static List<BuildPipeline> DiscoverPipelines()
    return:
      type: System.Collections.Generic.List{Prowl.Editor.Build.BuildPipeline}
    content.vb: Public Shared Function DiscoverPipelines() As List(Of BuildPipeline)
