  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Composite filter that chains multiple IBroadPhaseFilter instances together.

    All filters must return true for the collision to be allowed.

    Filters are evaluated in the order they were added.
  example: []
  syntax:
    content: 'public class CompositeBroadPhaseFilter : IBroadPhaseFilter'
    content.vb: Public Class CompositeBroadPhaseFilter Implements IBroadPhaseFilter
