  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Filters the collision by running all registered filters.

    Returns true only if all filters return true.

    If any filter returns false, processing stops immediately (short-circuit evaluation).
  example: []
  syntax:
    content: public bool Filter(IDynamicTreeProxy proxyA, IDynamicTreeProxy proxyB)
    parameters:
    - id: proxyA
      type: Jitter2.Collision.IDynamicTreeProxy
    - id: proxyB
      type: Jitter2.Collision.IDynamicTreeProxy
    return:
      type: System.Boolean
    content.vb: Public Function Filter(proxyA As IDynamicTreeProxy, proxyB As IDynamicTreeProxy) As Boolean
