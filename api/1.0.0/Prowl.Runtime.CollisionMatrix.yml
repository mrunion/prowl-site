  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Which layers collide with which, as a symmetric 32x32 bit matrix.


    <p></p>


    Process-global rather than per <xref href="Prowl.Runtime.PhysicsWorld" data-throw-if-not-resolved="false"></xref>, so every scene shares one matrix. That is

    deliberate (the editor exposes it as a project setting), but it does mean two scenes cannot disagree.
