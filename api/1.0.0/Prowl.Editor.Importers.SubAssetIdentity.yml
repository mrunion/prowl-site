  summary: >-
    A key that survives insertion and removal, because it belongs to the sub-asset rather than to its

    position: an ID persisted with the source (the Sprite Editor's per-slice ID) or an intrinsic one

    (a mesh feature's key). Compose a child's from its parent's - see <xref href="Prowl.Editor.Importers.ImportContext.AddSubAsset(System.String%2cProwl.Runtime.Asset%2cProwl.Editor.Importers.SubAssetIdentity)" data-throw-if-not-resolved="false"></xref>,

    which returns the identity it resolved.
