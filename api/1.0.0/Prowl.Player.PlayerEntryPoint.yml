  assemblies:
  - Prowl.Player.Desktop
  namespace: Prowl.Player
  summary: Installs dependency resolution, then starts the game.
  remarks: >-
    This method must not mention a type that pulls in a dependency living under <code>runtimes/</code>.

    Preparing a method loads every type in its body, and that happens before its first statement

    runs, so naming <xref href="Prowl.Player.DesktopPlayer" data-throw-if-not-resolved="false"></xref> here would demand Paper before the resolver that

    finds Paper has been installed. Hence the split, and hence the NoInlining on the other half.
