  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Build
  summary: >-
    Groups <code class="paramref">shipped</code> by which entry points reach it. An asset reached by exactly one

    entry point joins that entry point's chunk; one reached by several joins the shared chunk.
  example: []
  syntax:
    content: public static IReadOnlyList<AssetChunk> Plan(DependencyGraph dependencies, IReadOnlyList<Guid> scenes, IReadOnlyCollection<Guid> resources, IReadOnlySet<Guid> shipped, IReadOnlyDictionary<Guid, IReadOnlyList<Guid>> subAssets)
    parameters:
    - id: dependencies
      type: Prowl.Editor.DependencyGraph
    - id: scenes
      type: System.Collections.Generic.IReadOnlyList{System.Guid}
    - id: resources
      type: System.Collections.Generic.IReadOnlyCollection{System.Guid}
    - id: shipped
      type: System.Collections.Generic.IReadOnlySet{System.Guid}
    - id: subAssets
      type: System.Collections.Generic.IReadOnlyDictionary{System.Guid,System.Collections.Generic.IReadOnlyList{System.Guid}}
      description: >-
        Sub-assets by parent GUID. The dependency graph has no edge from a parent to the sub-assets it

        produced, so without this a texture's sprites reach no scene and every one of them falls into the

        common chunk instead of shipping beside the scene that pulled the texture in.
    return:
      type: System.Collections.Generic.IReadOnlyList{Prowl.Editor.Build.AssetChunk}
    content.vb: Public Shared Function Plan(dependencies As DependencyGraph, scenes As IReadOnlyList(Of Guid), resources As IReadOnlyCollection(Of Guid), shipped As IReadOnlySet(Of Guid), subAssets As IReadOnlyDictionary(Of Guid, IReadOnlyList(Of Guid))) As IReadOnlyList(Of AssetChunk)
