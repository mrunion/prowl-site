    path: ../Prowl/Prowl.Runtime/Resources/Cubemap.cs
    startLine: 17
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: >-
    A six-faced environment <xref href="Prowl.Runtime.Resources.Texture" data-throw-if-not-resolved="false"></xref>. Faces are square and indexed 0..5 in GL

    order: +X, -X, +Y, -Y, +Z, -Z. Supports a full mip chain (used by reflection probes to

    store a roughness-convolved, GGX-prefiltered environment) and can be rendered into per

    face and per mip via <xref href="Prowl.Runtime.Resources.Cubemap.GetFaceTarget(System.Int32%2cSystem.Int32%2cSystem.Boolean%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>. Made with a layer count it is a cubemap array,

    a <code>samplerCubeArray</code> holding that many cubes, which lives only at runtime and is never saved.
  example: []
  syntax:
    content: 'public sealed class Cubemap : Texture, IDisposable, ISerializable'
    content.vb: Public NotInheritable Class Cubemap Inherits Texture Implements IDisposable, ISerializable
