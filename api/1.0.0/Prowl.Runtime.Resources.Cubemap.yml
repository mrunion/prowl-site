  summary: >-
    A framebuffer that renders into one face at one mip level, of cube <code class="paramref">layer</code>
        in an array. With <code class="paramref">withDepth</code> it also attaches a shared depth buffer (sized to the
        full face) so scene geometry can depth-test during capture. Cached and reused;
        disposed with the cubemap.
