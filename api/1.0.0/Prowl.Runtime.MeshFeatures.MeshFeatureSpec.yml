  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.MeshFeatures
  summary: >-
    Registration contract for a mesh feature. Describes how to generate one and how

    its settings slot into the mesh/model importer settings blob.
  remarks: >-
    A concrete <xref href="Prowl.Runtime.MeshFeatures.MeshFeatureSpec" data-throw-if-not-resolved="false"></xref> subclass is discovered via reflection by

    <xref href="Prowl.Runtime.MeshFeatures.MeshFeatureRegistry" data-throw-if-not-resolved="false"></xref> and instantiated once. Bumping <xref href="Prowl.Runtime.MeshFeatures.MeshFeatureSpec.Version" data-throw-if-not-resolved="false"></xref>

    causes every mesh importer to reimport (cache invalidation rides on the aggregate

    version exposed by <xref href="Prowl.Runtime.MeshFeatures.MeshFeatureRegistry.AggregateVersion" data-throw-if-not-resolved="false"></xref>).
  example: []
  syntax:
    content: public abstract class MeshFeatureSpec
