  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Where the body's mass is centred, in metres along its own axes from its origin, or null for the origin itself.

    The body turns about this point and gravity pulls through it, while its colliders, its Transform and

    <xref href="Prowl.Runtime.Rigidbody3D.Position" data-throw-if-not-resolved="false"></xref> stay where they are. Changing it on a moving body keeps the body's motion, and rebuilds

    the joints on it.
  example: []
  syntax:
    content: public Float3? CenterOfMassOverride { get; set; }
    parameters: []
    return:
      type: System.Nullable{Prowl.Vector.Float3}
    content.vb: Public Property CenterOfMassOverride As Float3?
