    id: UIDropdown
    path: ../Prowl/Prowl.Runtime/Components/UI/Input/UIDropdown.cs
    startLine: 17
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.UI
  summary: >-
    A drop-down selector. Extends <xref href="Prowl.Runtime.UI.Selectable" data-throw-if-not-resolved="false"></xref> for the hover/press tint and shows the current

    choice in <xref href="Prowl.Runtime.UI.UIDropdown.CaptionText" data-throw-if-not-resolved="false"></xref>. Clicking opens a list, built under <xref href="Prowl.Runtime.UI.UIDropdown.OptionsRoot" data-throw-if-not-resolved="false"></xref> from

    the <xref href="Prowl.Runtime.UI.UIDropdown.Options" data-throw-if-not-resolved="false"></xref> strings; picking an item sets <xref href="Prowl.Runtime.UI.UIDropdown.Value" data-throw-if-not-resolved="false"></xref> and closes the list. The

    item GameObjects are created on demand at play time and reused between opens.
  example: []
  syntax:
    content: >-
      [AddComponentMenu("UI/Dropdown", "")]

      [ComponentIcon("")]

      public class UIDropdown : Selectable, IDisposable, ISerializationCallbackReceiver, IPointerEnterHandler, IPointerExitHandler, IPointerDownHandler, IPointerUpHandler, ISelectHandler, IDeselectHandler, IMoveHandler, IPointerClickHandler, ISubmitHandler, ICancelHandler
