  summary: >-
    Holds one live <xref href="Prowl.Editor.Importers.SpriteEditTarget" data-throw-if-not-resolved="false"></xref> per texture so the texture inspector and the Sprite Editor

    window edit the same <xref href="Prowl.Editor.Importers.SpriteImportSettings" data-throw-if-not-resolved="false"></xref> instance. The Sprite Editor just mutates it and

    flags it dirty; the inspector owns the actual "Save &amp; Reimport" (persist to <code>.meta</code> + reimport).
