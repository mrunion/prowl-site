    path: ../Prowl/Prowl.Editor/GUI/SceneView/EditorCamera.cs
    startLine: 71
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.GUI.SceneView
  summary: Swaps between perspective and orthographic without changing what is on screen.
  remarks: >-
    The two are tied together through the focus point: an orthographic half-height of

    <code>distance * tan(fov/2)</code> frames exactly what the perspective view framed at that distance,

    so the switch reads as a change of projection rather than a jump to somewhere else.
  example: []
  syntax:
    content: public void ToggleProjection()
    content.vb: Public Sub ToggleProjection()
  overload: Prowl.Editor.GUI.SceneView.EditorCamera.ToggleProjection*
