  namespace: Prowl.Editor.Projects.Scripting
  summary: >-
    Migrates a live scene onto recompiled user types with the <xref href="Prowl.Ember.ReloadEngine" data-throw-if-not-resolved="false"></xref>: the engine, the editor

    and the scene are all in scope, so the walk migrates the whole graph in place (component fields, identity, and

    delegates to user methods all carry over), then <xref href="Prowl.Runtime.Resources.Scene.OnHotReload" data-throw-if-not-resolved="false"></xref> re-derives per-frame membership

    from the new types. Both assemblies stay loaded, no unload required.
