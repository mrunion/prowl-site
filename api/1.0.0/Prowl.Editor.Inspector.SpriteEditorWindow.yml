  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Inspector
  summary: >-
    Dock window for editing a texture's sprites. Sprite config lives in the texture's <code>.meta</code>

    (via <xref href="Prowl.Editor.Importers.TextureSpriteMeta" data-throw-if-not-resolved="false"></xref>). In Multiple mode the canvas is a full authoring surface

    (drag to make rects, move/resize, slice); in Single mode there is one fixed full-texture rect and only

    the border + pivot are editable. Rects use corner + whole-edge resize handles, green border handles, and

    a draggable pivot. All edits are undoable; Save writes the meta and reimports.
  example: []
  syntax:
    content: 'public class SpriteEditorWindow : DockPanel'
    content.vb: Public Class SpriteEditorWindow Inherits DockPanel
