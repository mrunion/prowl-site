  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor
  summary: >-
    Generate a deterministic GUID for a sub-asset based on parent GUID + identity.

    Stable across reimports as long as the parent GUID and the identity don't change

    (see <xref href="Prowl.Editor.Importers.ImportContext.AddSubAsset(System.String%2cProwl.Runtime.Asset%2cProwl.Editor.Importers.SubAssetIdentity)" data-throw-if-not-resolved="false"></xref> for what makes a good identity).
