  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Importers
  summary: >-
    Walks a stored tree for the assets it names without building anything: <code>$asset</code> stubs are hard edges,

    <code>$assetRef</code> soft ones, and prefab links editor ones. The walk is needed even when a tracking context

    was used, because prefab override blobs are serialized ahead of time without one (see

    PrefabUtility.CompareField), so what is inside them never reached it.
  example: []
  syntax:
    content: public static void CollectAssetDependencies(EchoObject echo, ImportContext ctx)
    parameters:
    - id: echo
      type: Prowl.Echo.EchoObject
    - id: ctx
      type: Prowl.Editor.Importers.ImportContext
    content.vb: Public Shared Sub CollectAssetDependencies(echo As EchoObject, ctx As ImportContext)
  overload: Prowl.Editor.Importers.ImportHelper.CollectAssetDependencies*
