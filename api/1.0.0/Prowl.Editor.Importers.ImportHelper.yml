  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Importers
  summary: >-
    Removes the prefab link from any GameObject sitting inside another prefab instance. Prefabs do

    not nest, so such a link is left over from an asset written before that was enforced, and

    keeping it would have a player disagree with the editor about what is an instance.
  example: []
  syntax:
    content: public static bool FlattenNestedPrefabLinks(EchoObject echo, bool insideInstance = false)
    parameters:
    - id: echo
      type: Prowl.Echo.EchoObject
    - id: insideInstance
      type: System.Boolean
    return:
      type: System.Boolean
    content.vb: Public Shared Function FlattenNestedPrefabLinks(echo As EchoObject, insideInstance As Boolean = False) As Boolean
