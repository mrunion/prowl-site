  summary: >-
    Tests for the Runtime prefab surface: <xref href="Prowl.Runtime.GameObject.InstantiateDetached(Prowl.Runtime.Resources.PrefabAsset)" data-throw-if-not-resolved="false"></xref> (cloning, prefab-id

