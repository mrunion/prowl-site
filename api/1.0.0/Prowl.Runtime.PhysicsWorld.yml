    id: BakeMesh
    path: ../Prowl/Prowl.Runtime/Physics/PhysicsWorld.cs
    startLine: 83
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Bake (or fetch the cached) physics representation of a mesh. The bake is stored directly on

    the <xref href="Prowl.Runtime.Resources.Mesh" data-throw-if-not-resolved="false"></xref> instance (<xref href="Prowl.Runtime.Resources.Mesh.BakedPhysics" data-throw-if-not-resolved="false"></xref>), so its lifetime is tied to

    the mesh rather than a separate global cache. The result is shared by every collider that uses

    the mesh, so the bake happens once instead of per MeshCollider instance, and is rebuilt

    automatically when the mesh's <xref href="Prowl.Runtime.Resources.Mesh.Version" data-throw-if-not-resolved="false"></xref> changes.


    <p></p>


    Thread-safe. The bake is pure CPU work, so this may be called from worker threads to pre-bake

    meshes off the main thread (independent meshes bake in parallel; each mesh locks on itself).
  example: []
  syntax:
    content: public static BakedPhysicsMesh BakeMesh(Mesh mesh)
    parameters:
    - id: mesh
      type: Prowl.Runtime.Resources.Mesh
    return:
      type: Prowl.Runtime.BakedPhysicsMesh
    content.vb: Public Shared Function BakeMesh(mesh As Mesh) As BakedPhysicsMesh
  overload: Prowl.Runtime.PhysicsWorld.BakeMesh*
