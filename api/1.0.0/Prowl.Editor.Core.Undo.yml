- uid: Prowl.Editor.Core.Undo.CaptureCreatedObject(Prowl.Runtime.GameObject)
  commentId: M:Prowl.Editor.Core.Undo.CaptureCreatedObject(Prowl.Runtime.GameObject)
  id: CaptureCreatedObject(Prowl.Runtime.GameObject)
  parent: Prowl.Editor.Core.Undo
  langs:
  - csharp
  - vb
  name: CaptureCreatedObject(GameObject)
  nameWithType: Undo.CaptureCreatedObject(GameObject)
  fullName: Prowl.Editor.Core.Undo.CaptureCreatedObject(Prowl.Runtime.GameObject)
  type: Method
  source:
    remote:
      path: Prowl.Editor/Core/Undo.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: CaptureCreatedObject
    path: ../Prowl/Prowl.Editor/Core/Undo.cs
    startLine: 353
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Core
  summary: >-
    Build the undo/redo pair for a just-created GameObject without pushing it as its own step,

    so a compound operation can hand it to <xref href="Prowl.Editor.Core.Undo.RegisterActionGroup(System.String%2cSystem.Collections.Generic.IReadOnlyList%7bSystem.ValueTuple%7bSystem.Action%2cSystem.Action%7d%7d%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> together with the

    follow-up actions that depend on it (e.g. "Create Empty Parent" = new object + reparenting).

    Splitting those across two steps would let the object be destroyed while the objects moved

    under it still live there, taking them down with it.

    Unlike <xref href="Prowl.Editor.Core.Undo.RegisterCreatedObject(Prowl.Runtime.GameObject%2cSystem.String)" data-throw-if-not-resolved="false"></xref> this serializes immediately, so call it while the

    object is still in the state redo should restore it to - before the follow-up actions run.
  example: []
  syntax:
    content: public static (Action undo, Action redo) CaptureCreatedObject(GameObject go)
    parameters:
    - id: go
      type: Prowl.Runtime.GameObject
    return:
      type: System.ValueTuple{System.Action,System.Action}
    content.vb: Public Shared Function CaptureCreatedObject(go As GameObject) As (undo As Action, redo As Action)
  overload: Prowl.Editor.Core.Undo.CaptureCreatedObject*
