  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Core
  summary: >-
    Register several undo/redo actions as ONE undo step (so editing many selected objects in a single

    interaction collapses to a single undo). When <code class="paramref">coalesce</code> is true the step merges

    with the previous step if it has the same description and record count within the coalesce window

    (for continuous edits like dragging a multi-object transform field).
  example: []
  syntax:
    content: public static void RegisterActionGroup(string description, IReadOnlyList<(Action undo, Action redo)> actions, bool coalesce = false)
    parameters:
    - id: description
      type: System.String
    - id: actions
      type: System.Collections.Generic.IReadOnlyList{System.ValueTuple{System.Action,System.Action}}
    - id: coalesce
      type: System.Boolean
    content.vb: Public Shared Sub RegisterActionGroup(description As String, actions As IReadOnlyList(Of (undo As Action, redo As Action)), coalesce As Boolean = False)
