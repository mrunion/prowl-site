  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Collect geometry from a set of GameObjects (renderers or colliders per

    <code class="paramref">geometry</code>, plus terrain either way).
  example: []
  syntax:
    content: public static void Collect(IEnumerable<GameObject> objects, NavMeshCollectGeometry geometry, LayerMask layers, float voxelSize, int defaultArea, List<NavMeshGeometrySource> results, AABB? bounds = null, int agentTypeId = 0)
    parameters:
    - id: objects
      type: System.Collections.Generic.IEnumerable{Prowl.Runtime.GameObject}
      description: >-
        Objects to consider; disabled ones, and anything on or under a
            <xref href="Prowl.Runtime.NavMeshAgent" data-throw-if-not-resolved="false"></xref> or <xref href="Prowl.Runtime.NavMeshObstacle" data-throw-if-not-resolved="false"></xref>, are skipped.
    - id: geometry
      type: Prowl.Runtime.NavMeshCollectGeometry
      description: Scene representation to voxelize.
    - id: layers
      type: Prowl.Runtime.LayerMask
      description: Only objects on these layers contribute.
    - id: voxelSize
      type: System.Single
      description: Bake voxel size, used to decimate terrain sampling.
    - id: defaultArea
      type: System.Int32
      description: Area recorded on collected sources.
    - id: results
      type: System.Collections.Generic.List{Prowl.Runtime.NavMeshGeometrySource}
      description: Receives the collected sources.
    - id: bounds
      type: System.Nullable{Prowl.Vector.AABB}
      description: >-
        Optional world-space filter. Objects whose conservatively transformed
            local bounds miss it are skipped before any vertex work.
    - id: agentTypeId
      type: System.Int32
      description: >-
        The bake's agent type, used to decide which
            <xref href="Prowl.Runtime.NavMeshModifier" data-throw-if-not-resolved="false"></xref>s apply.
    content.vb: Public Shared Sub Collect(objects As IEnumerable(Of GameObject), geometry As NavMeshCollectGeometry, layers As LayerMask, voxelSize As Single, defaultArea As Integer, results As List(Of NavMeshGeometrySource), bounds As AABB? = Nothing, agentTypeId As Integer = 0)
