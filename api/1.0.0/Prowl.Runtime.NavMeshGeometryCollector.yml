  summary: >-
    Collect a terrain as a decimated height grid. Samples are spaced no finer than the bake

    voxel size — Recast re-voxelizes at that resolution anyway, so finer triangles are pure

    waste (a 1k heightmap would otherwise contribute ~2M triangles). Holes are skipped, and a

    bounds filter clips the sampled range rather than only rejecting the terrain outright, so a

    partial rebuild pays for its own tiles instead of the whole heightmap.


    <p></p>


    Heights come from <xref href="Prowl.Runtime.TerrainData" data-throw-if-not-resolved="false"></xref> in terrain-local space, placed by the object's

    transform exactly as <xref href="Prowl.Runtime.TerrainCollider" data-throw-if-not-resolved="false"></xref> places the physics heightfield — so a

    moved, rotated or scaled terrain walks where it's drawn and where it collides. Reading the

    asset (not the collider) is also what lets a bake with the editor open see terrain at all.
  example: []
  syntax:
    content: public static void CollectTerrain(TerrainComponent terrain, float voxelSize, int area, List<NavMeshGeometrySource> results, AABB? bounds = null)
    parameters:
    - id: terrain
      type: Prowl.Runtime.Terrain.TerrainComponent
    - id: voxelSize
      type: System.Single
    - id: area
      type: System.Int32
    - id: results
      type: System.Collections.Generic.List{Prowl.Runtime.NavMeshGeometrySource}
    - id: bounds
      type: System.Nullable{Prowl.Vector.AABB}
    content.vb: Public Shared Sub CollectTerrain(terrain As TerrainComponent, voxelSize As Single, area As Integer, results As List(Of NavMeshGeometrySource), bounds As AABB? = Nothing)
  overload: Prowl.Runtime.NavMeshGeometryCollector.CollectTerrain*
  nameWithType.vb: NavMeshGeometryCollector.CollectTerrain(TerrainComponent, Single, Integer, List(Of NavMeshGeometrySource), AABB?)
  fullName.vb: Prowl.Runtime.NavMeshGeometryCollector.CollectTerrain(Prowl.Runtime.Terrain.TerrainComponent, Single, Integer, System.Collections.Generic.List(Of Prowl.Runtime.NavMeshGeometrySource), Prowl.Vector.AABB?)
  name.vb: CollectTerrain(TerrainComponent, Single, Integer, List(Of NavMeshGeometrySource), AABB?)
