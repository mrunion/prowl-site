- uid: Prowl.Runtime.Application.TargetFrameRate
  commentId: P:Prowl.Runtime.Application.TargetFrameRate
  id: TargetFrameRate
  parent: Prowl.Runtime.Application
  langs:
  - csharp
  - vb
  name: TargetFrameRate
  nameWithType: Application.TargetFrameRate
  fullName: Prowl.Runtime.Application.TargetFrameRate
  type: Property
  source:
    remote:
      path: Prowl.Runtime/Application.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: TargetFrameRate
    path: ../Prowl/Prowl.Runtime/Application.cs
    startLine: 73
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Frames per second the loop is paced to, whether that loop is the editor's, a standalone

    game's or a headless server's. Zero or less runs unlimited, which is what a game starts at

    until its own code says otherwise. This is a ceiling, so with <xref href="Prowl.Runtime.Application.VSync" data-throw-if-not-resolved="false"></xref> on the

    lower of the two wins.


    <p>

    In the editor this belongs to the editor's own preferences until play mode starts, which

    hands it back to this default so the game's code decides, exactly as in a build.

    </p>
  example: []
  syntax:
    content: public static int TargetFrameRate { get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Shared Property TargetFrameRate As Integer
  overload: Prowl.Runtime.Application.TargetFrameRate*
