      repo: https://github.com/ProwlEngine/Prowl.git
    id: VSync
    path: ../Prowl/Prowl.Runtime/Application.cs
    startLine: 85
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Whether a frame is held back until the display is ready for it, which caps the rate to the

    refresh rate and removes tearing. Off in a game until its own code turns it on, and on in

    the editor unless its preferences say otherwise. Has nothing to act on when

    <xref href="Prowl.Runtime.Application.IsHeadless" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static bool VSync { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Shared Property VSync As Boolean
  overload: Prowl.Runtime.Application.VSync*
