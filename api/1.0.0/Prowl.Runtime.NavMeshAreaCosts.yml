  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Override an area's cost. Clamped to at least 1: Detour's heuristic is only admissible
        when nothing costs less than distance, so a lower cost silently produces worse paths. To prefer
        an area, raise the others instead.
  example: []
  syntax:
    content: public void SetAreaCost(int areaIndex, float cost)
    parameters:
    - id: areaIndex
      type: System.Int32
    - id: cost
      type: System.Single
