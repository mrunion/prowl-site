    startLine: 31
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Every asset by GUID, one object each for the whole session. Assets stay loaded while something reaches them:

    a live scene, an object kept with DontDestroyOnLoad, a hold, a root, or a load group. A walk from

    those roots runs about once a second, and an asset nothing reached for <xref href="Prowl.Runtime.AssetDatabase.GracePeriod" data-throw-if-not-resolved="false"></xref> has its payload

    freed, sooner when over <xref href="Prowl.Runtime.AssetDatabase.MemoryBudget" data-throw-if-not-resolved="false"></xref>. Reading an unloaded asset loads it again.
  example: []
  syntax:
    content: public static class AssetDatabase
    content.vb: Public Module AssetDatabase
