    startLine: 20
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Facade over the GL context and the <xref href="Prowl.Runtime.CommandBuffer" data-throw-if-not-resolved="false"></xref> system. Owns the

    <code>GL</code> wrapper and capability constants, hosts the render thread, and exposes

    resource constructors plus a few convenience encoders that wrap a one-op CB.

    Every GL mutation flows through a CommandBuffer to the executor on the render

    thread there are no direct GL calls outside this assembly.
  example: []
