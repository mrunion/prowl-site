    id: Screenshot
    path: ../Prowl/Prowl.Runtime/Graphics/Graphics.cs
    startLine: 475
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Captures the currently bound default framebuffer as a <xref href="Prowl.Runtime.Resources.Texture2D" data-throw-if-not-resolved="false"></xref>. The caller

    receives a normal texture and can use <xref href="Prowl.Runtime.Resources.Texture2D.GetData%60%601(System.Memory%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref> / sampling /

    serialization without managing raw byte buffers. The texture is stored bottom-up (GPU Y-up,

    matching other Prowl textures). Callers that encode to PNG or other top-down formats should

    flip rows before encoding.
  example: []
  syntax:
    content: public static Texture2D Screenshot()
    return:
      type: Prowl.Runtime.Resources.Texture2D
    content.vb: Public Shared Function Screenshot() As Texture2D
  overload: Prowl.Runtime.Graphics.Screenshot*
