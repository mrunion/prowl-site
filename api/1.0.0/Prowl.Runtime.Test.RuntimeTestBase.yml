  assemblies:
  - Prowl.Runtime.Test
  namespace: Prowl.Runtime.Test
  summary: >-
    Base class for tests that spin up a live instance of the runtime (scenes, GameObjects,

    components and physics) to verify behaviour like MonoBehaviour lifecycles and the simulation.


    It puts the runtime into "play mode" (<xref href="Prowl.Runtime.Application.IsPlaying" data-throw-if-not-resolved="false"></xref>) so gameplay

    callbacks (OnEnable/Start/Update/FixedUpdate/...) actually fire, gives a deterministic

    delta-time, tracks every Scene/GameObject it creates and tears them down afterwards, and

    exposes <xref href="Prowl.Runtime.Test.RuntimeTestBase.Tick(Prowl.Runtime.Resources.Scene%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> helpers to advance the simulation by hand.


    Tests in this project run without parallelization (see TestAssemblyConfig) because the runtime

    relies on global static state (<xref href="Prowl.Runtime.Application" data-throw-if-not-resolved="false"></xref>, <xref href="Prowl.Runtime.Time" data-throw-if-not-resolved="false"></xref>).
  example: []
