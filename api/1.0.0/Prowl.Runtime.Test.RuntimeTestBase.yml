  summary: >-
    Advances one full frame: steps physics (<xref href="Prowl.Runtime.Resources.Scene.FixedUpdate" data-throw-if-not-resolved="false"></xref>) then runs the

    per-frame update (<xref href="Prowl.Runtime.Resources.Scene.Update" data-throw-if-not-resolved="false"></xref>). This mirrors the order the real game loop uses

    so components that read back physics state in Update (e.g. Rigidbody3D) stay in sync.
  example: []
