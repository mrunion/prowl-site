  assemblies:
  - Prowl.Analyzers
  namespace: Prowl.Analyzers
  summary: >-
    Flags blocking waits on a task inside a <code>MonoBehaviour</code>: <code>.Result</code>, <code>.Wait()</code> and

    <code>GetAwaiter().GetResult()</code>. Component code runs on the main thread, and the engine finishes

    asset loads and frame waits from that same thread, so blocking there on one of them never returns.

    Code inside a lambda, a static method or a static local function is left alone, since it usually runs on some

    other thread, and so is a read that cannot block: behind an <code>IsCompleted</code> check on the same variable, or a

    zero timeout poll.
  example: []
  syntax:
    content: >-
      [DiagnosticAnalyzer("C#", new string[] { })]

      public sealed class BlockingWaitAnalyzer : DiagnosticAnalyzer
    content.vb: >-
      <DiagnosticAnalyzer("C#", New String() { })>

      Public NotInheritable Class BlockingWaitAnalyzer Inherits DiagnosticAnalyzer
