      path: Prowl.Runtime/Components/GameCanvas.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: EditorWorldSpaceOverride
    path: ../Prowl/Prowl.Runtime/Components/GameCanvas.cs
    startLine: 45
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    When true, every canvas lays out and maps to world using its <b>world-space</b> representation

    (<xref href="Prowl.Runtime.GameCanvas.ReferenceResolution" data-throw-if-not-resolved="false"></xref> as the root rect + the GameObject transform), regardless of

    its actual <xref href="Prowl.Runtime.GameCanvas.RenderMode" data-throw-if-not-resolved="false"></xref>. The scene view enables this so screen-space UI can be

    viewed and edited in world space like any other GameObject, independent of screen/RT size.
  example: []
  syntax:
    content: public static bool EditorWorldSpaceOverride { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Shared Property EditorWorldSpaceOverride As Boolean
  overload: Prowl.Runtime.GameCanvas.EditorWorldSpaceOverride*
