  namespace: Prowl.Runtime
  summary: >-
    Coordinates a UI hierarchy: owns layout, scale, and the destination surface.

    Does not render anything itself - visible elements are <xref href="Prowl.Runtime.UI.UIBehaviour" data-throw-if-not-resolved="false"></xref>s

    that produce <xref href="Prowl.Runtime.UI.UIRenderItem" data-throw-if-not-resolved="false"></xref>s into <xref href="Prowl.Runtime.GameCanvas.Tree" data-throw-if-not-resolved="false"></xref>, which the

    pipeline then draws via <xref href="Prowl.Runtime.UI.UIRenderTree.CollectFor(Prowl.Runtime.Resources.Scene%2cProwl.Runtime.UI.UISurface%2cSystem.Collections.Generic.List%7bProwl.Runtime.Rendering.IRenderable%7d)" data-throw-if-not-resolved="false"></xref>.
  example: []
