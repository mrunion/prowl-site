- uid: Prowl.Runtime.NavMeshGeometrySource.Area
  commentId: F:Prowl.Runtime.NavMeshGeometrySource.Area
  id: Area
  parent: Prowl.Runtime.NavMeshGeometrySource
  langs:
  - csharp
  - vb
  name: Area
  nameWithType: NavMeshGeometrySource.Area
  fullName: Prowl.Runtime.NavMeshGeometrySource.Area
  type: Field
  source:
    remote:
      path: Prowl.Runtime/Navigation/NavMeshPrimitives.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: Area
    path: ../Prowl/Prowl.Runtime/Navigation/NavMeshPrimitives.cs
    startLine: 692
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    The navigation area for this geometry (index into <xref href="Prowl.Runtime.NavMeshAreas" data-throw-if-not-resolved="false"></xref>).
        Walkable polygons rasterized from this source carry this area, so per-source costs and
        masks apply. <xref href="Prowl.Runtime.NavMeshGeometrySource.UnspecifiedArea" data-throw-if-not-resolved="false"></xref> (the constructor default) falls back to the
        bake's default area. Where surfaces of different areas overlap vertically within the
        climb threshold, the HIGHER area index wins the merged span (Recast's convention) — not
        the higher cost — so order user areas accordingly when stacking geometry.
  example: []
  syntax:
    content: public int Area
    return:
      type: System.Int32
    content.vb: Public Area As Integer
