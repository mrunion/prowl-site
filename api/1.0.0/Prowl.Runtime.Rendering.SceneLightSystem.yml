  name: Reconcile(IReadOnlyList<IRenderableLight>, Float3, LayerMask, Frustum?)
  nameWithType: SceneLightSystem.Reconcile(IReadOnlyList<IRenderableLight>, Float3, LayerMask, Frustum?)
  fullName: Prowl.Runtime.Rendering.SceneLightSystem.Reconcile(System.Collections.Generic.IReadOnlyList<Prowl.Runtime.Rendering.IRenderableLight>, Prowl.Vector.Float3, Prowl.Runtime.LayerMask, Prowl.Vector.Frustum?)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Rendering/SceneLightSystem.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: Reconcile
    path: ../Prowl/Prowl.Runtime/Rendering/SceneLightSystem.cs
    startLine: 81
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Walk this frame's lights, track them in the static or dynamic tree, and pick the directional

    and the point and spot lights that cast shadows. Cheap when nothing changed.

    <code class="paramref">cameraPosition</code> is kept for callers, shadows are sized later.


    <p>

    Note on <code class="paramref">cullingMask</code>: per-camera light filtering by layer is not

    applied here. The trees are per scene and shared between cameras, so every light in the

    scene affects every camera. The argument is kept for forward compatibility.

    </p>
  example: []
  syntax:
    content: public void Reconcile(IReadOnlyList<IRenderableLight> lights, Float3 cameraPosition, LayerMask cullingMask, Frustum? view = null)
    parameters:
    - id: lights
      type: System.Collections.Generic.IReadOnlyList{Prowl.Runtime.Rendering.IRenderableLight}
    - id: cameraPosition
      type: Prowl.Vector.Float3
    - id: cullingMask
      type: Prowl.Runtime.LayerMask
    - id: view
      type: System.Nullable{Prowl.Vector.Frustum}
      description: The view moving lights are culled to, or null to keep them all, as both eyes of a headset need.
    content.vb: Public Sub Reconcile(lights As IReadOnlyList(Of IRenderableLight), cameraPosition As Float3, cullingMask As LayerMask, view As Frustum? = Nothing)
  overload: Prowl.Runtime.Rendering.SceneLightSystem.Reconcile*
  nameWithType.vb: SceneLightSystem.Reconcile(IReadOnlyList(Of IRenderableLight), Float3, LayerMask, Frustum?)
  fullName.vb: Prowl.Runtime.Rendering.SceneLightSystem.Reconcile(System.Collections.Generic.IReadOnlyList(Of Prowl.Runtime.Rendering.IRenderableLight), Prowl.Vector.Float3, Prowl.Runtime.LayerMask, Prowl.Vector.Frustum?)
  name.vb: Reconcile(IReadOnlyList(Of IRenderableLight), Float3, LayerMask, Frustum?)
