  commentId: M:Prowl.Runtime.Rendering.SceneLightSystem.Reconcile(System.Collections.Generic.IReadOnlyList{Prowl.Runtime.Rendering.IRenderableLight},Prowl.Vector.Float3,Prowl.Runtime.LayerMask,System.Nullable{Prowl.Vector.Frustum})
