    path: ../Prowl/Prowl.Runtime/Rendering/SceneLightSystem.cs
    startLine: 28
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Per-scene owner of the static and dynamic light BVHs and their GPU-side mirrors. The render

    pipeline calls <xref href="Prowl.Runtime.Rendering.SceneLightSystem.Reconcile(System.Collections.Generic.IReadOnlyList%7bProwl.Runtime.Rendering.IRenderableLight%7d%2cProwl.Vector.Float3%2cProwl.Runtime.LayerMask)" data-throw-if-not-resolved="false"></xref> once per frame with the lights collected from the

    scene; this class adds / removes / refits as needed and uploads only the dirty rows of each

    texture.


    <p>

    Directional lights never enter either BVH. The brightest is uploaded via the cascade-shadow

    uniform path; up to <xref href="Prowl.Runtime.Rendering.SceneLightSystem.MaxExtraDirectionalLights" data-throw-if-not-resolved="false"></xref> others light the scene unshadowed.

    </p>


    <p>

    A bounded number of point + spot lights win shadow atlas slots each frame, picked by distance

    to the frame's shadow focus point (the camera position, or the camera's

    <xref href="Prowl.Runtime.Camera.ShadowFocus" data-throw-if-not-resolved="false"></xref> position when one is set). Lights that miss the cut still light

    surfaces; they just sample as unshadowed.

    </p>
  example: []
  syntax:
    content: 'public sealed class SceneLightSystem : IDisposable'
    content.vb: Public NotInheritable Class SceneLightSystem Implements IDisposable
