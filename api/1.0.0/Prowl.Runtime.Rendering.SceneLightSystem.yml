- uid: Prowl.Runtime.Rendering.SceneLightSystem.Reconcile(System.Collections.Generic.IReadOnlyList{Prowl.Runtime.Rendering.IRenderableLight},Prowl.Vector.Float3,Prowl.Runtime.LayerMask)
  commentId: M:Prowl.Runtime.Rendering.SceneLightSystem.Reconcile(System.Collections.Generic.IReadOnlyList{Prowl.Runtime.Rendering.IRenderableLight},Prowl.Vector.Float3,Prowl.Runtime.LayerMask)
  id: Reconcile(System.Collections.Generic.IReadOnlyList{Prowl.Runtime.Rendering.IRenderableLight},Prowl.Vector.Float3,Prowl.Runtime.LayerMask)
  parent: Prowl.Runtime.Rendering.SceneLightSystem
  langs:
  - csharp
  - vb
  name: Reconcile(IReadOnlyList<IRenderableLight>, Float3, LayerMask)
  nameWithType: SceneLightSystem.Reconcile(IReadOnlyList<IRenderableLight>, Float3, LayerMask)
  fullName: Prowl.Runtime.Rendering.SceneLightSystem.Reconcile(System.Collections.Generic.IReadOnlyList<Prowl.Runtime.Rendering.IRenderableLight>, Prowl.Vector.Float3, Prowl.Runtime.LayerMask)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Rendering/SceneLightSystem.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: Reconcile
    path: ../Prowl/Prowl.Runtime/Rendering/SceneLightSystem.cs
    startLine: 88
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Walk this frame's lights, register / unregister with the appropriate BVH, refit dynamics,

    pick the directional + closest-N shadow casters, and upload only the dirty rows of each

    texture. Cheap when nothing changed. Shadow casters are picked by distance to

    <code class="paramref">shadowFocusPos</code>, the frame's shadow focus point (the camera position, or

    the camera's <xref href="Prowl.Runtime.Camera.ShadowFocus" data-throw-if-not-resolved="false"></xref> position when one is set).


    <p>

    Note on <code class="paramref">cullingMask</code>: per-camera light filtering by layer is not

    applied here. The BVH is a per-scene structure, shared between cameras; per-camera

    layer filtering would require either a separate BVH per camera (expensive) or per-leaf

    layer bits checked in the shader (not yet implemented). For now every light in the scene

    affects every camera. The argument is kept for forward compatibility.

    </p>
  example: []
  syntax:
    content: public void Reconcile(IReadOnlyList<IRenderableLight> lights, Float3 shadowFocusPos, LayerMask cullingMask)
    parameters:
    - id: lights
      type: System.Collections.Generic.IReadOnlyList{Prowl.Runtime.Rendering.IRenderableLight}
    - id: shadowFocusPos
      type: Prowl.Vector.Float3
    - id: cullingMask
      type: Prowl.Runtime.LayerMask
    content.vb: Public Sub Reconcile(lights As IReadOnlyList(Of IRenderableLight), shadowFocusPos As Float3, cullingMask As LayerMask)
  overload: Prowl.Runtime.Rendering.SceneLightSystem.Reconcile*
  nameWithType.vb: SceneLightSystem.Reconcile(IReadOnlyList(Of IRenderableLight), Float3, LayerMask)
  fullName.vb: Prowl.Runtime.Rendering.SceneLightSystem.Reconcile(System.Collections.Generic.IReadOnlyList(Of Prowl.Runtime.Rendering.IRenderableLight), Prowl.Vector.Float3, Prowl.Runtime.LayerMask)
  name.vb: Reconcile(IReadOnlyList(Of IRenderableLight), Float3, LayerMask)
