    startLine: 27
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Per-scene owner of the light trees forward shading walks. The render pipeline calls

    <xref href="Prowl.Runtime.Rendering.SceneLightSystem.Reconcile(System.Collections.Generic.IReadOnlyList%7bProwl.Runtime.Rendering.IRenderableLight%7d%2cProwl.Vector.Float3%2cProwl.Runtime.LayerMask%2cSystem.Nullable%7bProwl.Vector.Frustum%7d)" data-throw-if-not-resolved="false"></xref> once per frame with the lights collected from the scene, and only what

    changed is rebuilt and uploaded.


    <p>

    Directional lights never enter either tree. The brightest is uploaded via the cascade-shadow

    uniform path; up to <xref href="Prowl.Runtime.Rendering.SceneLightSystem.MaxExtraDirectionalLights" data-throw-if-not-resolved="false"></xref> others light the scene unshadowed.

    </p>


    <p>

    Every point and spot light that casts shadows gets them while it is in view, sized and cached by each

    camera's own <xref href="Prowl.Runtime.Rendering.ShadowRenderer" data-throw-if-not-resolved="false"></xref>. Its shadow data lives in a table, so there is no cap on how many.

    </p>
  example: []
  syntax:
