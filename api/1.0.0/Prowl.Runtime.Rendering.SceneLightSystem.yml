  example: []
  syntax:
    content: public void UploadGlobalUniforms(Float3 shadowFocusPosition)
    parameters:
    - id: shadowFocusPosition
      type: Prowl.Vector.Float3
      description: >-
        The point this frame's cascades were centered on. Uploaded
            as <code>_ShadowFocusPos</code> so shader-side cascade selection measures distance from the same
            point the cascades were built around.
