  namespace: Prowl.Runtime.Rendering
  summary: >-
    Upload all uniforms touched by <code>Lighting.glsl</code> and <code>LightBVH.glsl</code>: the four

    BVH textures, the directional light slot, the cascade shadow data, and the shadow atlas

    arrays for the selected closest-N point + spot lights. Call after <xref href="Prowl.Runtime.Rendering.SceneLightSystem.Reconcile(System.Collections.Generic.IReadOnlyList%7bProwl.Runtime.Rendering.IRenderableLight%7d%2cProwl.Vector.Float3%2cProwl.Runtime.LayerMask)" data-throw-if-not-resolved="false"></xref>

