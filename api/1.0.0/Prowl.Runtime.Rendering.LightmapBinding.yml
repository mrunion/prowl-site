  summary: >-
    Fills the per-object GI instance properties the Standard shader's <code>CalculateGI</code> reads:

    <code>_GIMode</code> (0 = realtime ambient, 1 = baked lightmap, 2 = light-probe SH) plus the lightmap

    texture/scale-offset or the packed SH uniforms. Called per renderable in <code>OnRenderCollect</code>.
