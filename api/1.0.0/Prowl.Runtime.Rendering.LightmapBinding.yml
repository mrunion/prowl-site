  syntax:
    content: public static void Fill(PropertyState props, GameObject renderer, Float3 worldPos, bool meshHasUV2)
    parameters:
    - id: props
      type: Prowl.Runtime.Rendering.PropertyState
      description: The renderable's per-object property state.
    - id: renderer
      type: Prowl.Runtime.GameObject
      description: >-
        The object being drawn. Its scene holds the baked lightmaps and probes, and
            its identifier is what the bake recorded a placement under.
    - id: worldPos
      type: Prowl.Vector.Float3
      description: Renderer bounds-center world position, used to sample probe SH for dynamic objects.
    - id: meshHasUV2
      type: System.Boolean
      description: >-
        Whether the renderer's mesh has a UV2 set. The bake samples the lightmap from UV2
            when present, else falls back to the primary UVs (UV0), so this selects the runtime sampling UV set.
    content.vb: Public Shared Sub Fill(props As PropertyState, renderer As GameObject, worldPos As Float3, meshHasUV2 As Boolean)
