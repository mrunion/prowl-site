  namespace: Prowl.Analyzers
  summary: >-
    Flags null-conditional (<code>?.</code>, <code>?[]</code>) and null-coalescing (<code>??</code>, <code>??=</code>) operators used on an

    <code>EngineObject</code>. Those operators only test reference-null, but an EngineObject can be destroyed/disposed while

    still being a live reference, so <code>obj?.M()</code> runs on a dead object and <code>obj ?? fallback</code> returns the dead

    object instead of the fallback. Use <code>IsValid()</code>/<code>IsNotValid()</code> for a validity check, or

    <code>object.ReferenceEquals</code> when a true reference-null test is genuinely intended.
  example: []
  syntax:
    content: >-
      [DiagnosticAnalyzer("C#", new string[] { })]

      public sealed class EngineObjectNullAnalyzer : DiagnosticAnalyzer
    content.vb: >-
      <DiagnosticAnalyzer("C#", New String() { })>

      Public NotInheritable Class EngineObjectNullAnalyzer Inherits DiagnosticAnalyzer
