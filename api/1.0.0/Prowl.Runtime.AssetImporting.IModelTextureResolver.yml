  summary: >-
    Resolve a texture referenced by a sibling file on disk. <code class="paramref">sourcePath</code> is

    always an already-resolved, existing, absolute path.
  example: []
  syntax:
    content: Texture2D? ResolveExternal(string sourcePath)
