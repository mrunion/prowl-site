  name: UIInputField
  nameWithType: UIInputField
  fullName: Prowl.Runtime.UI.UIInputField
  type: Class
  source:
    remote:
      path: Prowl.Runtime/Components/UI/Input/UIInputField.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: UIInputField
    path: ../Prowl/Prowl.Runtime/Components/UI/Input/UIInputField.cs
    startLine: 18
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.UI
  summary: >-
    A single-line editable text field. Extends <xref href="Prowl.Runtime.UI.Selectable" data-throw-if-not-resolved="false"></xref> so it gets the hover/focus tint,

    and drives a child <xref href="Prowl.Runtime.UI.UIInputField.TextComponent" data-throw-if-not-resolved="false"></xref> for the visible text plus optional caret and selection

    images that it positions each frame using <xref href="Prowl.Runtime.TextComponent.MeasureWidth(System.String)" data-throw-if-not-resolved="false"></xref>. Supports caret

    movement (arrows, Home/End), Backspace/Delete, drag- and shift-selection, select-all, and clipboard

    cut/copy/paste. The text scrolls horizontally within the field so the caret stays visible; pair the

    field with a <xref href="Prowl.Runtime.UI.RectMask" data-throw-if-not-resolved="false"></xref> to clip the overflow.
  example: []
  syntax:
    content: >-
      [AddComponentMenu("UI/Input Field", "")]

      [ComponentIcon("")]

      public class UIInputField : Selectable, IDisposable, ISerializationCallbackReceiver, IPointerEnterHandler, IPointerExitHandler, IPointerUpHandler, ISelectHandler, IDeselectHandler, IMoveHandler, IPointerDownHandler, IBeginDragHandler, IDragHandler, ISubmitHandler, ICancelHandler
    content.vb: >-
      <AddComponentMenu("UI/Input Field", "")>

