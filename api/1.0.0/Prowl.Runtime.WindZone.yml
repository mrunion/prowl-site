  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Spherical zone of wind shaped like a downwash: air comes down through the middle, spreads out

    across the ground and dies at the rim. The middle is calm, not the strongest point, which is what

    makes it read as something hovering rather than a starburst.

    Terrain grass blends the nearest <xref href="Prowl.Runtime.WindZone.kMaxShaderZones" data-throw-if-not-resolved="false"></xref> zones per frame, particle systems

    take the single nearest one.
  example: []
  syntax:
    content: >-
      [AddComponentMenu("Effects/Wind Zone", "")]

      [ComponentIcon("")]

      public sealed class WindZone : MonoBehaviour, IDisposable, ISerializationCallbackReceiver
    content.vb: >-
      <AddComponentMenu("Effects/Wind Zone", "")>

      <ComponentIcon("")>

