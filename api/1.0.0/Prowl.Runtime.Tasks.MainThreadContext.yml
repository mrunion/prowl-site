    that started the gameplay work it is running, falling back to the current one. After <xref href="Prowl.Runtime.Tasks.MainThreadContext.Stop" data-throw-if-not-resolved="false"></xref>

    it is the stopped session, so anything asking for the main thread is refused. Null when no loop is running.
