    startLine: 156
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Tasks
  summary: >-
    Ends the current session and starts a new one on the same thread. Must be called on the main thread.

    Called from inside async code, the thread's synchronization context is put back by the runtime when

    that code returns, so the next <xref href="Prowl.Runtime.Tasks.MainThreadContext.Pump" data-throw-if-not-resolved="false"></xref> points it at the new session again.
  example: []
  syntax:
    content: public static void Restart()
