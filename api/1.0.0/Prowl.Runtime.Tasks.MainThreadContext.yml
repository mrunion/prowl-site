    path: ../Prowl/Prowl.Runtime/Tasks/MainThreadContext.cs
    startLine: 36
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Tasks
  summary: >-
    Sends async continuations back to the main thread, so <code>await</code> in game code resumes where the

    scene actually lives.
  remarks: >-
    Without a synchronization context everything after an <code>await</code> resumes on a thread pool thread,

    and ordinary game code ends up touching the scene from the wrong thread, which only sometimes

    crashes. Installing one makes await behave the way the code reads.


    <p></p>


    Each context is one session. The editor ends a session when play starts or stops and when scripts

    reload: the session token is cancelled and every continuation still waiting on it is dropped, so a

    method that awaited during play never resumes against the edit scene or runs code that was reloaded.

    A dropped method simply stops, so its <code>finally</code> blocks do not run. Work that must clean up

    watches <xref href="Prowl.Runtime.Tasks.MainThreadContext.SessionToken" data-throw-if-not-resolved="false"></xref> instead.


    <p></p>


    Gameplay work stays tied to its session across threads: anything started from a scene callback or from

    main thread queued work carries the session with its execution context, so a worker that hops back with

    <code>await GameTask.MainThread()</code> after its session ended is dropped too. Everything else, such as editor

    code, long lived threads and work that suppresses execution context flow, follows the current session.

    Blocking <xref href="Prowl.Runtime.Tasks.MainThreadContext.Send(System.Threading.SendOrPostCallback%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> calls are the exception and carry over, since a thread is waiting on them.
  example: []
  syntax:
    content: 'public sealed class MainThreadContext : SynchronizationContext'
    content.vb: Public NotInheritable Class MainThreadContext Inherits SynchronizationContext
