  type: Class
  source:
    remote:
      path: Prowl.Runtime/Components/Navigation/NavMeshAgent.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: NavMeshAgent
    path: ../Prowl/Prowl.Runtime/Components/Navigation/NavMeshAgent.cs
    startLine: 25
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Moves a character along the navmesh using crowd simulation: give it a

    <xref href="Prowl.Runtime.NavMeshAgent.Destination" data-throw-if-not-resolved="false"></xref> (or call <xref href="Prowl.Runtime.NavMeshAgent.SetDestination(Prowl.Vector.Float3)" data-throw-if-not-resolved="false"></xref>) and it steers there,

    avoiding other agents. The agent joins the scene's crowd

    when a navmesh for its <xref href="Prowl.Runtime.NavMeshAgent.AgentTypeId" data-throw-if-not-resolved="false"></xref> is available and writes its position back

    to the Transform each LateUpdate (disable <xref href="Prowl.Runtime.NavMeshAgent.UpdatePosition" data-throw-if-not-resolved="false"></xref> to drive a

    Rigidbody or CharacterController from <xref href="Prowl.Runtime.NavMeshAgent.DesiredVelocity" data-throw-if-not-resolved="false"></xref> yourself).
  example: []
  syntax:
    content: >-
      [AddComponentMenu("Navigation/NavMesh Agent", "")]

      [ComponentIcon("")]

      public class NavMeshAgent : MonoBehaviour, IDisposable, ISerializationCallbackReceiver
    content.vb: >-
      <AddComponentMenu("Navigation/NavMesh Agent", "")>

      <ComponentIcon("")>

      Public Class NavMeshAgent Inherits MonoBehaviour Implements IDisposable, ISerializationCallbackReceiver
