- uid: Prowl.Runtime.NavMeshAgent.SamplePathPosition(Prowl.Runtime.NavMeshAreaMask,System.Single,Prowl.Runtime.NavMeshHit@)
  commentId: M:Prowl.Runtime.NavMeshAgent.SamplePathPosition(Prowl.Runtime.NavMeshAreaMask,System.Single,Prowl.Runtime.NavMeshHit@)
  id: SamplePathPosition(Prowl.Runtime.NavMeshAreaMask,System.Single,Prowl.Runtime.NavMeshHit@)
  parent: Prowl.Runtime.NavMeshAgent
