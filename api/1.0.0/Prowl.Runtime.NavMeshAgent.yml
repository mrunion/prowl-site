  nameWithType: NavMeshAgent.SamplePathPosition(NavMeshAreaMask, float, out NavMeshHit)
  fullName: Prowl.Runtime.NavMeshAgent.SamplePathPosition(Prowl.Runtime.NavMeshAreaMask, float, out Prowl.Runtime.NavMeshHit)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Components/Navigation/NavMeshAgent.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: SamplePathPosition
    path: ../Prowl/Prowl.Runtime/Components/Navigation/NavMeshAgent.cs
    startLine: 685
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    How far along its current path the agent could get, without moving it: walks the path from

    where the agent stands and stops at <code class="paramref">maxDistance</code>, at the end of the path,

    or where the path first enters a polygon <code class="paramref">areaMask</code> excludes.


    <p></p>


    True when the walk stopped short of <code class="paramref">maxDistance</code>. Two different things

    cause that, and the mask tells them apart: <code>!hit.Mask.Overlaps(areaMask)</code> means an

    excluded polygon blocked it, anything else means the path simply ran out. <code>hit.Hit</code>

    separately says the position is a real point on the path rather than one interpolated where

    the budget ran out, and <code>hit.Distance</code> is measured ALONG the path rather than to it.


    <p></p>


    Mid-hop across an off-mesh link the corridor already begins at the landing point, so the

    walk is measured from there rather than from where the agent hangs.


    <p></p>


    Areas are tested per POLYGON rather than per corner, so a path that only clips

    the corner of an excluded polygon still stops at it.
  example: []
  syntax:
    content: public bool SamplePathPosition(NavMeshAreaMask areaMask, float maxDistance, out NavMeshHit hit)
    parameters:
    - id: areaMask
      type: Prowl.Runtime.NavMeshAreaMask
    - id: maxDistance
      type: System.Single
    - id: hit
      type: Prowl.Runtime.NavMeshHit
    return:
      type: System.Boolean
    content.vb: Public Function SamplePathPosition(areaMask As NavMeshAreaMask, maxDistance As Single, hit As NavMeshHit) As Boolean
  overload: Prowl.Runtime.NavMeshAgent.SamplePathPosition*
