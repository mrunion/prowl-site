    id: IsStopped
    path: ../Prowl/Prowl.Runtime/Components/Navigation/NavMeshAgent.cs
    startLine: 320
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Stop (true) or resume (false) movement. The path is kept while stopped, so
        resuming carries on along it rather than replanning.
        <xref href="Prowl.Runtime.NavMeshAgent.SetDestination(Prowl.Vector.Float3)" data-throw-if-not-resolved="false"></xref> while stopped plans the route but does NOT clear the stopped
        state — movement resumes only when this is set back to false.

        <p></p>

        Two things a stopped agent still does: an off-mesh hop already under way finishes (the
        crowd animates it to the far side rather than stranding it mid-air), and a corridor that
        cannot reach its target is re-planned about once a second until it can.
  example: []
  syntax:
    content: public bool IsStopped { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property IsStopped As Boolean
  overload: Prowl.Runtime.NavMeshAgent.IsStopped*
