    path: ../Prowl/Prowl.Runtime/Components/Audio/AudioSource.cs
    startLine: 419
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: Playback position, counted in the frames the device runs at.
  remarks: >-
    This is the engine's own read position, so it advances at the rate the device was opened at

    whatever rate the clip was authored at. That is not the unit <xref href="Prowl.Runtime.AudioSource.Length" data-throw-if-not-resolved="false"></xref> is in, so

    the two do not belong in one expression. <xref href="Prowl.Runtime.AudioSource.NormalizedTime" data-throw-if-not-resolved="false"></xref> is what compares them.


    It also keeps counting across a loop rather than starting over, so on a looping source it is

    how long the source has been sounding for. <xref href="Prowl.Runtime.AudioSource.PlaybackTime" data-throw-if-not-resolved="false"></xref> is where in the clip it

    currently is.
  example: []
  syntax:
    content: public ulong Cursor { get; set; }
    parameters: []
    return:
      type: System.UInt64
    content.vb: Public Property Cursor As ULong
  overload: Prowl.Runtime.AudioSource.Cursor*
