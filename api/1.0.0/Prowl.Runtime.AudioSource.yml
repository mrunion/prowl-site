    path: ../Prowl/Prowl.Runtime/Components/Audio/AudioSource.cs
    startLine: 1031
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Plays a clip on its own voice, without disturbing whatever this source is already playing.

    Overlapping calls layer instead of cutting each other off, which is what a one shot is for.
  remarks: >-
    Voices are pooled and share the source's sound group, so they inherit its volume, pitch and

    spatial settings and follow the object as it moves. Once <xref href="Prowl.Runtime.AudioSource.MaxOneShotVoices" data-throw-if-not-resolved="false"></xref> are

    sounding at once the longest running one is taken over.
  example: []
  syntax:
    content: public void PlayOneShot(AudioClip clip, float volumeScale = 1)
    parameters:
    - id: clip
      type: Prowl.Runtime.Resources.AudioClip
      description: The clip to play.
    - id: volumeScale
      type: System.Single
      description: Level for this voice alone, on top of the source's own volume.
    content.vb: Public Sub PlayOneShot(clip As AudioClip, volumeScale As Single = 1)
  overload: Prowl.Runtime.AudioSource.PlayOneShot*
  nameWithType.vb: AudioSource.PlayOneShot(AudioClip, Single)
