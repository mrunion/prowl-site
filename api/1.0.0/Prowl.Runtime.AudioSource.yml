- uid: Prowl.Runtime.AudioSource.Process
  commentId: E:Prowl.Runtime.AudioSource.Process
  id: Process
  parent: Prowl.Runtime.AudioSource
  langs:
  - csharp
  - vb
  name: Process
  nameWithType: AudioSource.Process
  fullName: Prowl.Runtime.AudioSource.Process
  type: Event
  source:
    remote:
      path: Prowl.Runtime/Components/Audio/AudioSource.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: Process
    path: ../Prowl/Prowl.Runtime/Components/Audio/AudioSource.cs
    startLine: 171
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Raised for every block this source produces, after its effects have run, on the audio thread.

    A handler must not allocate, block or touch the scene: it is running against the mix, where a

    collection or a contended lock is an audible dropout.
  remarks: >-
    Subscribing builds the node that runs the chain if this source did not already have one, so a

    source nobody is listening to and that has no effects does not pay for either.
  example: []
  syntax:
    content: public event AudioProcessEvent Process
    return:
      type: Prowl.Runtime.AudioProcessEvent
    content.vb: Public Event Process As AudioProcessEvent
