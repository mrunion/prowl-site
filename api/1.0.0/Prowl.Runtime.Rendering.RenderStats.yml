  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Per-frame rendering counters captured by the pipeline and the low-level <xref href="Prowl.Runtime.Graphics" data-throw-if-not-resolved="false"></xref>

    draw calls. The pipeline calls <xref href="Prowl.Runtime.Rendering.RenderStats.BeginFrame" data-throw-if-not-resolved="false"></xref> before its first draw and

    <xref href="Prowl.Runtime.Rendering.RenderStats.EndFrame" data-throw-if-not-resolved="false"></xref> after the last one; the editor reads the snapshot exposed in

    <xref href="Prowl.Runtime.Rendering.RenderStats.Last" data-throw-if-not-resolved="false"></xref>. Counters are global because both <xref href="Prowl.Runtime.Graphics" data-throw-if-not-resolved="false"></xref> and the active

    pipeline write to the same accumulator; multi-camera renders are summed into one frame.
  example: []
