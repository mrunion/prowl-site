  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Runs work on the main thread and blocks until it finishes, rethrowing what it threw. Runs at once

    when called on the main thread or when no loop is running, and carries over a session ending, since

    the caller is waiting. Throws <xref href="System.OperationCanceledException" data-throw-if-not-resolved="false"></xref> if the loop stops first.

    Never call it from a thread the main thread is waiting on.
  example: []
  syntax:
    content: public static void Run(Action work)
    parameters:
    - id: work
      type: System.Action
    content.vb: Public Shared Sub Run(work As Action)
