  fullName: Prowl.Runtime.NavMeshAreaVolume.FromOrientedBox(in Prowl.Vector.Float4x4, Prowl.Vector.Float3, Prowl.Vector.Float3, int)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Navigation/NavMeshPrimitives.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: FromOrientedBox
    path: ../Prowl/Prowl.Runtime/Navigation/NavMeshPrimitives.cs
    startLine: 827
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Build the volume for an oriented box (local center/size under a world transform): the

    8 corners are transformed, the vertical range is their Y span, and the footprint is the

    convex hull of their XZ projection. Yaw-only boxes yield a 4-gon; arbitrary rotations

    project to up-to-6-gons, which stay convex and are marked exactly.
  example: []
  syntax:
    content: public static NavMeshAreaVolume FromOrientedBox(in Float4x4 localToWorld, Float3 center, Float3 size, int area)
    parameters:
    - id: localToWorld
      type: Prowl.Vector.Float4x4
    - id: center
      type: Prowl.Vector.Float3
    - id: size
      type: Prowl.Vector.Float3
    - id: area
      type: System.Int32
    return:
      type: Prowl.Runtime.NavMeshAreaVolume
    content.vb: Public Shared Function FromOrientedBox(localToWorld As Float4x4, center As Float3, size As Float3, area As Integer) As NavMeshAreaVolume
  overload: Prowl.Runtime.NavMeshAreaVolume.FromOrientedBox*
  nameWithType.vb: NavMeshAreaVolume.FromOrientedBox(Float4x4, Float3, Float3, Integer)
  fullName.vb: Prowl.Runtime.NavMeshAreaVolume.FromOrientedBox(Prowl.Vector.Float4x4, Prowl.Vector.Float3, Prowl.Vector.Float3, Integer)
  name.vb: FromOrientedBox(Float4x4, Float3, Float3, Integer)
