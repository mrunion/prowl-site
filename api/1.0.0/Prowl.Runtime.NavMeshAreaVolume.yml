    path: ../Prowl/Prowl.Runtime/Navigation/NavMeshPrimitives.cs
    startLine: 788
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    A world-space convex prism that stamps an area over already-rasterized geometry during a

    bake (the payload of <xref href="Prowl.Runtime.NavMeshModifierVolume" data-throw-if-not-resolved="false"></xref>, applied via Recast's convex

    volume marking). Self-contained — no Transform or component references — so it is safe to

    hand to a background build alongside <xref href="Prowl.Runtime.NavMeshGeometrySource" data-throw-if-not-resolved="false"></xref>s. A volume only

    re-marks voxels that geometry produced; it never creates walkable surface on its own, and

    an <xref href="Prowl.Runtime.NavMeshAreas.NotWalkable" data-throw-if-not-resolved="false"></xref> volume erases walkability inside its footprint.
  example: []
  syntax:
    content: public readonly struct NavMeshAreaVolume
    content.vb: Public Structure NavMeshAreaVolume
