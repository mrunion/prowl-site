  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Assets imported from source files as they are needed, the runtime counterpart of the editor's importers: point it

    at a folder, a zip or a web server and <xref href="Prowl.Runtime.AssetDatabase.Mount(Prowl.Runtime.AssetBackend)" data-throw-if-not-resolved="false"></xref> it. Every file a <xref href="Prowl.Runtime.RuntimeImporter" data-throw-if-not-resolved="false"></xref>

    knows is findable by its path without the extension, "Textures/Paint" for "Textures/Paint.png", and its sub assets at

    "path#name" once the file has been loaded. GUIDs come from the source's name and the path, so they are the same every run.
  example: []
  syntax:
    content: 'public sealed class SourceAssetBackend : AssetBackend'
    content.vb: Public NotInheritable Class SourceAssetBackend Inherits AssetBackend
