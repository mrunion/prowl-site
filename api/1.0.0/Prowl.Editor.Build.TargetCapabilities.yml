  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Build
  summary: What a target can actually do.
  remarks: >-
    <xref href="Prowl.Editor.Build.TargetCapabilities.TextureFormats" data-throw-if-not-resolved="false"></xref> is the part the build reads today: it is what

    <xref href="Prowl.Editor.Build.AssetVariantResolver.SelectProcessor(Prowl.Editor.AssetEntry%2cProwl.Editor.Build.PlatformTarget)" data-throw-if-not-resolved="false"></xref> matches a processor against, so it decides which

    form of an asset ships. The rest is declared and not yet consumed. <xref href="Prowl.Editor.Build.TargetCapabilities.GraphicsApis" data-throw-if-not-resolved="false"></xref> is for

    choosing shader permutations, which waits on a shader stage, and <xref href="Prowl.Editor.Build.TargetCapabilities.Flags" data-throw-if-not-resolved="false"></xref> is for failing

    validation on the desktop before failing on the device.


    <p>

    Everything is a registered string rather than an enum so a platform shipped out of tree can declare a

    format or a capability this engine has never heard of.

    </p>
  example: []
