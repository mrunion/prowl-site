    id: AddControl
    path: ../Prowl/Prowl.Editor/GUI/SceneView/HandleContext.cs
    startLine: 208
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.GUI.SceneView
  summary: >-
    Report this control's screen-space distance from the cursor, in pixels, and how far in front

    of the camera it sits. The nearest control on screen wins; controls whose screen distances are

    within <xref href="Prowl.Editor.GUI.SceneView.HandleContext.DepthTieBandPixels" data-throw-if-not-resolved="false"></xref> of each other count as overlapping and are settled by

    <code class="paramref">depth</code> instead, so a handle behind another cannot steal the cursor. Exact

    ties go to the later registration, so register smaller and more specific handles last.


    <p><xref href="System.Single.MaxValue" data-throw-if-not-resolved="false"></xref> (and any non-finite value) as the distance means "not a

    candidate this frame", so a handle that is simply not under the cursor can report

    unconditionally rather than the caller having to branch around the call.</p>

    <p>Leaving <code class="paramref">depth</code> unset means "depth unknown", which loses every

    overlap tie to a control that does report one. Screen-space overlays that always draw on top

    should pass 0.</p>
  example: []
  syntax:
    content: public void AddControl(ControlID id, float screenDistance, float depth = 3.4028235E+38)
    parameters:
    - id: id
      type: Prowl.Editor.GUI.SceneView.ControlID
    - id: screenDistance
      type: System.Single
    - id: depth
      type: System.Single
    content.vb: Public Sub AddControl(id As ControlID, screenDistance As Single, depth As Single = 3.4028235E+38)
