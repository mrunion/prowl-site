  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.GUI.SceneView
  summary: >-
    Screen distance from the cursor to a world point, or <xref href="System.Single.MaxValue" data-throw-if-not-resolved="false"></xref> when the

    point is behind the camera or further away than <code class="paramref">grabRadiusPixels</code>.
  remarks: >-
    The radius is a grab region, not a bias: outside it the handle is not a candidate at all.

    Returning a real distance at any range would make every registered handle outrank the

    viewport's default control no matter how far from the cursor it sat, which silently disables

    object picking.
  example: []
  syntax:
    content: public float DistanceToPoint(Float3 world, float grabRadiusPixels)
    parameters:
    - id: world
      type: Prowl.Vector.Float3
    - id: grabRadiusPixels
      type: System.Single
    return:
      type: System.Single
    content.vb: Public Function DistanceToPoint(world As Float3, grabRadiusPixels As Single) As Single
