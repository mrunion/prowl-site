    path: ../Prowl/Prowl.Editor/GUI/SceneView/HandleContext.cs
    startLine: 29
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.GUI.SceneView
  summary: >-
    Arbitration bus for interactive scene-view handles. Every handle reports how far it is from the

    cursor via <xref href="Prowl.Editor.GUI.SceneView.HandleContext.AddControl(Prowl.Editor.GUI.SceneView.ControlID%2cSystem.Single%2cSystem.Single)" data-throw-if-not-resolved="false"></xref>; the nearest one wins and may take the drag.


    <p>One instance per scene viewport, owned by the panel. The frame model is a single pass:

    registrations accumulate all frame and resolve at the next <xref href="Prowl.Editor.GUI.SceneView.HandleContext.BeginFrame(Prowl.Runtime.Camera%2cProwl.Vector.Rect%2cProwl.Vector.Float2%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref>, so handles

    act on the previous pass's winner. Because <xref href="Prowl.Editor.GUI.SceneView.HandleContext.Hot" data-throw-if-not-resolved="false"></xref> outranks <xref href="Prowl.Editor.GUI.SceneView.HandleContext.Nearest" data-throw-if-not-resolved="false"></xref> for

    the whole of a drag, the one-frame lag only ever affects hover highlighting and the initial

    press.</p>


    <p>Resolution happens in <xref href="Prowl.Editor.GUI.SceneView.HandleContext.BeginFrame(Prowl.Runtime.Camera%2cProwl.Vector.Rect%2cProwl.Vector.Float2%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> rather than <xref href="Prowl.Editor.GUI.SceneView.HandleContext.EndFrame" data-throw-if-not-resolved="false"></xref> so that

    controls registered from deferred draw callbacks - which run after the input pass - still take

    part.</p>
  example: []
  syntax:
    content: public sealed class HandleContext
    content.vb: Public NotInheritable Class HandleContext
