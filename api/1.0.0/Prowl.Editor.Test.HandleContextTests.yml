  assemblies:
  - Prowl.Editor.Test
  namespace: Prowl.Editor.Test
  summary: >-
    Guards the arbitration rules in <xref href="Prowl.Editor.GUI.SceneView.HandleContext" data-throw-if-not-resolved="false"></xref> that decide which of the viewport's

    handles owns the cursor. Every case here is one that produced a real, user-visible failure:

    picking silently dying, or a handle behind another one stealing the click.
