  summary: >-
    The same starvation via the other door: a wrapper that reports "not hovered" as

    <xref href="System.Single.MaxValue" data-throw-if-not-resolved="false"></xref> must be rejected, since the accumulator itself starts at

    MaxValue and would otherwise accept it.
  example: []
