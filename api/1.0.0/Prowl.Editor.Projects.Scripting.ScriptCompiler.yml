  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Projects.Scripting
  summary: >-
    Generates .csproj files for user scripts and compiles them via `dotnet build`.


    User code is split into one assembly per <xref href="Prowl.Editor.Projects.Scripting.AssemblyDefinition" data-throw-if-not-resolved="false"></xref> (.asmdef), plus two

    default assemblies for scripts not covered by any asmdef: <code>{Project}.Game</code> (runtime) and

    <code>{Project}.Editor</code> (editor-only). Managed plugins under <code>Plugins/</code> folders are

    referenced automatically (or explicitly via an asmdef's precompiled references).
  example: []
