  assemblies:
  - Prowl.Editor.Test
  namespace: Prowl.Editor.Test
  summary: >-
    Tests for the editor <xref href="Prowl.Editor.Core.Undo" data-throw-if-not-resolved="false"></xref> system - high stakes because a bug here means lost work.

    Covers property snapshots, action records, structural create/destroy (full restore), identifier

    survival across destroy/recreate, time-window coalescing, continuous (gizmo) operations, history

    trimming, and play-mode gating. Pending records are flushed via the public <xref href="Prowl.Editor.Core.Undo.IncrementGroup" data-throw-if-not-resolved="false"></xref>

    (same path as the per-frame FlushFrame).
