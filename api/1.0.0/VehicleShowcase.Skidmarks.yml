  assemblies:
  - VehicleShowcase
  namespace: VehicleShowcase
  summary: >-
    Leaves marks on the ground under wheels that slide sideways or lock under braking. The marks share one mesh, a ring of

    the most recent segments, laid at the bottom of each wheel across the way it travels. Hand it the wheels of

    every vehicle with <xref href="VehicleShowcase.Skidmarks.Track(Prowl.Runtime.Rigidbody3D%2cSystem.Collections.Generic.IEnumerable%7bProwl.Runtime.WheelCollider%7d)" data-throw-if-not-resolved="false"></xref>; it needs a MeshRenderer beside it with a transparent material.
  example: []
  syntax:
    content: 'public sealed class Skidmarks : MonoBehaviour, IDisposable, ISerializationCallbackReceiver'
