    path: ../Prowl/Prowl.Runtime/Resources/ComputeShader.cs
    startLine: 33
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: >-
    GLSL that runs on the GPU outside of drawing. A <code>.compute</code> file declares its entry points with

    <code>#pragma kernel Name X Y Z</code>, the thread group size (Y and Z default to 1), and each one is a plain

    <code>void Name()</code> function reading <code>gl_GlobalInvocationID</code> and friends. Storage blocks and images need no

    binding layout, the engine assigns them and binds by name.


    <p></p>


    Values set with <xref href="Prowl.Runtime.Resources.ComputeShader.SetFloat(System.String%2cSystem.Single)" data-throw-if-not-resolved="false"></xref> and the like apply to every kernel, buffers and textures are set per kernel.

    Needs compute support, see <xref href="Prowl.Runtime.Resources.ComputeShader.IsSupported" data-throw-if-not-resolved="false"></xref>.
