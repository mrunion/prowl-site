  namespace: Prowl.Runtime.UI
  summary: >-
    The pipeline destination for a UI element. Mirrors <xref href="Prowl.Runtime.UI.RenderMode" data-throw-if-not-resolved="false"></xref> but

    lives on the render side, where it controls *where* the UI queue draws and

    *which* projection it uses. Kept separate from <xref href="Prowl.Runtime.UI.RenderMode" data-throw-if-not-resolved="false"></xref> so the

    pipeline never references user-facing component fields directly.
  example: []
