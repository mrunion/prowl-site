  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    The concave triangle mesh, shareable across many <xref href="Jitter2.Collision.Shapes.TriangleShape" data-throw-if-not-resolved="false"></xref>s. It holds only the

    non-degenerate triangles, so it can contain fewer than <xref href="Prowl.Runtime.BakedPhysicsMesh.Triangles" data-throw-if-not-resolved="false"></xref>; index into it by

    its own <code>Indices.Length</code>, never by the soup count.
  example: []
  syntax:
    content: public TriangleMesh TriangleMesh { get; }
    parameters: []
    return:
      type: Jitter2.Collision.Shapes.TriangleMesh
    content.vb: Public ReadOnly Property TriangleMesh As TriangleMesh
  overload: Prowl.Runtime.BakedPhysicsMesh.TriangleMesh*
