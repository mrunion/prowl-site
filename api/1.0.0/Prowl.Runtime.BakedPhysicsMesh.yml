    startLine: 48
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Bake a mesh into its physics representation. This is pure CPU work (it touches no GPU or

    main-thread-only state), so it is safe to call from any thread. Prefer

    <xref href="Prowl.Runtime.PhysicsWorld.BakeMesh(Prowl.Runtime.Resources.Mesh)" data-throw-if-not-resolved="false"></xref>, which caches and shares the result per mesh.
  example: []
  syntax:
    content: public static BakedPhysicsMesh Build(Mesh mesh)
    parameters:
    - id: mesh
      type: Prowl.Runtime.Resources.Mesh
    return:
      type: Prowl.Runtime.BakedPhysicsMesh
    content.vb: Public Shared Function Build(mesh As Mesh) As BakedPhysicsMesh
  overload: Prowl.Runtime.BakedPhysicsMesh.Build*
