  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    The CPU-baked physics representation of a <xref href="Prowl.Runtime.Resources.Mesh" data-throw-if-not-resolved="false"></xref>: the triangle soup (mesh-local space)

    plus a Jitter <xref href="Jitter2.Collision.Shapes.TriangleMesh" data-throw-if-not-resolved="false"></xref> (the concave acceleration

    structure). Built once per mesh via <xref href="Prowl.Runtime.PhysicsWorld.BakeMesh(Prowl.Runtime.Resources.Mesh)" data-throw-if-not-resolved="false"></xref> and shared by every collider

    that uses the mesh, so the (potentially expensive) bake happens a single time instead of per

    MeshCollider instance.
  example: []
  syntax:
    content: public sealed class BakedPhysicsMesh
    content.vb: Public NotInheritable Class BakedPhysicsMesh
