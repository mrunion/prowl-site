  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    The project-wide navigation area table: up to 32 named areas with per-area path costs, addressed

    by index and combined into 32-bit masks. Area 0 is Walkable, 1 is Not Walkable,

    2 is Jump; 3..31 are user-defined.


    <p></p>


    Detour stores area <code>i</code> as <code>i + 1</code>, because its 0 is the null area meaning "not part of

    the navmesh". <xref href="Prowl.Runtime.NavMeshAreas.ToDetourArea(System.Int32)" data-throw-if-not-resolved="false"></xref> / <xref href="Prowl.Runtime.NavMeshAreas.FromDetourArea(System.Int32)" data-throw-if-not-resolved="false"></xref> are the only places that

    offset is applied — never hand-roll it. Bake-side conversions go through

    <code>ProwlInputGeomProvider.DetourAreaFor</code>, which additionally maps <xref href="Prowl.Runtime.NavMeshAreas.NotWalkable" data-throw-if-not-resolved="false"></xref> to

    the null area; calling <xref href="Prowl.Runtime.NavMeshAreas.ToDetourArea(System.Int32)" data-throw-if-not-resolved="false"></xref> on a source area instead silently resurrects

    traversable "Not Walkable" polys.
