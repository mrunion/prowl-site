    id: SetAreaCost
    path: ../Prowl/Prowl.Runtime/Navigation/NavMeshAreas.cs
    startLine: 95
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Set the default path cost multiplier for an area. Clamped to &gt;= 1: Detour's
        A* heuristic (straight-line distance) is only admissible when no traversal is cheaper
        than distance itself, so costs below 1 would silently produce suboptimal paths. To
        express "agents prefer this area", raise every OTHER area's cost above 1 instead.
  example: []
  syntax:
    content: public static void SetAreaCost(int areaIndex, float cost)
    parameters:
    - id: areaIndex
      type: System.Int32
    - id: cost
      type: System.Single
    content.vb: Public Shared Sub SetAreaCost(areaIndex As Integer, cost As Single)
