    remote:
      path: Prowl.Runtime/Navigation/NavMeshTriangulation.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: IsPolygonCorner
    path: ../Prowl/Prowl.Runtime/Navigation/NavMeshTriangulation.cs
    startLine: 32
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Parallel to <xref href="Prowl.Runtime.NavMeshTriangulation.Vertices" data-throw-if-not-resolved="false"></xref>: true for a polygon corner, false for a
        vertex the height detail added between corners. Corners are the navmesh's structure —
        welded, shared across polygons and stitched across tiles — while detail vertices belong
        to one polygon's surface only, which is the distinction debug drawing wants to show.
  example: []
  syntax:
    content: public bool[] IsPolygonCorner
    return:
      type: System.Boolean[]
    content.vb: Public IsPolygonCorner As Boolean()
