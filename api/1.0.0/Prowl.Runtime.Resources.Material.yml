  source:
    remote:
      path: Prowl.Runtime/Resources/Material.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: LoadDefault
    path: ../Prowl/Prowl.Runtime/Resources/Material.cs
    startLine: 41
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: >-
    Load a default embedded material returns a fresh clone every call so callers

    can freely mutate (SetTexture, SetFloat, ...) without stepping on each other.

    The underlying template is cached in <xref href="Prowl.Runtime.BuiltInAssets" data-throw-if-not-resolved="false"></xref> so the .mat file

    is only deserialized once, but the returned instance is always yours to own.
  example: []
  syntax:
    content: public static Material LoadDefault(DefaultMaterial material)
    parameters:
    - id: material
      type: Prowl.Runtime.Resources.DefaultMaterial
    return:
      type: Prowl.Runtime.Resources.Material
    content.vb: Public Shared Function LoadDefault(material As DefaultMaterial) As Material
  overload: Prowl.Runtime.Resources.Material.LoadDefault*
