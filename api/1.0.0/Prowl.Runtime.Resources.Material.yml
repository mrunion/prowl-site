    id: RevertProperty
    path: ../Prowl/Prowl.Runtime/Resources/Material.cs
    startLine: 180
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: >-
    Forget the user override for <code class="paramref">name</code> next sync
        will refill it from the shader's current default. Useful for an inspector
        "revert to default" button.
  remarks: >-
    Removes from BOTH the override set AND the backing <code>_properties</code> dict.

    If we only cleared <code>_overrides</code>, <code>ApplyMaterialUniforms</code> would still

    see the stale value in <code>_properties</code> and upload it anyway the defaults

    fill-in path only runs for keys not already in the property dict. This was a

    silent "revert does nothing" bug before.
  example: []
  syntax:
    content: public void RevertProperty(string name)
    parameters:
    - id: name
      type: System.String
    content.vb: Public Sub RevertProperty(name As String)
