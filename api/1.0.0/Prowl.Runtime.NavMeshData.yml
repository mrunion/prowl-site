- uid: Prowl.Runtime.NavMeshData.CacheLayers
  commentId: F:Prowl.Runtime.NavMeshData.CacheLayers
  id: CacheLayers
  parent: Prowl.Runtime.NavMeshData
  langs:
  - csharp
  - vb
  name: CacheLayers
  nameWithType: NavMeshData.CacheLayers
  fullName: Prowl.Runtime.NavMeshData.CacheLayers
  type: Field
  source:
    remote:
      path: Prowl.Runtime/Navigation/NavMeshData.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: CacheLayers
    path: ../Prowl/Prowl.Runtime/Navigation/NavMeshData.cs
    startLine: 78
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Compressed voxelization layers, one or more per tile. Each blob is self-describing (tile

    coordinates and layer index live in its header); a tile contributes several vertical

    layers where floors overlap. The TileCache contours these into Detour tiles, which is

    what lets an obstacle re-carve a tile without re-voxelizing the world.
  example: []
  syntax:
    content: public List<NavMeshData.NavMeshTile> CacheLayers
    return:
      type: System.Collections.Generic.List{Prowl.Runtime.NavMeshData.NavMeshTile}
    content.vb: Public CacheLayers As List(Of NavMeshData.NavMeshTile)
- uid: Prowl.Runtime.NavMeshData.Clone
  commentId: M:Prowl.Runtime.NavMeshData.Clone
  id: Clone
  parent: Prowl.Runtime.NavMeshData
  langs:
  - csharp
  - vb
  name: Clone()
  nameWithType: NavMeshData.Clone()
  fullName: Prowl.Runtime.NavMeshData.Clone()
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Navigation/NavMeshData.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: Clone
    path: ../Prowl/Prowl.Runtime/Navigation/NavMeshData.cs
    startLine: 86
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    A copy for one consumer's private use, so runtime tile and link rewrites do not land on

    an asset every other consumer of the same <code>.navmesh</code> is reading. The blobs are

    shared rather than duplicated: a rebuild replaces entries in these lists and never edits

    one in place, so the copy costs two lists rather than the megabytes they point at.
  example: []
  syntax:
    content: public NavMeshData Clone()
    return:
      type: Prowl.Runtime.NavMeshData
    content.vb: Public Function Clone() As NavMeshData
  overload: Prowl.Runtime.NavMeshData.Clone*
- uid: Prowl.Runtime.NavMeshData.Links
  commentId: F:Prowl.Runtime.NavMeshData.Links
  id: Links
  parent: Prowl.Runtime.NavMeshData
  langs:
  - csharp
  - vb
  name: Links
  nameWithType: NavMeshData.Links
  fullName: Prowl.Runtime.NavMeshData.Links
  type: Field
  source:
    remote:
      path: Prowl.Runtime/Navigation/NavMeshData.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: Links
    path: ../Prowl/Prowl.Runtime/Navigation/NavMeshData.cs
    startLine: 142
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Off-mesh links. Tiles are rebuilt from geometry-only layers whenever an obstacle carves

    or a region regenerates — anything baked into them is regenerated away — so links live

    here and are re-injected on every tile build. Kept in step with the live

    <xref href="Prowl.Runtime.NavMeshLink" data-throw-if-not-resolved="false"></xref>s by <xref href="Prowl.Runtime.NavMeshSurface.RebuildLinkTiles(System.ReadOnlySpan%7bProwl.Vector.AABB%7d%2cSystem.Collections.Generic.IReadOnlyList%7bProwl.Runtime.NavMeshLinkSource%7d)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public List<NavMeshLinkSource> Links
    return:
      type: System.Collections.Generic.List{Prowl.Runtime.NavMeshLinkSource}
    content.vb: Public Links As List(Of NavMeshLinkSource)
