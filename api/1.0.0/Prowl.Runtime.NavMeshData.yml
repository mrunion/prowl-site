  summary: >-
    Navmesh tile slots this asset was baked for. A slot holds one VERTICAL LAYER,
        not one grid tile, so this is the grid scaled by the layers a tile is expected to stack.
        <xref href="Prowl.Runtime.NavMeshData.ResolveCapacity" data-throw-if-not-resolved="false"></xref> is what instantiation actually uses.
