  namespace: Prowl.Runtime
  summary: >-
    A baked navmesh as a standalone <code>.navmesh</code> asset: the compressed layers plus everything

    needed to reinstantiate a <xref href="Prowl.Recast.Detour.DtNavMesh" data-throw-if-not-resolved="false"></xref> at load time. Built by

    <xref href="Prowl.Runtime.NavMeshBuilder" data-throw-if-not-resolved="false"></xref> and registered through <xref href="Prowl.Runtime.NavMeshWorld.AddNavMeshData(Prowl.Runtime.NavMeshData)" data-throw-if-not-resolved="false"></xref>.

    Independent of any scene, so a procedural world can build one at runtime.
  example: []
  syntax:
