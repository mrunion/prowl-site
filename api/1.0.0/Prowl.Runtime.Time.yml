  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Multiplies the time scale until the returned modifier is removed. Use this rather than setting <xref href="Prowl.Runtime.Time.TimeScale" data-throw-if-not-resolved="false"></xref>

    for temporary effects (slow motion, hit stop), since several can overlap and each removes only its own.

    Modifiers belong to the current time context, so play mode's end with it.
