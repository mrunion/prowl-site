- uid: Prowl.Runtime.Time.FixedAccumulator
  commentId: F:Prowl.Runtime.Time.FixedAccumulator
  id: FixedAccumulator
  parent: Prowl.Runtime.Time
  langs:
  - csharp
  - vb
  name: FixedAccumulator
  nameWithType: Time.FixedAccumulator
  fullName: Prowl.Runtime.Time.FixedAccumulator
  type: Field
  source:
    remote:
      path: Prowl.Runtime/Time.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: FixedAccumulator
    path: ../Prowl/Prowl.Runtime/Time.cs
    startLine: 132
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    How far the frame being drawn sits past the last fixed step, in seconds - the fixed loop

    leaves this holding whatever part of the frame its steps did not consume, so it is always

    under <xref href="Prowl.Runtime.Time.FixedDeltaTime" data-throw-if-not-resolved="false"></xref> by the time the scene's Update runs.


    This is the alpha physics interpolation has to render at. Counting time since the last step

    with a per-frame accumulator instead does not work: the step that resets such a counter

    happens partway through a frame, and the whole of that frame's delta then gets added on top

    of time the step already consumed, which reads back a pose the body has not reached yet.

    Owned by the game loop - read it, do not write it.
  example: []
  syntax:
    content: public static float FixedAccumulator
    return:
      type: System.Single
    content.vb: Public Shared FixedAccumulator As Single
