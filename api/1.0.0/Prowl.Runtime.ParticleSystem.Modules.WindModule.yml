  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.ParticleSystem.Modules
  summary: >-
    Blows particles around. The wind a particle feels is a steady <xref href="Prowl.Runtime.ParticleSystem.Modules.WindModule.AmbientWind" data-throw-if-not-resolved="false"></xref>, plus the

    nearest <xref href="Prowl.Runtime.WindZone" data-throw-if-not-resolved="false"></xref>, plus a swirling turbulence layer. The zone is picked once per

    frame from the system's position, everything else is sampled per particle.
  example: []
  syntax:
    content: >-
      [Serializable]

      public class WindModule : ParticleSystemModule
    content.vb: >-
      <Serializable>

      Public Class WindModule Inherits ParticleSystemModule
