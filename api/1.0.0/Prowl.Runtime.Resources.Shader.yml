  summary: >-
    Pulls the declared path out of the <code>Shader "Some/Path"</code> line at the top of a shader

    source, without running the parser. Leading comments and blank lines are skipped, so this

    works on files that open with a header comment. Returns <code>null</code> when no declaration is

    found in the first few lines.
