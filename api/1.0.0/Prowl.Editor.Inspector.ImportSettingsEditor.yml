  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Inspector
  summary: Base for editors whose authored state is an asset's <code>.meta</code> import settings.
  remarks: >-
    Draw fields straight against <xref href="Prowl.Editor.Inspector.ImportSettingsEditor.Settings(Prowl.Editor.AssetEntry)" data-throw-if-not-resolved="false"></xref> and there is nothing else to do. That compound is

    the state <xref href="Prowl.Editor.Inspector.AssetImporterEditor" data-throw-if-not-resolved="false"></xref> diffs, so edits register as pending on their own, Apply

    writes them and reimports, and Revert restores the last written values. No dirty flag per field to

    remember, and no reload-from-disk on every selection change.
  example: []
  syntax:
    content: 'public abstract class ImportSettingsEditor : AssetImporterEditor'
    content.vb: Public MustInherit Class ImportSettingsEditor Inherits AssetImporterEditor
