- uid: Prowl.Runtime.Rendering.GlobalUniforms.GetBuffer
  commentId: M:Prowl.Runtime.Rendering.GlobalUniforms.GetBuffer
  id: GetBuffer
  parent: Prowl.Runtime.Rendering.GlobalUniforms
  langs:
  - csharp
  - vb
  name: GetBuffer()
  nameWithType: GlobalUniforms.GetBuffer()
  fullName: Prowl.Runtime.Rendering.GlobalUniforms.GetBuffer()
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Rendering/GlobalUniforms.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: GetBuffer
    path: ../Prowl/Prowl.Runtime/Rendering/GlobalUniforms.cs
    startLine: 103
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Gets the uniform buffer for binding to shaders. Does NOT lazily initialize:

    this is called by the executor on the render thread, and the non-atomic

    create-if-null in <xref href="Prowl.Runtime.Rendering.GlobalUniforms.Initialize" data-throw-if-not-resolved="false"></xref> must only ever run on the main

    thread. <xref href="Prowl.Runtime.Rendering.GlobalUniforms.Upload" data-throw-if-not-resolved="false"></xref> (called by the pipeline each frame before any

    draw) creates the buffer, so by submit order it is non-null here. Returns

    null only before the first Upload; PrepareDraw skips the bind in that case.
  example: []
  syntax:
    content: public static GraphicsBuffer? GetBuffer()
    return:
      type: Prowl.Runtime.GraphicsBuffer
    content.vb: Public Shared Function GetBuffer() As GraphicsBuffer
  overload: Prowl.Runtime.Rendering.GlobalUniforms.GetBuffer*
