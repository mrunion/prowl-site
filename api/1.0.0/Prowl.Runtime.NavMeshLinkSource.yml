  namespace: Prowl.Runtime
  summary: >-
    A world-space off-mesh connection fed into a bake (the payload of <xref href="Prowl.Runtime.NavMeshLink" data-throw-if-not-resolved="false"></xref>).

    Self-contained — no Transform or component references — so it is safe to hand to a

    background build. A link with <xref href="Prowl.Runtime.NavMeshLinkSource.Width" data-throw-if-not-resolved="false"></xref> &gt; 0 is expanded into parallel

    connections across the span, so an agent enters at the nearest point along it.
