- uid: Prowl.Runtime.NavMeshLinkSource.ExpandCrossings(System.Single,System.Collections.Generic.List{System.ValueTuple{Prowl.Vector.Float3,Prowl.Vector.Float3}})
  commentId: M:Prowl.Runtime.NavMeshLinkSource.ExpandCrossings(System.Single,System.Collections.Generic.List{System.ValueTuple{Prowl.Vector.Float3,Prowl.Vector.Float3}})
  id: ExpandCrossings(System.Single,System.Collections.Generic.List{System.ValueTuple{Prowl.Vector.Float3,Prowl.Vector.Float3}})
  parent: Prowl.Runtime.NavMeshLinkSource
  langs:
  - csharp
  - vb
  name: ExpandCrossings(float, List<(Float3 Start, Float3 End)>)
  nameWithType: NavMeshLinkSource.ExpandCrossings(float, List<(Float3 Start, Float3 End)>)
  fullName: Prowl.Runtime.NavMeshLinkSource.ExpandCrossings(float, System.Collections.Generic.List<(Prowl.Vector.Float3 Start, Prowl.Vector.Float3 End)>)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Navigation/NavMeshPrimitives.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: ExpandCrossings
    path: ../Prowl/Prowl.Runtime/Navigation/NavMeshPrimitives.cs
    startLine: 757
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    The crossing points this link becomes: one per parallel connection, spread across

    <xref href="Prowl.Runtime.NavMeshLinkSource.Width" data-throw-if-not-resolved="false"></xref> (capped at 8). A wide link should let an agent enter at the nearest point

    along its entry edge, but a Detour off-mesh connection is a single point, so a span is

    approximated by several of them side by side and the agent takes the nearest.

    Re-expanded every time the cache re-contours a tile.
  example: []
  syntax:
    content: public readonly void ExpandCrossings(float agentRadius, List<(Float3 Start, Float3 End)> results)
    parameters:
    - id: agentRadius
      type: System.Single
      description: >-
        Bake agent radius: the connection radius, the spacing between
            parallel connections, and the inset that keeps the outermost ones on the span.
    - id: results
      type: System.Collections.Generic.List{System.ValueTuple{Prowl.Vector.Float3,Prowl.Vector.Float3}}
      description: Receives the crossings; not cleared.
    content.vb: Public Sub ExpandCrossings(agentRadius As Single, results As List(Of (Start As Float3, [End] As Float3)))
  overload: Prowl.Runtime.NavMeshLinkSource.ExpandCrossings*
  nameWithType.vb: NavMeshLinkSource.ExpandCrossings(Single, List(Of (Start As Float3, End As Float3)))
  fullName.vb: Prowl.Runtime.NavMeshLinkSource.ExpandCrossings(Single, System.Collections.Generic.List(Of (Start As Prowl.Vector.Float3, End As Prowl.Vector.Float3)))
  name.vb: ExpandCrossings(Single, List(Of (Start As Float3, End As Float3)))
