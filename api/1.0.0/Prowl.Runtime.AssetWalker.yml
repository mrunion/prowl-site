  namespace: Prowl.Runtime
  summary: >-
    Visits everything reachable from a root through instance fields, marking each asset it meets. It follows every

    field whose type can hold an asset, serialized or not, except ones marked <xref href="Prowl.Runtime.NotHeldAttribute" data-throw-if-not-resolved="false"></xref>.

    It does not see statics, delegates or what a lambda or async method captured, so an asset held only there should

    be held with <xref href="Prowl.Runtime.AssetDatabase.Hold(Prowl.Runtime.Asset%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
