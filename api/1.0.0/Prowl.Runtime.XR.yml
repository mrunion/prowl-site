      repo: https://github.com/ProwlEngine/Prowl.git
    id: XR
    path: ../Prowl/Prowl.Runtime/XR/XR.cs
    startLine: 83
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Headset rendering and tracking through OpenXR.


    <p>

    While running, every perspective <xref href="Prowl.Runtime.Camera" data-throw-if-not-resolved="false"></xref> with no target texture and a <xref href="Prowl.Runtime.Camera.StereoTargetEye" data-throw-if-not-resolved="false"></xref>

    renders once per eye into the headset, using its transform as the head. Put a <xref href="Prowl.Runtime.TrackedPoseDriver" data-throw-if-not-resolved="false"></xref> on the

    camera so the head moves it, under a parent that places the play area in the world. The headset paces the frame

    loop while it shows frames, so VSync and <xref href="Prowl.Runtime.Application.TargetFrameRate" data-throw-if-not-resolved="false"></xref> are set aside meanwhile.

    </p>
  example: []
