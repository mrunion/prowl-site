  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Copies a GameObject tree onto an existing one. Objects the map pairs, then components and children of the

    same type in the same place, are filled in place so references to them stay valid. What the target has

    beyond the source is kept, what it lacks is added, and its objects keep their own identifiers.
  example: []
  syntax:
    content: public static void CopyTo(GameObject source, GameObject target, CopyMap? map = null)
    parameters:
    - id: source
      type: Prowl.Runtime.GameObject
    - id: target
      type: Prowl.Runtime.GameObject
    - id: map
      type: Prowl.Runtime.CopyMap
    content.vb: Public Shared Sub CopyTo(source As GameObject, target As GameObject, map As CopyMap = Nothing)
