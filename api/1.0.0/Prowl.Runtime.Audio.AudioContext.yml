- uid: Prowl.Runtime.Audio.AudioContext.Restart(System.UInt32,System.UInt32,System.UInt32,Prowl.Runtime.Audio.DeviceInfo)
  commentId: M:Prowl.Runtime.Audio.AudioContext.Restart(System.UInt32,System.UInt32,System.UInt32,Prowl.Runtime.Audio.DeviceInfo)
  id: Restart(System.UInt32,System.UInt32,System.UInt32,Prowl.Runtime.Audio.DeviceInfo)
  parent: Prowl.Runtime.Audio.AudioContext
  langs:
  - csharp
  - vb
  name: Restart(uint, uint, uint, DeviceInfo)
  nameWithType: AudioContext.Restart(uint, uint, uint, DeviceInfo)
  fullName: Prowl.Runtime.Audio.AudioContext.Restart(uint, uint, uint, Prowl.Runtime.Audio.DeviceInfo)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Audio/AudioContext.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: Restart
    path: ../Prowl/Prowl.Runtime/Audio/AudioContext.cs
    startLine: 284
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Audio
  summary: >-
    Reopens a running device with a different format or on a different output. Does nothing if the

    settings already match, and nothing at all if no device is open. Opening the first one is

    <xref href="Prowl.Runtime.Audio.AudioContext.Initialize(System.UInt32%2cSystem.UInt32%2cSystem.UInt32%2cProwl.Runtime.Audio.DeviceInfo)" data-throw-if-not-resolved="false"></xref>'s job.
  remarks: >-
    Everything the old device owned is invalid afterwards, which is what

    <xref href="Prowl.Runtime.Audio.AudioContext.DeviceGeneration" data-throw-if-not-resolved="false"></xref> exists to tell the rest of the engine. Decoded clip data is not

    device owned and survives untouched.


    The no device case is not an oversight. Project settings are applied from paths that never

    wanted audio, headless builds and dedicated servers among them, and reopening had no way to

    tell those apart from a real format change.
  example: []
  syntax:
    content: public static void Restart(uint sampleRate, uint channels, uint periodSizeInFrames = 2048, DeviceInfo deviceInfo = null)
    parameters:
    - id: sampleRate
      type: System.UInt32
    - id: channels
      type: System.UInt32
    - id: periodSizeInFrames
      type: System.UInt32
    - id: deviceInfo
      type: Prowl.Runtime.Audio.DeviceInfo
    content.vb: Public Shared Sub Restart(sampleRate As UInteger, channels As UInteger, periodSizeInFrames As UInteger = 2048, deviceInfo As DeviceInfo = Nothing)
  overload: Prowl.Runtime.Audio.AudioContext.Restart*
  nameWithType.vb: AudioContext.Restart(UInteger, UInteger, UInteger, DeviceInfo)
  fullName.vb: Prowl.Runtime.Audio.AudioContext.Restart(UInteger, UInteger, UInteger, Prowl.Runtime.Audio.DeviceInfo)
  name.vb: Restart(UInteger, UInteger, UInteger, DeviceInfo)
