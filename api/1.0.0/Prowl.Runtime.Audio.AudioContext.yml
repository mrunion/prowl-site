- uid: Prowl.Runtime.Audio.AudioContext.ToAudioSpace(Prowl.Vector.Float3)
  commentId: M:Prowl.Runtime.Audio.AudioContext.ToAudioSpace(Prowl.Vector.Float3)
  id: ToAudioSpace(Prowl.Vector.Float3)
  parent: Prowl.Runtime.Audio.AudioContext
  langs:
  - csharp
  - vb
  name: ToAudioSpace(Float3)
  nameWithType: AudioContext.ToAudioSpace(Float3)
  fullName: Prowl.Runtime.Audio.AudioContext.ToAudioSpace(Prowl.Vector.Float3)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Audio/AudioContext.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: ToAudioSpace
    path: ../Prowl/Prowl.Runtime/Audio/AudioContext.cs
    startLine: 73
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Audio
  summary: Converts a world position, direction or velocity into the space the audio engine works in.
  remarks: >-
    Prowl is left handed with +Z forward, the audio engine is right handed with -Z forward, so the

    two disagree by a mirror on one axis. Mirroring the vectors that cross the boundary is what

    gets all three axes right. Mirroring one of the listener's basis vectors instead (negating its

    world up, say) also lines left and right back up, but it does it by flipping the handedness of

    the basis, which leaves vertical inverted.
  example: []
  syntax:
    content: public static Float3 ToAudioSpace(Float3 vector)
    parameters:
    - id: vector
      type: Prowl.Vector.Float3
    return:
      type: Prowl.Vector.Float3
    content.vb: Public Shared Function ToAudioSpace(vector As Float3) As Float3
  overload: Prowl.Runtime.Audio.AudioContext.ToAudioSpace*
