  assemblies:
  - Prowl.Editor.Test
  namespace: Prowl.Editor.Test
  summary: >-
    An <code>async void</code> method in a game script. Its state machine calls

    <code>AsyncVoidMethodBuilder.Create()</code>, which lives in the core library and is reached through

    type forwards in the framework facades, so it is the first thing to break when the player loads

    those facades from somewhere the runtime did not put them.
