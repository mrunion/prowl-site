  summary: >-
    The parts of the build that need a real project: collecting its assets, compiling its scripts,

    producing a player and running it. Separate from <xref href="Prowl.Editor.Test.BuildSystemTests" data-throw-if-not-resolved="false"></xref> because every test

    here constructs an editor and a project on disk.
