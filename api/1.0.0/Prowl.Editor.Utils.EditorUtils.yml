      repo: https://github.com/ProwlEngine/Prowl.git
    id: SafeFileName
    path: ../Prowl/Prowl.Editor/Utils/EditorUtils.cs
    startLine: 34
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Utils
  summary: Turns arbitrary text into something safe to use as a single path segment.
  remarks: >-
    Anywhere a name the user typed becomes a folder or a file. Dropping the invalid characters is not

    enough on its own: "." and ".." survive that filter and still walk up a directory, and a name that

    is rooted or carries a separator makes <xref href="System.IO.Path.Combine(System.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref> return somewhere else entirely

    rather than a child of the folder that was meant.
  example: []
  syntax:
    content: public static string SafeFileName(string name, string fallback)
    parameters:
    - id: name
      type: System.String
    - id: fallback
      type: System.String
    return:
      type: System.String
    content.vb: Public Shared Function SafeFileName(name As String, fallback As String) As String
  overload: Prowl.Editor.Utils.EditorUtils.SafeFileName*
  nameWithType.vb: EditorUtils.SafeFileName(String, String)
  fullName.vb: Prowl.Editor.Utils.EditorUtils.SafeFileName(String, String)
  name.vb: SafeFileName(String, String)
