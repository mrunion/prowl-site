    id: DescribeObjectRef
    path: ../Prowl/Prowl.Editor/GUI/PropertyGridUtils.cs
    startLine: 24
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.GUI
  summary: >-
    Build the "Name (Type)" label an object-reference field shows in the property grid. 

    A scene component has no name of its own so it uses the name of the GameObject it lives on and typed

    by the component (e.g. "Player (Rigidbody)"). GameObjects and assets carry a real Name, so they use it.

    Field Type is used as a fallback for empty references.
  example: []
  syntax:
    content: public static string DescribeObjectRef(EngineObject? instance, Type fieldType)
    parameters:
    - id: instance
      type: Prowl.Runtime.EngineObject
    - id: fieldType
      type: System.Type
    return:
      type: System.String
    content.vb: Public Shared Function DescribeObjectRef(instance As EngineObject, fieldType As Type) As String
