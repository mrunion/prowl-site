  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.UI
  summary: >-
    Base class for every interactive UI widget - buttons, toggles, sliders, dropdowns.

    Tracks the pointer state machine, drives a sibling <xref href="Prowl.Runtime.UI.Graphic" data-throw-if-not-resolved="false"></xref>'s color

    across the four states, fires SFX through UISounds, and exposes

    per-instance overrides for both the colors and the audio.
  example: []
  syntax:
    content: >-
      [AddComponentMenu("UI/Selectable", "")]

      [RequireComponent(new Type[] { typeof(RectTransform) })]

      public class Selectable : UIBehaviour, IDisposable, ISerializationCallbackReceiver, IPointerEnterHandler, IPointerExitHandler, IPointerDownHandler, IPointerUpHandler, ISelectHandler, IDeselectHandler, IMoveHandler
    content.vb: >-
      <AddComponentMenu("UI/Selectable", "")>

      <RequireComponent(New Type() { GetType(RectTransform) })>

      Public Class Selectable Inherits UIBehaviour Implements IDisposable, ISerializationCallbackReceiver, IPointerEnterHandler, IPointerExitHandler, IPointerDownHandler, IPointerUpHandler, ISelectHandler, IDeselectHandler, IMoveHandler
