  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.UI
  summary: >-
    The effective interactable state: the local <xref href="Prowl.Runtime.UI.Selectable.Interactable" data-throw-if-not-resolved="false"></xref> flag AND no enclosing

    <xref href="Prowl.Runtime.UI.CanvasGroup" data-throw-if-not-resolved="false"></xref> (up to the canvas root, or the nearest one that ignores its parents)

    has <xref href="Prowl.Runtime.UI.CanvasGroup.Interactable" data-throw-if-not-resolved="false"></xref> turned off. Pointer/submit handling gates on this, so

    a non-interactable group makes its whole subtree inert while still blocking click-through.
  example: []
  syntax:
    content: public bool IsInteractable()
    return:
      type: System.Boolean
    content.vb: Public Function IsInteractable() As Boolean
  overload: Prowl.Runtime.UI.Selectable.IsInteractable*
