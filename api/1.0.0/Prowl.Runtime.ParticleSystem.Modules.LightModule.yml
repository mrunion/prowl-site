  namespace: Prowl.Runtime.ParticleSystem.Modules
  summary: >-
    Attaches a point light to some of the particles. Lights join the scene's dynamic light BVH like any

    other light, and never cast shadows. Keep <xref href="Prowl.Runtime.ParticleSystem.Modules.LightModule.MaxLights" data-throw-if-not-resolved="false"></xref> tight, every light costs shading time

    on every surface it reaches.
