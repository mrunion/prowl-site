  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Describes a contact between one of this GameObject's colliders and something else. Both sides of a

    contact receive their own copy, each describing the other side.


    <p></p>


    Static geometry has no rigidbody of its own, so <xref href="Prowl.Runtime.Collision.Rigidbody" data-throw-if-not-resolved="false"></xref> is null for it and

    <xref href="Prowl.Runtime.Collision.Collider" data-throw-if-not-resolved="false"></xref> is what names the surface. Terrain has neither, and only fills in

    <xref href="Prowl.Runtime.Collision.GameObject" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public readonly struct Collision
    content.vb: Public Structure Collision
