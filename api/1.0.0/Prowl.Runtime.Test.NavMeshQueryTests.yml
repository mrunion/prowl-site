- uid: Prowl.Runtime.Test.NavMeshQueryTests.RemovingANavMesh_DisposesItsLockOnceTheLastQueryIsDone
  commentId: M:Prowl.Runtime.Test.NavMeshQueryTests.RemovingANavMesh_DisposesItsLockOnceTheLastQueryIsDone
  id: RemovingANavMesh_DisposesItsLockOnceTheLastQueryIsDone
  parent: Prowl.Runtime.Test.NavMeshQueryTests
  langs:
  - csharp
  - vb
  name: RemovingANavMesh_DisposesItsLockOnceTheLastQueryIsDone()
  nameWithType: NavMeshQueryTests.RemovingANavMesh_DisposesItsLockOnceTheLastQueryIsDone()
  fullName: Prowl.Runtime.Test.NavMeshQueryTests.RemovingANavMesh_DisposesItsLockOnceTheLastQueryIsDone()
  type: Method
  source:
    remote:
      path: Prowl.Runtime.Test/NavMeshQueryTests.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: RemovingANavMesh_DisposesItsLockOnceTheLastQueryIsDone
    path: ../Prowl/Prowl.Runtime.Test/NavMeshQueryTests.cs
    startLine: 336
  assemblies:
  - Prowl.Runtime.Test
  namespace: Prowl.Runtime.Test
  summary: >-
    An instance's lock holds wait handles that only Dispose releases, so unregistering has to

    dispose it — but a query rented a moment earlier is still inside it, and disposing under

    one throws on that thread instead of ours. Removal drops its own hold and bars new

    queries; the last query out is what actually disposes.
  example: []
  syntax:
