  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.UI
  summary: >-
    Drives GameObject-UI input. A scene needs exactly one enabled <xref href="Prowl.Runtime.UI.EventSystem" data-throw-if-not-resolved="false"></xref>

    for its <xref href="Prowl.Runtime.GameCanvas" data-throw-if-not-resolved="false"></xref>es to receive pointer and keyboard events. Each frame it hit-tests the

    pointer against the scene's canvases (via <xref href="Prowl.Runtime.UI.UIRaycaster" data-throw-if-not-resolved="false"></xref>) and dispatches enter/exit, press,

    drag, click, scroll, submit/cancel and selection events to the components under it.
  remarks: >-
    This is entirely game-space: it ticks from <xref href="Prowl.Runtime.UI.EventSystem.Update" data-throw-if-not-resolved="false"></xref> (play mode only) and nothing in the

    engine loop drives it. A <xref href="Prowl.Runtime.GameCanvas" data-throw-if-not-resolved="false"></xref> has no dependency on it - delete this component and

    canvases still render, they just stop receiving input - so you can drop in your own event system.

    Access the active one through <xref href="Prowl.Runtime.UI.EventSystem.Current" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [AddComponentMenu("UI/Event System", "")]

      [ComponentIcon("")]

      public sealed class EventSystem : MonoBehaviour, IDisposable, ISerializationCallbackReceiver
    content.vb: >-
      <AddComponentMenu("UI/Event System", "")>

      <ComponentIcon("")>

      Public NotInheritable Class EventSystem Inherits MonoBehaviour Implements IDisposable, ISerializationCallbackReceiver
