  fullName: Prowl.Vector.Transform.LocalToWorldMatrix
  type: Property
  source:
    remote:
      path: Prowl.Runtime/Math/Transform.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: LocalToWorldMatrix
    path: ../Prowl/Prowl.Runtime/Math/Transform.cs
    startLine: 191
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Vector
  summary: >-
    World matrix of this transform. Lazily cached: it only rebuilds when this transform's

    <xref href="Prowl.Vector.Transform.Version" data-throw-if-not-resolved="false"></xref> changes or an ancestor's world matrix changes, so an unmoving object

    walks its ancestor chain doing cheap version comparisons instead of rebuilding matrices.

    Every rebuild bumps <xref href="Prowl.Vector.Transform._worldVersion" data-throw-if-not-resolved="false"></xref> so descendants know to invalidate.

    Not thread-safe: transforms are expected to be read on a single thread per frame.
  example: []
  syntax:
    content: public virtual Float4x4 LocalToWorldMatrix { get; }
    parameters: []
    return:
      type: Prowl.Vector.Float4x4
    content.vb: Public Overridable ReadOnly Property LocalToWorldMatrix As Float4x4
  overload: Prowl.Vector.Transform.LocalToWorldMatrix*
