  assemblies:
  - Prowl.Analyzers
  namespace: Prowl.Analyzers
  summary: >-
    Flags constructors declared on a <code>MonoBehaviour</code>. The engine constructs components itself,

    through <code>AddComponent</code> and through deserialization, and a constructor runs before the

    component is attached to anything: <code>GameObject</code> and <code>Transform</code> are not set yet, and

    serialized field values have not been written. Anything that needs those belongs in

    <code>OnEnable</code>, <code>Awake</code> or <code>Start</code>.
  example: []
  syntax:
    content: >-
      [DiagnosticAnalyzer("C#", new string[] { })]

      public sealed class MonoBehaviourConstructorAnalyzer : DiagnosticAnalyzer
    content.vb: >-
      <DiagnosticAnalyzer("C#", New String() { })>

      Public NotInheritable Class MonoBehaviourConstructorAnalyzer Inherits DiagnosticAnalyzer
