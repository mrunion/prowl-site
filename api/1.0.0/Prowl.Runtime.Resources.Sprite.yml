- uid: Prowl.Runtime.Resources.Sprite.BuildTightGeometry(Prowl.Runtime.Resources.SpriteMeshTracer.TracedMesh,System.Int32,System.Int32)
  commentId: M:Prowl.Runtime.Resources.Sprite.BuildTightGeometry(Prowl.Runtime.Resources.SpriteMeshTracer.TracedMesh,System.Int32,System.Int32)
  id: BuildTightGeometry(Prowl.Runtime.Resources.SpriteMeshTracer.TracedMesh,System.Int32,System.Int32)
  parent: Prowl.Runtime.Resources.Sprite
  langs:
  - csharp
  - vb
  name: BuildTightGeometry(TracedMesh, int, int)
  nameWithType: Sprite.BuildTightGeometry(SpriteMeshTracer.TracedMesh, int, int)
  fullName: Prowl.Runtime.Resources.Sprite.BuildTightGeometry(Prowl.Runtime.Resources.SpriteMeshTracer.TracedMesh, int, int)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Resources/Sprite.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: BuildTightGeometry
    path: ../Prowl/Prowl.Runtime/Resources/Sprite.cs
    startLine: 181
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: >-
    Replaces this sprite's geometry with a tight silhouette mesh from <xref href="Prowl.Runtime.Resources.SpriteMeshTracer" data-throw-if-not-resolved="false"></xref>.

    Traced coordinates are in the rect's pixel space (bottom-left origin); they map to pivot-relative

    local units for the vertices and to atlas UVs. The simplified outline becomes <xref href="Prowl.Runtime.Resources.Sprite.PhysicsShape" data-throw-if-not-resolved="false"></xref>.

    Falls back to a quad if the traced mesh is degenerate.
