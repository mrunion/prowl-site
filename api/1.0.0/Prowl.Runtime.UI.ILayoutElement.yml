  summary: >-
    Reports desired sizes to a parent <xref href="Prowl.Runtime.UI.LayoutGroup" data-throw-if-not-resolved="false"></xref> / <xref href="Prowl.Runtime.UI.ContentSizeFitter" data-throw-if-not-resolved="false"></xref>.

    A value of <code>-1</code> means "not specified" - the layout system falls back to the next source

    (min, then the element's intrinsic size).
