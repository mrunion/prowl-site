  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor
  summary: Called on the main thread each frame. Returns debounced, coalesced events.
  example: []
  syntax:
    content: public List<FileEvent> DrainEvents(bool force = false)
    parameters:
    - id: force
      type: System.Boolean
      description: >-
        Skip the debounce wait and return whatever is queued right now. For callers
            that must not run against stale state (starting a build, regaining focus) and would otherwise
            race the debounce window.
    return:
      type: System.Collections.Generic.List{Prowl.Editor.FileEvent}
    content.vb: Public Function DrainEvents(force As Boolean = False) As List(Of FileEvent)
