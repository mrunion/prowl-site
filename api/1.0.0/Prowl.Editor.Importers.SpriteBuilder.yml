  summary: >-
    Builds a texture's <xref href="Prowl.Runtime.Resources.Sprite" data-throw-if-not-resolved="false"></xref> sub-assets from its <xref href="Prowl.Editor.Importers.SpriteImportSettings" data-throw-if-not-resolved="false"></xref>. Single

    mode yields one full-texture sprite; Multiple yields one per slice. Handles pivot-unit conversion,

    per-sprite border, secondary maps, and optional tight-mesh tracing.
