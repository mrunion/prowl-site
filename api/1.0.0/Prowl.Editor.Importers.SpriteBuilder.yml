  summary: >-
    The identity seeding a slice's sub-asset GUID. Always an explicit key, never order: slices are a

    user-edited list, and the grid slicer skips cells that become fully transparent, so an index here

    tracks neither the slice nor anything stable about it.
  example: []
  syntax:
    content: public static SubAssetIdentity IdentityOf(SpriteImportSettings s, SpriteSliceData slice)
    parameters:
    - id: s
      type: Prowl.Editor.Importers.SpriteImportSettings
    - id: slice
      type: Prowl.Editor.Importers.SpriteSliceData
    return:
      type: Prowl.Editor.Importers.SubAssetIdentity
    content.vb: Public Shared Function IdentityOf(s As SpriteImportSettings, slice As SpriteSliceData) As SubAssetIdentity
