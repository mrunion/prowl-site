  namespace: Prowl.Editor.Projects.Scripting
  summary: >-
    Maps a dragged script asset (a <code>.cs</code> file) to the component <xref href="System.Type" data-throw-if-not-resolved="false"></xref> it defines.

    Scripts are not runtime assets (the importer only triggers recompilation), so the type is resolved

    by matching the file name against a <xref href="Prowl.Runtime.MonoBehaviour" data-throw-if-not-resolved="false"></xref> type of the same name in the loaded

    assemblies - the same file-name-equals-class-name convention the script pipeline already relies on.
