  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Core
  summary: >-
    Central registry for named, rebindable keyboard shortcuts.

    Shortcuts are registered at startup and checked each frame via <xref href="Prowl.Editor.Core.ShortcutManager.IsPressed(System.String)" data-throw-if-not-resolved="false"></xref>.

    User overrides are persisted in <xref href="Prowl.Editor.Theming.EditorSettings.ShortcutOverrides" data-throw-if-not-resolved="false"></xref>.
