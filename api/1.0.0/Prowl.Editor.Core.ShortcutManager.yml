    path: ../Prowl/Prowl.Editor/Core/ShortcutManager.cs
    startLine: 118
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Core
  summary: >-
    Returns true if the shortcut was triggered this frame.

    Checks <xref href="Prowl.Runtime.Input.GetKeyDown(Prowl.Runtime.KeyCode)" data-throw-if-not-resolved="false"></xref> for the primary key and enforces

    exact modifier state. On macOS the "Ctrl" modifier is interpreted as Cmd

    (Super) so platform-native shortcuts like Cmd+S work without rebinding.
  example: []
  syntax:
    content: public static bool IsPressed(string id)
    parameters:
    - id: id
      type: System.String
    return:
      type: System.Boolean
