  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.UI
  summary: >-
    Base for components that arrange their children's rects automatically. A group reports its own

    content size (via <xref href="Prowl.Runtime.UI.ILayoutElement" data-throw-if-not-resolved="false"></xref>) so it can nest inside another group, and

    <xref href="Prowl.Runtime.UI.LayoutGroup.Arrange(Prowl.Vector.Rect)" data-throw-if-not-resolved="false"></xref> writes each child's <xref href="Prowl.Vector.RectTransform.ComputedRect" data-throw-if-not-resolved="false"></xref> during the

    canvas rebuild. Children marked <xref href="Prowl.Runtime.UI.LayoutElement.IgnoreLayout" data-throw-if-not-resolved="false"></xref> are skipped.
  example: []
  syntax:
    content: >-
      [RequireComponent(new Type[] { typeof(RectTransform) })]

      public abstract class LayoutGroup : UIBehaviour, IDisposable, ISerializationCallbackReceiver, ILayoutElement
    content.vb: >-
      <RequireComponent(New Type() { GetType(RectTransform) })>

      Public MustInherit Class LayoutGroup Inherits UIBehaviour Implements IDisposable, ISerializationCallbackReceiver, ILayoutElement
