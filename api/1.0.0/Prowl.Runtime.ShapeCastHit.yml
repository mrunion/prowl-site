    id: Distance
    path: ../Prowl/Prowl.Runtime/Physics/ShapeCastHit.cs
    startLine: 31
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    How far along the cast the hit occurred, in world units. Zero for overlap queries, which do not

    sweep. This is <xref href="Prowl.Runtime.ShapeCastHit.Fraction" data-throw-if-not-resolved="false"></xref> already multiplied by the cast distance, which is what

    callers almost always want and is easy to get wrong by hand.
  example: []
  syntax:
    content: public float Distance
    return:
      type: System.Single
    content.vb: Public Distance As Single
