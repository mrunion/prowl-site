    path: ../Prowl/Prowl.Runtime/Physics/ShapeCastHit.cs
    startLine: 24
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    The fraction/lambda along the sweep direction where the hit occurred (0 = start, 1 = end of sweep).

    Note: This is not a distance, but a normalized value between 0 and 1. Prefer

    <xref href="Prowl.Runtime.ShapeCastHit.Distance" data-throw-if-not-resolved="false"></xref> unless the normalized form is what you actually want.
  example: []
  syntax:
    content: public float Fraction
    return:
      type: System.Single
    content.vb: Public Fraction As Single
