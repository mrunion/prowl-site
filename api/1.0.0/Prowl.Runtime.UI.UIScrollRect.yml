  type: Class
  source:
    remote:
      path: Prowl.Runtime/Components/UI/Input/UIScrollRect.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: UIScrollRect
    path: ../Prowl/Prowl.Runtime/Components/UI/Input/UIScrollRect.cs
    startLine: 16
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.UI
  summary: >-
    A scrollable view. Drag (or scroll-wheel over) the view to pan <xref href="Prowl.Runtime.UI.UIScrollRect.Content" data-throw-if-not-resolved="false"></xref> within

    <xref href="Prowl.Runtime.UI.UIScrollRect.Viewport" data-throw-if-not-resolved="false"></xref>, clamped so the content always covers the viewport. Pair the viewport with a

    <xref href="Prowl.Runtime.UI.RectMask" data-throw-if-not-resolved="false"></xref> to clip the overflow. Panning is done in the canvas's design-pixel space via

    <xref href="Prowl.Runtime.UI.PointerEventData.DesignPosition" data-throw-if-not-resolved="false"></xref>, so no screen/scale conversion is needed.
  example: []
  syntax:
    content: >-
      [AddComponentMenu("UI/Scroll View", "")]

      [ComponentIcon("")]

      [RequireComponent(new Type[] { typeof(RectTransform) })]

      public class UIScrollRect : UIBehaviour, IDisposable, ISerializationCallbackReceiver, IBeginDragHandler, IDragHandler, IEndDragHandler, IScrollHandler
    content.vb: >-
      <AddComponentMenu("UI/Scroll View", "")>

      <ComponentIcon("")>

      <RequireComponent(New Type() { GetType(RectTransform) })>

      Public Class UIScrollRect Inherits UIBehaviour Implements IDisposable, ISerializationCallbackReceiver, IBeginDragHandler, IDragHandler, IEndDragHandler, IScrollHandler
