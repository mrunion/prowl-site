  summary: Every target this engine can build for, including any added by a plugin.
  remarks: >-
    Target metadata only. Which pipeline builds a target is a separate question, answered by scanning for

    <xref href="Prowl.Editor.Build.BuildPipeline" data-throw-if-not-resolved="false"></xref> subclasses, so a platform that ships a pipeline is discovered without

    registering anything at all.
