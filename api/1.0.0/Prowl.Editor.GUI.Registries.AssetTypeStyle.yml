  summary: >-
    Visual style for an asset/file type in the browser: either a vector <xref href="Prowl.OrigamiUI.IOrigamiIcon" data-throw-if-not-resolved="false"></xref> or a

    short text <xref href="Prowl.Editor.GUI.Registries.AssetTypeStyle.Badge" data-throw-if-not-resolved="false"></xref> (e.g. "C#"), plus an accent <xref href="Prowl.Editor.GUI.Registries.AssetTypeStyle.Color" data-throw-if-not-resolved="false"></xref> used for the tinted

    thumbnail tile. Folders are <xref href="Prowl.Editor.GUI.Registries.AssetTypeStyle.Bare" data-throw-if-not-resolved="false"></xref> (no tile, just the icon).
