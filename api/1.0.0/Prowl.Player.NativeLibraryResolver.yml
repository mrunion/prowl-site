  namespace: Prowl.Player
  summary: Finds managed and native dependencies in a published player layout.
  remarks: >-
    A published build puts managed dependencies under <code>runtimes/</code> and natives under

    <code>runtimes/{rid}/native</code>, neither of which the default probing logic looks in. This belongs in the

    platform layer of a real assembly rather than being emitted as text into a generated program.
