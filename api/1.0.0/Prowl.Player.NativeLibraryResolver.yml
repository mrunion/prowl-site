      repo: https://github.com/ProwlEngine/Prowl.git
    id: Install
    path: ../Prowl/Players/Desktop/NativeLibraryResolver.cs
    startLine: 38
  assemblies:
  - Prowl.Player.Desktop
  namespace: Prowl.Player
  summary: >-
    Registers the resolvers. Safe to call more than once. Must run before anything triggers a load,

    which is why the entry point calls it first.
  remarks: >-
    Mentions no engine type on purpose. Preparing a method loads every type named in its body before

    its first statement runs, so naming one here would demand that assembly's dependencies out of

    <code>runtimes/</code> before the resolver that finds them exists. The engine's own import resolver is

    registered later, once loading works, from <xref href="Prowl.Player.DesktopPlayer.Initialize" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static void Install()
    content.vb: Public Shared Sub Install()
  overload: Prowl.Player.NativeLibraryResolver.Install*
