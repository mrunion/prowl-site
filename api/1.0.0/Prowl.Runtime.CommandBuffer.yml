    startLine: 36
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Records a sequence of GPU commands without touching the GL context. Submit the

    buffer through <xref href="Prowl.Runtime.Graphics.Submit(Prowl.Runtime.CommandBuffer)" data-throw-if-not-resolved="false"></xref> to enqueue it for the render thread.

    Buffers are pooled; the typical pattern is:


    <pre><code class="lang-csharp">using var cmd = Graphics.GetCommandBuffer("My Pass");

    cmd.SetRenderTarget(rt);

    cmd.ClearRenderTarget(ClearFlags.Color | ClearFlags.Depth, Color.Black);

    cmd.DrawMesh(mesh, material);

    Graphics.Submit(cmd);</code></pre>


    <p>Single-producer: only one thread encodes a given buffer. CBs execute on the

    render thread in submit order, so an upload CB can be safely followed by a CB

    that uses the uploaded data.</p>


    <p><xref href="Prowl.Runtime.CommandBuffer.SetProperties(Prowl.Runtime.Rendering.PropertyState)" data-throw-if-not-resolved="false"></xref>, <xref href="Prowl.Runtime.CommandBuffer.SetInstanceProperties(Prowl.Runtime.Rendering.PropertyState)" data-throw-if-not-resolved="false"></xref>, and

    <xref href="Prowl.Runtime.CommandBuffer.SetMaterialProperties(Prowl.Runtime.Resources.Material)" data-throw-if-not-resolved="false"></xref> all snapshot the PropertyState at encode

    time, so the caller is free to mutate the original immediately after.</p>
