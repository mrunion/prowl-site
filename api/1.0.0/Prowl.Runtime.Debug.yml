  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Logs <code class="paramref">message</code> the first time this <code class="paramref">id</code> is seen, then stays

    quiet however often it recurs. Ids are cleared when play mode changes and when scripts reload, so

    a condition you have just fixed reports again on the next run rather than staying silent.


    <p></p>


    Use a stable, specific id: <code>"MeshCollider.RelativeRebuild"</code>, not the message text.
