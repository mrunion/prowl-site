      repo: https://github.com/ProwlEngine/Prowl.git
    id: Destroy
    path: ../Prowl/Prowl.Runtime/EngineObject.cs
    startLine: 80
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Queues this object to be disposed at the end of the frame, once every callback has finished.

    It stays fully usable until then, so anything still holding it this frame keeps working, and

    teardown never lands in the middle of an Update, a render or a physics callback.


    <p></p>


    A destroyed GameObject still ticks and still collides for the rest of the frame. Set

    <code>Enabled = false</code> alongside this if that matters, or call <xref href="Prowl.Runtime.EngineObject.Dispose" data-throw-if-not-resolved="false"></xref> to tear

    down right now and deal with the consequences.
  example: []
  syntax:
    content: public void Destroy()
    content.vb: Public Sub Destroy()
  overload: Prowl.Runtime.EngineObject.Destroy*
