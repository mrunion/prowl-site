      <InlineData(New Object() { 1, 0 })>

      <InlineData(New Object() { 1, 5 })>

      <InlineData(New Object() { 5, 0 })>

      <InlineData(New Object() { 40, 0 })>

      <InlineData(New Object() { 8, 12 })>

