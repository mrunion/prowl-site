  id: Build_LinksAcrossTileBoundary_Instantiate(System.Int32,System.Single)
  parent: Prowl.Runtime.Test.NavMeshBuildTests
  langs:
  - csharp
  - vb
  name: Build_LinksAcrossTileBoundary_Instantiate(int, float)
  nameWithType: NavMeshBuildTests.Build_LinksAcrossTileBoundary_Instantiate(int, float)
  fullName: Prowl.Runtime.Test.NavMeshBuildTests.Build_LinksAcrossTileBoundary_Instantiate(int, float)
  type: Method
  source:
    remote:
      path: Prowl.Runtime.Test/NavMeshBuildTests.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: Build_LinksAcrossTileBoundary_Instantiate
    path: ../Prowl/Prowl.Runtime.Test/NavMeshBuildTests.cs
    startLine: 586
  assemblies:
  - Prowl.Runtime.Test
  namespace: Prowl.Runtime.Test
  summary: >-
    Links whose endpoints fall in DIFFERENT tiles have to bake AND instantiate, however many

    of them cross the same boundary. Detour sizes a tile's link pool when the tile is built

    and does not fully budget connections that leave it, so past a handful the pool overflows

    and AddTile throws IndexOutOfRange — at load, on an asset that baked and saved cleanly.

    The trigger is the count crossing one boundary, not the width: a single Width=5 link and

    five separate zero-width links failed identically. The tile builder now rations them, so

    the excess is dropped with a warning rather than taking the whole navmesh down.
  example: []
  syntax:
    content: >-
      [Theory]

      [InlineData(new object[] { 1, 0 })]

      [InlineData(new object[] { 1, 5 })]

      [InlineData(new object[] { 5, 0 })]

      [InlineData(new object[] { 40, 0 })]

      [InlineData(new object[] { 8, 12 })]

      public void Build_LinksAcrossTileBoundary_Instantiate(int linkCount, float width)
    parameters:
    - id: linkCount
      type: System.Int32
    - id: width
      type: System.Single
    content.vb: >-
