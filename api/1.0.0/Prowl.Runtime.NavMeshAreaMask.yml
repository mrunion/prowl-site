  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    A set of navigation areas (see <xref href="Prowl.Runtime.NavMeshAreas" data-throw-if-not-resolved="false"></xref>), one bit per area index.


    <p></p>


    Stored as exclusions, the way <xref href="Prowl.Runtime.LayerMask" data-throw-if-not-resolved="false"></xref> is: a default mask matches every area,

    including areas defined after it was saved, and clearing one area never quietly drops the rest.

    The serialized form is the inclusion mask.
