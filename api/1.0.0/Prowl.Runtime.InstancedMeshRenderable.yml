  example: []
  syntax:
    content: public InstancedMeshRenderable(Mesh mesh, Material material, InstanceData[] instanceData, Float3 sortPosition, int layerIndex = 0, PropertyState? sharedProperties = null, AABB? bounds = null, int subMeshIndex = -1)
    parameters:
    - id: mesh
      type: Prowl.Runtime.Resources.Mesh
      description: Source mesh whose vertex/index buffers are reused for every instance.
    - id: material
      type: Prowl.Runtime.Resources.Material
      description: Material applied to all instances.
    - id: instanceData
      type: Prowl.Runtime.Rendering.InstanceData[]
      description: Per-instance transform/colour data uploaded as the instance buffer.
    - id: sortPosition
      type: Prowl.Vector.Float3
      description: World-space origin for depth sorting. Should be a stable position (e.g., particle system transform, terrain chunk center) to avoid flickering.
    - id: layerIndex
      type: System.Int32
      description: Layer index used for culling/render-ordering.
    - id: sharedProperties
      type: Prowl.Runtime.Rendering.PropertyState
      description: Optional shared property block applied to the material; null creates an empty one.
    - id: bounds
      type: System.Nullable{Prowl.Vector.AABB}
      description: Optional explicit world-space AABB for culling; falls back to the mesh bounds when null.
    - id: subMeshIndex
      type: System.Int32
      description: Which submesh to draw (0..mesh.SubMeshCount-1), or -1 for the entire mesh.
