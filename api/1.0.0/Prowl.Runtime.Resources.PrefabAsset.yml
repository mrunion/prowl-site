  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: >-
    A prefab asset: a serialized GameObject hierarchy, stored as raw EchoObject data. Holding a prefab keeps every

    asset its hierarchy uses loaded, so spawning it never loads.


    <p></p>


    Instantiating one lives on <xref href="Prowl.Runtime.GameObject" data-throw-if-not-resolved="false"></xref> - see

    <xref href="Prowl.Runtime.GameObject.Instantiate(Prowl.Runtime.Resources.PrefabAsset)" data-throw-if-not-resolved="false"></xref> to spawn into a scene, or

    <xref href="Prowl.Runtime.GameObject.InstantiateDetached(Prowl.Runtime.Resources.PrefabAsset)" data-throw-if-not-resolved="false"></xref> for the hierarchy on its own - so that every way of

    building a GameObject from serialized data goes through one place.
  example: []
  syntax:
    content: 'public class PrefabAsset : Asset, IDisposable, IAssetWalkable'
    content.vb: Public Class PrefabAsset Inherits Asset Implements IDisposable, IAssetWalkable
