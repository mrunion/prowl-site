  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Owns the GPU mirror of a single <xref href="Prowl.Runtime.Rendering.LightBVH" data-throw-if-not-resolved="false"></xref>: one RGBA32F texture for per-light

    data (5 texels per slot) and one for the BVH nodes (2 texels per node). Both textures are

    square and grow on demand by doubling the dimension; the CPU keeps a staging buffer so we

    can issue exactly one <code>glTexSubImage2D</code> per frame, covering only the affected rows.
  example: []
  syntax:
    content: 'public sealed class LightBVHTextures : IDisposable'
    content.vb: Public NotInheritable Class LightBVHTextures Implements IDisposable
