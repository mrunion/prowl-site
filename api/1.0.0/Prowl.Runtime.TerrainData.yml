  summary: >-
    Heightmap samples per side, one more than the number of cells it spans: 513 samples fence off

    512 cells. Vertex grid, use <xref href="Prowl.Runtime.TerrainData.HeightmapToUV(System.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> to convert an index to UV.

    Change it with <xref href="Prowl.Runtime.TerrainData.ResizeHeightmap(System.Int32)" data-throw-if-not-resolved="false"></xref>, which reallocates to match.
