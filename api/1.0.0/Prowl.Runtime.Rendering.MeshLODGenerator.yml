  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Several levels, each built from the one before so the work shrinks as the levels do.

    <code class="paramref">ratios</code> are fractions of the source's triangle count, not counting triangles

    that collapse to nothing when its vertices are welded. A ratio no lower than the one before it

    repeats that level.
  example: []
  syntax:
    content: public static List<MeshLOD> GenerateChain(Mesh source, IReadOnlyList<float> ratios, MeshLODOptions? options = null)
    parameters:
    - id: source
      type: Prowl.Runtime.Resources.Mesh
    - id: ratios
      type: System.Collections.Generic.IReadOnlyList{System.Single}
    - id: options
      type: Prowl.Runtime.Rendering.MeshLODOptions
    return:
      type: System.Collections.Generic.List{Prowl.Runtime.Rendering.MeshLOD}
    content.vb: Public Shared Function GenerateChain(source As Mesh, ratios As IReadOnlyList(Of Single), options As MeshLODOptions = Nothing) As List(Of MeshLOD)
