  summary: >-
    Builds lower detail versions of a mesh with <xref href="Prowl.Vector.Geometry.GeometryOperators.Simplify(Prowl.Vector.Geometry.GeometryData%2cProwl.Vector.Geometry.SimplifyOptions)" data-throw-if-not-resolved="false"></xref>. Every vertex in a

    level is one of the source's own vertices, so skinning, blend shapes, every UV set and colors carry over

    unchanged, and submeshes keep their order for the materials.
