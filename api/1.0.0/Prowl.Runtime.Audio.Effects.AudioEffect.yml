  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Audio.Effects
  summary: Base class for effects in an <xref href="Prowl.Runtime.AudioSource" data-throw-if-not-resolved="false"></xref>'s processing chain.
  remarks: >-
    Parameters belong in serialized fields so the effect can be authored in the inspector and saved

    with the scene. Anything derived from the audio format belongs in <xref href="Prowl.Runtime.Audio.Effects.AudioEffect.OnInitialize" data-throw-if-not-resolved="false"></xref>,

    which runs once the sample rate and channel count are known, rather than in a constructor that

    makes the caller pass in values the engine already has.


    <xref href="Prowl.Runtime.Audio.Effects.AudioEffect.OnProcess(Prowl.Runtime.Audio.Native.NativeArray%7bSystem.Single%7d%2cSystem.UInt32%2cProwl.Runtime.Audio.Native.NativeArray%7bSystem.Single%7d%2cSystem.UInt32%40%2cSystem.UInt32)" data-throw-if-not-resolved="false"></xref> runs on the audio thread. It must not allocate, block, or take a lock: a

    garbage collection or a contended lock there is an audible dropout, not a slow frame.
  example: []
  syntax:
    content: public abstract class AudioEffect
    content.vb: Public MustInherit Class AudioEffect
