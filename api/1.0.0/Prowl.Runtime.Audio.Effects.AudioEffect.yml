    path: ../Prowl/Prowl.Runtime/Audio/Effects/AudioEffect.cs
    startLine: 84
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Audio.Effects
  summary: >-
    Binds the effect to an audio format and builds its DSP state. Safe to call more than once: it

    is what a source or bus calls when the effect joins it, and again whenever the format changes.
  remarks: >-
    Public so an effect can be driven outside a chain, for an offline render or a test of its own

    DSP. Until this runs there is no state for <xref href="Prowl.Runtime.Audio.Effects.AudioEffect.Process(Prowl.Runtime.Audio.Native.NativeArray%7bSystem.Single%7d%2cSystem.UInt32%2cProwl.Runtime.Audio.Native.NativeArray%7bSystem.Single%7d%2cSystem.UInt32%40%2cSystem.UInt32)" data-throw-if-not-resolved="false"></xref> to work with, so an effect

    used that way does nothing at all.
  example: []
  syntax:
    content: public void Initialize(int sampleRate, int channels)
    parameters:
    - id: sampleRate
      type: System.Int32
    - id: channels
      type: System.Int32
    content.vb: Public Sub Initialize(sampleRate As Integer, channels As Integer)
  overload: Prowl.Runtime.Audio.Effects.AudioEffect.Initialize*
  nameWithType.vb: AudioEffect.Initialize(Integer, Integer)
  fullName.vb: Prowl.Runtime.Audio.Effects.AudioEffect.Initialize(Integer, Integer)
  name.vb: Initialize(Integer, Integer)
