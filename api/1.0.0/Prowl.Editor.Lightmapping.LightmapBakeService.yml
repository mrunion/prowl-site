  summary: >-
    The scene the in-flight bake belongs to, or null when idle. Only one bake can run at
        a time; callers showing bake UI for a scene should compare this against their own scene
        rather than trusting <xref href="Prowl.Editor.Lightmapping.LightmapBakeService.IsBaking" data-throw-if-not-resolved="false"></xref> alone, which is true for any scene while baking.
