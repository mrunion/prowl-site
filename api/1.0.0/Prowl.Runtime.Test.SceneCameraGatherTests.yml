  summary: >-
    Guards <xref href="Prowl.Runtime.Resources.Scene.GatherActiveCameras" data-throw-if-not-resolved="false"></xref>, which replaced a per-object

    <code>GetComponentsInChildren</code> recursion in Scene.Render. The flat scan must return exactly what

    the old recursive-plus-Distinct expression returned, for every hierarchy shape.
