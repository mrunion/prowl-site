    remote:
      path: Prowl.Runtime/Physics/TerrainHeightmapProxy.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: TryGetCellRange
    path: ../Prowl/Prowl.Runtime/Physics/TerrainHeightmapProxy.cs
    startLine: 249
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    The range of cells a world-space bounding box could touch, clamped to the grid. Upper bounds are

    exclusive, so callers iterate <code>x &lt; maxX</code>.


    <p></p>


    The box is brought into local space corner by corner and re-bounded there, because a rotated

    terrain turns an axis-aligned world box into an oriented one. Re-bounding is conservative, which

    is what a broad-phase range has to be.
  example: []
  syntax:
    content: bool TryGetCellRange(in JBoundingBox worldBounds, out int minX, out int minZ, out int maxX, out int maxZ)
    parameters:
    - id: worldBounds
      type: Jitter2.LinearMath.JBoundingBox
    - id: minX
      type: System.Int32
    - id: minZ
      type: System.Int32
    - id: maxX
      type: System.Int32
    - id: maxZ
      type: System.Int32
    return:
      type: System.Boolean
      description: False when the box cannot touch the grid at all.
    content.vb: Function TryGetCellRange(worldBounds As JBoundingBox, minX As Integer, minZ As Integer, maxX As Integer, maxZ As Integer) As Boolean
  overload: Prowl.Runtime.ITerrainHeightProvider.TryGetCellRange*
  nameWithType.vb: ITerrainHeightProvider.TryGetCellRange(JBoundingBox, Integer, Integer, Integer, Integer)
  fullName.vb: Prowl.Runtime.ITerrainHeightProvider.TryGetCellRange(Jitter2.LinearMath.JBoundingBox, Integer, Integer, Integer, Integer)
  name.vb: TryGetCellRange(JBoundingBox, Integer, Integer, Integer, Integer)
