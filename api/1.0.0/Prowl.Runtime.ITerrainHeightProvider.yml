  nameWithType: ITerrainHeightProvider.TryGetCellRange(in JBoundingBox, out int, out int, out int, out int)
  fullName: Prowl.Runtime.ITerrainHeightProvider.TryGetCellRange(in Jitter2.LinearMath.JBoundingBox, out int, out int, out int, out int)
  type: Method
