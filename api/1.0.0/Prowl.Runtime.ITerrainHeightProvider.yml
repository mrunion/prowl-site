  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Supplies the height grid and where it sits in the world.


    <p></p>


    The grid itself is defined in terrain-local space: cell (x,z) sits at <code>(x, height, z) * CellSize</code>

    with no rotation, scale or offset baked in. <xref href="Prowl.Runtime.ITerrainHeightProvider.LocalToWorld" data-throw-if-not-resolved="false"></xref> carries all of that, which is

    what lets terrain be rotated arbitrarily - queries are brought into local space, walked on the

    axis-aligned grid there, and their results taken back out.
  example: []
  syntax:
    content: public interface ITerrainHeightProvider
    content.vb: Public Interface ITerrainHeightProvider
  derivedClasses:
  - Prowl.Runtime.TerrainCollider
  extensionMethods:
  - System.Object.Prowl.Runtime.RuntimeUtils.GetSerializableFields
