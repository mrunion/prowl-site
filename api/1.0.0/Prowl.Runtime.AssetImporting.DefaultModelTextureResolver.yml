  summary: >-
    Resolve a texture referenced by a sibling file on disk. <code class="paramref">sourcePath</code> is

    always an already-resolved, existing, absolute path.
  example: []
  syntax:
    content: public Texture2D? ResolveExternal(string sourcePath)
    parameters:
    - id: sourcePath
      type: System.String
    return:
      type: Prowl.Runtime.Resources.Texture2D
      description: >-
        The texture, or null if it can't/shouldn't be resolved - the caller falls back to the
            material slot's built-in default texture (Grid/Normal/Surface/Emission).
