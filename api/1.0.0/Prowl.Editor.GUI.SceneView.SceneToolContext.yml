  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.GUI.SceneView
  summary: >-
    Everything a <xref href="Prowl.Editor.GUI.SceneView.SceneTool" data-throw-if-not-resolved="false"></xref> needs for one viewport for one frame: the arbitration

    context, the scene, the selection, and per-viewport storage.


    <p>One context exists per scene viewport and is reused across frames, so

    <xref href="Prowl.Editor.GUI.SceneView.SceneToolContext.State%60%601" data-throw-if-not-resolved="false"></xref> is stable for as long as the viewport lives. That is what lets a single

    tool instance serve two scene views without their drags interfering.</p>
