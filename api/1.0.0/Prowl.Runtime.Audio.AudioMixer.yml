    path: ../Prowl/Prowl.Runtime/Audio/AudioMixer.cs
    startLine: 810
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Audio
  summary: >-
    Moves the mixer to a recorded mix over <code class="paramref">seconds</code>, which is what a change of

    scene, a pause menu or going underwater actually is.
  remarks: >-
    Starts from wherever the mixer is now rather than from whatever it was last told to be, so a

    transition interrupted by another one carries on from what you can currently hear instead of

    jumping back. Flags cross at the half way mark, since a mute has no midpoint to ease through.
  example: []
  syntax:
    content: public void TransitionTo(AudioMixerSnapshot snapshot, float seconds)
    parameters:
    - id: snapshot
      type: Prowl.Runtime.Audio.AudioMixerSnapshot
    - id: seconds
      type: System.Single
    content.vb: Public Sub TransitionTo(snapshot As AudioMixerSnapshot, seconds As Single)
