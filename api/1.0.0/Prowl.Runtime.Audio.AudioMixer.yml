  source:
    remote:
      path: Prowl.Runtime/Audio/AudioMixer.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: RemoveGroup
    path: ../Prowl/Prowl.Runtime/Audio/AudioMixer.cs
    startLine: 700
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Audio
  summary: >-
    Removes a group, re-pointing anything that fed into it at its own parent. Sources still routed

    to it fall back to the master output.
  remarks: >-
    The group's native objects are released, but the object itself is left alive. It is a sub-asset,

    so anything holding an <xref href="Prowl.Runtime.AudioSource.OutputGroup" data-throw-if-not-resolved="false"></xref> reference to it still has one, and

    destroying it here would leave those sources pointing at a destroyed object rather than at

    nothing. Its disappearance from the asset database is the reimport's business, which is how the

    rest of the sub-asset machinery works.
  example: []
  syntax:
    content: public bool RemoveGroup(AudioMixerGroup group)
    parameters:
    - id: group
      type: Prowl.Runtime.Audio.AudioMixerGroup
    return:
      type: System.Boolean
    content.vb: Public Function RemoveGroup(group As AudioMixerGroup) As Boolean
  overload: Prowl.Runtime.Audio.AudioMixer.RemoveGroup*
