  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Importers
  summary: >-
    Deserializes the sprite settings from a texture's <code>.meta</code> settings compound. An absent block

    legitimately means defaults; a block that is present but unreadable is reported through

    <code class="paramref">failed</code> so callers can refuse to write over it. Silently substituting defaults

    would present the texture as having no sprites and let the next save destroy the real slicing.
  example: []
  syntax:
    content: public static SpriteImportSettings ReadFrom(EchoObject? settings, out bool failed)
    parameters:
    - id: settings
      type: Prowl.Echo.EchoObject
    - id: failed
      type: System.Boolean
    return:
      type: Prowl.Editor.Importers.SpriteImportSettings
    content.vb: Public Shared Function ReadFrom(settings As EchoObject, failed As Boolean) As SpriteImportSettings
