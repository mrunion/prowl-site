  assemblies:
  - Prowl.Editor.Test
  namespace: Prowl.Editor.Test
  summary: >-
    Base class for headless editor tests. Each test gets a fresh throwaway project on disk with a live

    <xref href="Prowl.Editor.EditorAssetBackend" data-throw-if-not-resolved="false"></xref>, and everything is torn down (including the temp directory) when

    the test finishes.


    This deliberately avoids the editor GUI/graphics layer: never instantiate EditorApplication and

    never import graphics-bound assets (textures/shaders/models), since <code>Graphics.GL</code> is unguarded.

    Tests in this assembly run without parallelization (see TestAssemblyConfig) because the editor uses

    global static state.
  example: []
  syntax:
    content: 'public abstract class EditorTestHarness : IDisposable'
    content.vb: Public MustInherit Class EditorTestHarness Implements IDisposable
