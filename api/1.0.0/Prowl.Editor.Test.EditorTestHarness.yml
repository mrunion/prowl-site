    id: CreatePrefabAsset
    path: ../Prowl/Prowl.Editor.Test/EditorTestHarness.cs
    startLine: 74
  assemblies:
  - Prowl.Editor.Test
  namespace: Prowl.Editor.Test
  summary: >-
    Creates a .prefab asset the way the editor does and returns its GUID. Goes through the

    production path, so what a test builds on is what a user would have: the source becomes an

    instance of the asset, identifiers are stabilised, and anything nested is flattened.


    <p></p>


    Use <xref href="Prowl.Editor.Test.EditorTestHarness.WritePrefabFileRaw(Prowl.Runtime.GameObject%2cSystem.String)" data-throw-if-not-resolved="false"></xref> instead when a test needs an asset the creation path

    would never produce.
  example: []
  syntax:
    content: protected Guid CreatePrefabAsset(GameObject source, string relativePath = "Prefab.prefab")
    parameters:
    - id: source
      type: Prowl.Runtime.GameObject
    - id: relativePath
      type: System.String
    return:
      type: System.Guid
    content.vb: Protected Function CreatePrefabAsset(source As GameObject, relativePath As String = "Prefab.prefab") As Guid
  overload: Prowl.Editor.Test.EditorTestHarness.CreatePrefabAsset*
  nameWithType.vb: EditorTestHarness.CreatePrefabAsset(GameObject, String)
