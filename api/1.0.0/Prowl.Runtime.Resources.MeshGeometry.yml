  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: >-
    Builds a mesh from geometry. One mesh vertex is made per distinct corner of each geometry vertex.

    <code class="paramref">template</code> supplies what geometry does not carry: name, bind poses, bone names,

    blend shape names and frame weights, whether colors were bytes, and the submesh count, so a submesh

    that lost every triangle still keeps its slot and the material order holds. Without one, byte colors

    come back as float colors.
  example: []
  syntax:
    content: public static Mesh ToMesh(GeometryData geometry, Mesh? template = null)
    parameters:
    - id: geometry
      type: Prowl.Vector.Geometry.GeometryData
    - id: template
      type: Prowl.Runtime.Resources.Mesh
    return:
      type: Prowl.Runtime.Resources.Mesh
    content.vb: Public Shared Function ToMesh(geometry As GeometryData, template As Mesh = Nothing) As Mesh
  overload: Prowl.Runtime.Resources.MeshGeometry.ToMesh*
