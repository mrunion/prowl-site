    startLine: 33
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering.Shaders
  summary: >-
    Optional [min, max] hint for inspector UI. Populated by the shader parser when a

    property is declared as <code>Range(min, max)</code>; the inspector reads this to draw

    a slider instead of a plain number field. Always zero for non-Range properties

    use <xref href="Prowl.Runtime.Rendering.Shaders.ShaderProperty.HasRange" data-throw-if-not-resolved="false"></xref> to distinguish "unset" from "range 0..0".
  example: []
  syntax:
    content: public Float2 Range
    return:
      type: Prowl.Vector.Float2
    content.vb: Public Range As Float2
