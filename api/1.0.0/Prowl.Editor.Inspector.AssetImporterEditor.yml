  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Inspector
  summary: Base class for custom asset editors shown in the inspector when an asset is selected.
  remarks: >-
    Editors edit live: a change takes effect on the instance immediately, so the scene reflects it while

    you work. What is <i>not</i> immediate is writing to disk, and the difference between the two is

    measured rather than tracked. An editor exposes its authored state through <xref href="Prowl.Editor.Inspector.AssetImporterEditor.CaptureState(Prowl.Editor.AssetEntry%2cProwl.Runtime.EngineObject)" data-throw-if-not-resolved="false"></xref>

    and the base diffs that against a baseline snapshot with <xref href="Prowl.Echo.EchoObject.CreateDelta(Prowl.Echo.EchoObject%2cProwl.Echo.EchoObject)" data-throw-if-not-resolved="false"></xref>; a delta

    with any operations means unapplied changes. No editor has to remember to flag each field it touches,

    and none can forget one.
  example: []
  syntax:
    content: public abstract class AssetImporterEditor
    content.vb: Public MustInherit Class AssetImporterEditor
