  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Inspector
  summary: >-
    This editor's current authored state as Echo, or null when it has nothing that can be applied.

    For an importer this is the <code>.meta</code> settings compound; for a content asset it is the live

    object serialized.
  remarks: >-
    Keep this cheap - it runs while the asset is selected, so it must not do real work. Serializing a

    <code>Texture2D</code> here, for instance, would read the entire image back off the GPU; the texture

    editor returns its import settings instead, which is what it actually authors.
  example: []
  syntax:
    content: protected virtual EchoObject? CaptureState(AssetEntry entry, EngineObject? asset)
    parameters:
    - id: entry
      type: Prowl.Editor.AssetEntry
    - id: asset
      type: Prowl.Runtime.EngineObject
    return:
      type: Prowl.Echo.EchoObject
    content.vb: Protected Overridable Function CaptureState(entry As AssetEntry, asset As EngineObject) As EchoObject
