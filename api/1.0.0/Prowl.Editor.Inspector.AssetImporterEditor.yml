    id: CapturePersistedState
    path: ../Prowl/Prowl.Editor/GUI/CustomEditors/AssetImporterEditor.cs
    startLine: 73
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Inspector
  summary: >-
    The asset as persisted, used as the clean baseline. Defaults to whatever <xref href="Prowl.Editor.Inspector.AssetImporterEditor.CaptureState(Prowl.Editor.AssetEntry%2cProwl.Runtime.EngineObject)" data-throw-if-not-resolved="false"></xref>

    reports, which is already right for editors that load their buffer from disk.
  remarks: >-
    Editors whose state is a live object should override this to read what was actually imported.

    Baselining from the live instance instead adopts whatever it happens to hold when the inspector

    first draws it as "clean", so a mutation made somewhere else - a script or tool poking the asset

    directly - is silently accepted. Comparing against the imported form surfaces it as pending

    changes, which is the only signal that something diverged.
  example: []
  syntax:
    content: protected virtual EchoObject? CapturePersistedState(AssetEntry entry, EngineObject? asset)
    parameters:
    - id: entry
      type: Prowl.Editor.AssetEntry
    - id: asset
      type: Prowl.Runtime.EngineObject
    return:
      type: Prowl.Echo.EchoObject
    content.vb: Protected Overridable Function CapturePersistedState(entry As AssetEntry, asset As EngineObject) As EchoObject
  overload: Prowl.Editor.Inspector.AssetImporterEditor.CapturePersistedState*
  nameWithType.vb: AssetImporterEditor.CapturePersistedState(AssetEntry, EngineObject)
  fullName.vb: Prowl.Editor.Inspector.AssetImporterEditor.CapturePersistedState(Prowl.Editor.AssetEntry, Prowl.Runtime.EngineObject)
  name.vb: CapturePersistedState(AssetEntry, EngineObject)
