    id: GetBuildSettings
    path: ../Prowl/Prowl.Runtime/Navigation/NavMeshAgentTypes.cs
    startLine: 86
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Compose the resolved bake input for an agent type: envelope from the table, everything

    else from <code class="paramref">overrides</code> (or defaults). This is what surfaces hand to

    <xref href="Prowl.Runtime.NavMeshBuilder.Build(Prowl.Runtime.NavMeshBuildSettings%2cSystem.Collections.Generic.IReadOnlyList%7bProwl.Runtime.NavMeshGeometrySource%7d%2cSystem.Int32%2cSystem.Int32%2cSystem.Threading.CancellationToken%2cSystem.Nullable%7bProwl.Vector.AABB%7d%2cSystem.Collections.Generic.IReadOnlyList%7bProwl.Runtime.NavMeshAreaVolume%7d%2cSystem.Collections.Generic.IReadOnlyList%7bProwl.Runtime.NavMeshLinkSource%7d)" data-throw-if-not-resolved="false"></xref>; the builder API itself only ever sees the resolved

    <xref href="Prowl.Runtime.NavMeshBuildSettings" data-throw-if-not-resolved="false"></xref>. An undefined id falls back to the Humanoid envelope

    with a warning — a bake with wrong-but-sane dimensions beats no bake.
  example: []
  syntax:
    content: public static NavMeshBuildSettings GetBuildSettings(int agentTypeId, NavMeshBuildOverrides? overrides = null)
    parameters:
    - id: agentTypeId
      type: System.Int32
    - id: overrides
      type: Prowl.Runtime.NavMeshBuildOverrides
    return:
      type: Prowl.Runtime.NavMeshBuildSettings
    content.vb: Public Shared Function GetBuildSettings(agentTypeId As Integer, [overrides] As NavMeshBuildOverrides = Nothing) As NavMeshBuildSettings
