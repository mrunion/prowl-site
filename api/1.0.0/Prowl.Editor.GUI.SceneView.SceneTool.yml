    id: SceneTool
    path: ../Prowl/Prowl.Editor/GUI/SceneView/SceneTool.cs
    startLine: 27
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.GUI.SceneView
  summary: >-
    A scene-view mode with its own handles, overlays and toolbar. Tools register controls with the

    viewport's <xref href="Prowl.Editor.GUI.SceneView.HandleContext" data-throw-if-not-resolved="false"></xref> and act on whichever ones win the cursor, so several

    interactive things coexist without any of them claiming the frame.


    <p>Every available tool ticks every frame - there is no exclusive "active tool". A tool that

    should only act when the user asks for it keeps its own enabled flag, draws a toggle in

    <xref href="Prowl.Editor.GUI.SceneView.SceneTool.OnToolStripGUI(Prowl.Editor.GUI.SceneView.SceneToolContext%2cProwl.PaperUI.Paper%2cSystem.String)" data-throw-if-not-resolved="false"></xref>, and returns early from <xref href="Prowl.Editor.GUI.SceneView.SceneTool.OnSceneInput(Prowl.Editor.GUI.SceneView.SceneToolContext)" data-throw-if-not-resolved="false"></xref> while off.</p>


    <p>Discovered by <xref href="Prowl.Editor.EditorRegistries" data-throw-if-not-resolved="false"></xref> via <xref href="Prowl.Editor.GUI.SceneView.GlobalSceneToolAttribute" data-throw-if-not-resolved="false"></xref> or

    <xref href="Prowl.Editor.GUI.SceneView.ComponentSceneToolAttribute" data-throw-if-not-resolved="false"></xref>. One instance exists per tool type for the whole

    editor; anything that varies per viewport belongs in

    <xref href="Prowl.Editor.GUI.SceneView.SceneToolContext.State%60%601" data-throw-if-not-resolved="false"></xref> rather than in a field.</p>
  example: []
