  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Thumbnails
  summary: >-
    Load a thumbnail from disk. Returns (width, height, RGBA pixels) or null.

    The on-disk format is: [width:int32 LE][height:int32 LE][RGBA pixel data].

    Legacy files without the header are discarded (they will regenerate).
  example: []
  syntax:
    content: public static (int width, int height, byte[] pixels)? LoadThumbnail(Guid guid, string thumbnailsPath)
    parameters:
    - id: guid
      type: System.Guid
    - id: thumbnailsPath
      type: System.String
    return:
      type: System.Nullable{System.ValueTuple{System.Int32,System.Int32,System.Byte[]}}
