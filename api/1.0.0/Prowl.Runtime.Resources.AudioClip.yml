      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: Create
    path: ../Prowl/Prowl.Runtime/Resources/AudioClip.cs
    startLine: 277
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: Builds a playable clip from raw interleaved samples, for procedurally generated audio.
  remarks: >-
    The samples are wrapped in a WAVE container, because playback decodes an encoded stream and

    bare PCM is not one. That keeps a procedural clip identical to an imported one everywhere else.
  example: []
  syntax:
    content: public static AudioClip Create(string name, float[] samples, int channels, int sampleRate)
    parameters:
    - id: name
      type: System.String
      description: Name for the clip.
    - id: samples
      type: System.Single[]
      description: Interleaved 32 bit float samples, one frame at a time across the channels.
    - id: channels
      type: System.Int32
      description: How many channels the samples are interleaved across.
    - id: sampleRate
      type: System.Int32
      description: Sample rate of the samples in hertz.
    return:
      type: Prowl.Runtime.Resources.AudioClip
    content.vb: Public Shared Function Create(name As String, samples As Single(), channels As Integer, sampleRate As Integer) As AudioClip
  overload: Prowl.Runtime.Resources.AudioClip.Create*
  nameWithType.vb: AudioClip.Create(String, Single(), Integer, Integer)
  fullName.vb: Prowl.Runtime.Resources.AudioClip.Create(String, Single(), Integer, Integer)
  name.vb: Create(String, Single(), Integer, Integer)
