  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Resources
  summary: Creates a new AudioClip instance which gets its data from memory. The data must be in an encoded format.
  example: []
  syntax:
    content: public AudioClip(byte[] data, bool isUnique = false)
    parameters:
    - id: data
      type: System.Byte[]
      description: Must be encoded audio data (either WAV/MP3/FLAC/OGG)
    - id: isUnique
      type: System.Boolean
      description: >-
        Give this clip a buffer of its own instead of sharing one with every other clip holding the

        same bytes. Sharing is the default because it is what stops ten prefabs referencing one sound

        from holding ten copies of it, and nothing writes to the buffer once it is loaded.
    content.vb: Public Sub New(data As Byte(), isUnique As Boolean = False)
