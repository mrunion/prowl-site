    path: ../Prowl/Prowl.Runtime/Components/Navigation/NavMeshSurface.cs
    startLine: 25
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Bakes and registers a navmesh for one agent type. The baked result is a standalone

    <xref href="Prowl.Runtime.NavMeshSurface.NavMeshData" data-throw-if-not-resolved="false"></xref> asset, which the surface registers with the scene's

    <xref href="Prowl.Runtime.NavMeshWorld" data-throw-if-not-resolved="false"></xref> on enable. Rebuilds run synchronously, in the background

    (<xref href="Prowl.Runtime.NavMeshSurface.BuildNavMeshAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>), or per-tile for localized geometry changes

    (<xref href="Prowl.Runtime.NavMeshSurface.RebuildTiles(Prowl.Vector.AABB)" data-throw-if-not-resolved="false"></xref>).


    <p></p>


    Registration is the whole of this component's lifecycle — there is no per-frame work — and it

    runs in the editor as well as in play: obstacles can only carve a live navmesh and the overlay

    draws one, so without it a scene's baked navmesh stays unregistered until something bakes again.
  example: []
  syntax:
    content: >-
      [AddComponentMenu("Navigation/NavMesh Surface", "")]

      [ComponentIcon("")]

      public class NavMeshSurface : MonoBehaviour, IDisposable, ISerializationCallbackReceiver
    content.vb: >-
      <AddComponentMenu("Navigation/NavMesh Surface", "")>

      <ComponentIcon("")>

