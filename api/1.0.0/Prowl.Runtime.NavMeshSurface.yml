  type: Method
  source:
    remote:
      path: Prowl.Runtime/Components/Navigation/NavMeshSurface.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: ApplyRebuiltTiles
    path: ../Prowl/Prowl.Runtime/Components/Navigation/NavMeshSurface.cs
    startLine: 453
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Swap rebuilt tiles (from <xref href="Prowl.Runtime.NavMeshSurface.RebuildTilesAsync(Prowl.Vector.AABB%2cSystem.Collections.Generic.IReadOnlyList%7bProwl.Runtime.NavMeshGeometrySource%7d%2cSystem.Threading.CancellationToken%2cSystem.Collections.Generic.IReadOnlyList%7bProwl.Runtime.NavMeshAreaVolume%7d)" data-throw-if-not-resolved="false"></xref> or

    <xref href="Prowl.Runtime.NavMeshBuilder.BuildTilesInBounds(Prowl.Runtime.NavMeshData%2cSystem.Collections.Generic.IReadOnlyList%7bProwl.Runtime.NavMeshGeometrySource%7d%2cProwl.Vector.Float3%2cProwl.Vector.Float3%2cSystem.Int32%2cSystem.Threading.CancellationToken%2cSystem.Collections.Generic.IReadOnlyList%7bProwl.Runtime.NavMeshAreaVolume%7d)" data-throw-if-not-resolved="false"></xref>) into the live TileCache and mirror them

    into the asset. Main thread only.


    <p></p>


    A cache with carve work in flight cannot take a swap, and draining it inline costs milliseconds

    per queued tile under the write lock — so the swap is held until the frame the pump reports the

    cache settled, usually the next one. Anything queuing tile work sets that flag, a link rebuild

    included. A cache that never settles (an obstacle moving every frame re-queues as fast as the

    pump drains) gives up after a few passes and pays the drain. Use

    <xref href="Prowl.Runtime.NavMeshSurface.ApplyRebuiltTilesImmediately(System.Collections.Generic.IReadOnlyList%7bProwl.Runtime.NavMeshTileRebuild%7d)" data-throw-if-not-resolved="false"></xref> when the tiles must be live before the call returns.


    <p></p>


    False only when there is nothing to apply to; true means applied OR held. A held swap keeps

    the layer blobs handed to it, so do not recycle them until it lands.
