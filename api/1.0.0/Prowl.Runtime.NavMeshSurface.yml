  fullName.vb: Prowl.Runtime.NavMeshSurface.ApplyRebuiltTilesImmediately(System.Collections.Generic.IReadOnlyList(Of Prowl.Runtime.NavMeshTileRebuild))
  name.vb: ApplyRebuiltTilesImmediately(IReadOnlyList(Of NavMeshTileRebuild))
