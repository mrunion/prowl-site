- uid: Prowl.Runtime.NavMeshSurface.ApplyRebuiltTilesImmediately(System.Collections.Generic.IReadOnlyList{Prowl.Runtime.NavMeshTileRebuild})
  commentId: M:Prowl.Runtime.NavMeshSurface.ApplyRebuiltTilesImmediately(System.Collections.Generic.IReadOnlyList{Prowl.Runtime.NavMeshTileRebuild})
  id: ApplyRebuiltTilesImmediately(System.Collections.Generic.IReadOnlyList{Prowl.Runtime.NavMeshTileRebuild})
