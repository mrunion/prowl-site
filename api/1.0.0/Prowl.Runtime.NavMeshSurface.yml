    id: RuntimeData
    path: ../Prowl/Prowl.Runtime/Components/Navigation/NavMeshSurface.cs
    startLine: 83
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    What the live navmesh was built from, and what rebuilds rewrite. Null while unregistered.

    For a <code>.navmesh</code> asset this is a private copy made at registration, because the object

    the database hands out is shared by every surface pointing at it and by the next scene that

    loads it. For a navmesh built at runtime and handed over through

    <xref href="Prowl.Runtime.NavMeshSurface.ApplyNavMeshData(Prowl.Runtime.NavMeshData)" data-throw-if-not-resolved="false"></xref> it is that object itself — nothing else owns it.
  example: []
