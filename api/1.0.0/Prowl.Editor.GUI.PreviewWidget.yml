  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.GUI
  summary: Gets or creates a PreviewWidget for the specified asset, reusing an existing one if its dimensions and grid setting match. Editors are shared between inspector panels - EditorRegistries caches a single instance per asset type - so a widget held as an editor field is reconfigured by every panel every frame, and they all end up drawing whichever asset set it up last. Keying on the asset gives each its own.
  example: []
  syntax:
    content: public static PreviewWidget For(Guid asset, int width = 256, int height = 256, bool showGrid = false)
    parameters:
    - id: asset
      type: System.Guid
    - id: width
      type: System.Int32
    - id: height
      type: System.Int32
    - id: showGrid
      type: System.Boolean
    return:
      type: Prowl.Editor.GUI.PreviewWidget
    content.vb: Public Shared Function [For](asset As Guid, width As Integer = 256, height As Integer = 256, showGrid As Boolean = False) As PreviewWidget
