  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Importers
  summary: >-
    Tracks managed and native plugin libraries (.dll/.so/.dylib). Produces no EngineObject -

    plugins are referenced at compile time and copied next to the player at build time.

    Per-plugin platform settings live in the .meta companion (see <xref href="Prowl.Editor.Projects.Scripting.PluginInfo.Keys" data-throw-if-not-resolved="false"></xref>).

    Only libraries inside a <code>Plugins/</code> folder are treated as plugins.
  example: []
  syntax:
    content: >-
      [ImporterFor(new string[] { ".dll", ".so", ".dylib" })]

      public class PluginImporter : AssetImporter
    content.vb: >-
      <ImporterFor(New String() { ".dll", ".so", ".dylib" })>

      Public Class PluginImporter Inherits AssetImporter
