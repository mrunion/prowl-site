  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.GUI.SceneView
  summary: >-
    Immediate-mode transform handles for scene tools. Wraps Origami's

    <xref href="Prowl.OrigamiUI.Gizmo.TransformGizmo" data-throw-if-not-resolved="false"></xref> so an editor can manipulate an arbitrary world point/transform

    (not just a GameObject): e.g. a light probe, a spline knot, a bounds corner.


    Each handle owns a <xref href="Prowl.Editor.GUI.SceneView.ControlID" data-throw-if-not-resolved="false"></xref>, so it arbitrates against every other handle in the

    viewport instead of unilaterally consuming input. Call a handle method from

    ISceneViewEditor.OnSceneInput each frame (it applies the drag to the <code>ref</code>

    values), then call <xref href="Prowl.Editor.GUI.SceneView.TransformHandles.Draw(Prowl.Quill.Canvas)" data-throw-if-not-resolved="false"></xref> from ISceneViewEditor.DrawOverlay to render

    the handles touched this frame. Each distinct <code class="paramref">id</code> keeps its own drag state

    across frames.
  example: []
