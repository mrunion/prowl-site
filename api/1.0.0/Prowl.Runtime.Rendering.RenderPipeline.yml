  fullName: Prowl.Runtime.Rendering.RenderPipeline.CullRenderables(System.Collections.Generic.IReadOnlyList<Prowl.Runtime.Rendering.IRenderable>, Prowl.Vector.Frustum?, Prowl.Runtime.LayerMask, bool[]?)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Rendering/RenderPipeline.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: CullRenderables
    path: ../Prowl/Prowl.Runtime/Rendering/RenderPipeline.cs
    startLine: 252
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Returns a per-index "culled" mask (true == culled, skip this renderable) aligned to

    <code class="paramref">renderables</code>. A bool[] keyed by index is cheaper to allocate than a

    HashSet and turns the per-object membership test in every pass into an O(1) array read

    instead of a hash lookup.
  example: []
  syntax:
    content: public bool[] CullRenderables(IReadOnlyList<IRenderable> renderables, Frustum? worldFrustum, LayerMask cullingMask, bool[]? alreadyCulled = null)
    parameters:
    - id: renderables
      type: System.Collections.Generic.IReadOnlyList{Prowl.Runtime.Rendering.IRenderable}
    - id: worldFrustum
      type: System.Nullable{Prowl.Vector.Frustum}
    - id: cullingMask
      type: Prowl.Runtime.LayerMask
    - id: alreadyCulled
      type: System.Boolean[]
      description: Renderables an earlier, wider test culled, which stay culled without testing again.
    return:
      type: System.Boolean[]
    content.vb: Public Function CullRenderables(renderables As IReadOnlyList(Of IRenderable), worldFrustum As Frustum?, cullingMask As LayerMask, alreadyCulled As Boolean() = Nothing) As Boolean()
  overload: Prowl.Runtime.Rendering.RenderPipeline.CullRenderables*
  nameWithType.vb: RenderPipeline.CullRenderables(IReadOnlyList(Of IRenderable), Frustum?, LayerMask, Boolean())
