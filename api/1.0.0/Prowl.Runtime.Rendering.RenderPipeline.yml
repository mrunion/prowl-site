  fullName: Prowl.Runtime.Rendering.RenderPipeline.DrawRenderables(Prowl.Runtime.CommandBuffer, System.Collections.Generic.IReadOnlyList<Prowl.Runtime.Rendering.IRenderable>, string, string, Prowl.Runtime.Rendering.ViewerData, bool[], bool, Prowl.Runtime.Resources.RenderTexture?, bool)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Rendering/RenderPipeline.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: DrawRenderables
    path: ../Prowl/Prowl.Runtime/Rendering/RenderPipeline.cs
    startLine: 533
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Rendering
  summary: >-
    Renders all given objects with optimized batching. Objects are grouped by (material, mesh, pass)

    to minimize GPU state changes. This achieves:

    - Material uniforms bound once per batch (instead of per object)

    - Mesh data uploaded once per batch

    - Shader variant selected once per batch

    - Per-object uniforms still bound individually


    Performance: 100 objects with same material = 1 material bind (vs 100 without batching)
  example: []
  syntax:
    content: public void DrawRenderables(CommandBuffer cmd, IReadOnlyList<IRenderable> renderables, string shaderTag, string tagValue, ViewerData viewer, bool[] culledRenderableIndices, bool updatePreviousMatrices, RenderTexture? currentRT = null, bool preserveOrder = false)
    parameters:
    - id: cmd
      type: Prowl.Runtime.CommandBuffer
      description: >-
        CommandBuffer the batches encode into. The caller is responsible
             for binding the target framebuffer + viewport before calling this method, and
             for submitting the buffer after.
    - id: renderables
      type: System.Collections.Generic.IReadOnlyList{Prowl.Runtime.Rendering.IRenderable}
    - id: shaderTag
      type: System.String
    - id: tagValue
      type: System.String
    - id: viewer
      type: Prowl.Runtime.Rendering.ViewerData
    - id: culledRenderableIndices
      type: System.Boolean[]
    - id: updatePreviousMatrices
      type: System.Boolean
    - id: currentRT
      type: Prowl.Runtime.Resources.RenderTexture
      description: >-
        Currently bound color render target, used for the
             GrabTexture handshake (read FB for the blit-into-grab-RT). Pass null if no
             pass in this batch will request a grab texture.
    - id: preserveOrder
      type: System.Boolean
      description: >-
        Draw in the order of <code class="paramref">renderables</code>, only merging
             neighbours into one batch. Needed for sorted lists such as back to front transparents.
    content.vb: Public Sub DrawRenderables(cmd As CommandBuffer, renderables As IReadOnlyList(Of IRenderable), shaderTag As String, tagValue As String, viewer As ViewerData, culledRenderableIndices As Boolean(), updatePreviousMatrices As Boolean, currentRT As RenderTexture = Nothing, preserveOrder As Boolean = False)
  overload: Prowl.Runtime.Rendering.RenderPipeline.DrawRenderables*
