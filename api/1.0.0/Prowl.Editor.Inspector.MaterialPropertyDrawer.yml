  summary: >-
    Wrap a single shader property in a row with an override indicator on the
        left (purple bar when <code>material.IsOverridden(prop.Name)</code> is true) and a
        revert-to-default button on the right. <code class="paramref">onChanged</code> fires after
        any mutation so callers can flag dirty / refresh preview renders.
  example: []
