  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Utils
  summary: >-
    Make a name unique against <code class="paramref">parent</code>'s children - or, when parent is null,

    against <code class="paramref">scene</code>'s root objects. Uses the <code>" (N)"</code> convention with

    strip-and-increment, so duplicating <code>"Cube (3)"</code> yields <code>"Cube (4)"</code>.
  example: []
  syntax:
    content: public static string ForGameObjectSibling(string desired, GameObject? parent, Scene scene)
    parameters:
    - id: desired
      type: System.String
    - id: parent
      type: Prowl.Runtime.GameObject
    - id: scene
      type: Prowl.Runtime.Resources.Scene
    return:
      type: System.String
    content.vb: Public Shared Function ForGameObjectSibling(desired As String, parent As GameObject, scene As Scene) As String
