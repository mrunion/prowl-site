  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Utils
  summary: >-
    Find a free filename inside <code class="paramref">folder</code>. Considers both files and directories

    as collisions. Result is <code>baseName + ext</code> (or <code>baseName (N) + ext</code>); the extension

    must include the leading dot (or be empty for folders). Uses the <code>" (N)"</code> convention.
  example: []
  syntax:
    content: public static string ForFile(string folder, string baseName, string ext)
    parameters:
    - id: folder
      type: System.String
    - id: baseName
      type: System.String
    - id: ext
      type: System.String
    return:
      type: System.String
    content.vb: Public Shared Function ForFile(folder As String, baseName As String, ext As String) As String
