      repo: https://github.com/ProwlEngine/Prowl.git
    id: MakeUnique
    path: ../Prowl/Prowl.Editor/Utils/UniqueNames.cs
    startLine: 30
  assemblies:
  - Prowl.Editor
  namespace: Prowl.Editor.Utils
  summary: >-
    Find a name that doesn't satisfy <code class="paramref">exists</code>, by appending

    <code>{openSeparator}{N}{closeSeparator}</code> for the smallest free N.
  example: []
  syntax:
    content: public static string MakeUnique(string desired, Func<string, bool> exists, string openSeparator = " (", string closeSeparator = ")", bool stripExistingSuffix = true, int startNumber = 1)
    parameters:
    - id: desired
      type: System.String
      description: The name we'd like to use.
    - id: exists
      type: System.Func{System.String,System.Boolean}
      description: Returns true if the candidate name is already taken.
    - id: openSeparator
      type: System.String
      description: String inserted between the base name and the number - e.g. <code>" ("</code> for <code>"Cube (1)"</code>, <code>"_"</code> for <code>"name_1"</code>, or <code>""</code> for <code>"Action1"</code>.
    - id: closeSeparator
      type: System.String
      description: String appended after the number - e.g. <code>")"</code> for the parens style, empty for the others.
    - id: stripExistingSuffix
      type: System.Boolean
      description: When true, an existing trailing suffix matching this format is parsed off and its number used as the starting point. <code>"Cube (3)"</code> tries <code>"Cube (4)"</code> first instead of <code>"Cube (3) (1)"</code>.
    - id: startNumber
      type: System.Int32
      description: First number to try when no suffix is found / parsed. Defaults to 1.
    return:
      type: System.String
    content.vb: Public Shared Function MakeUnique(desired As String, exists As Func(Of String, Boolean), openSeparator As String = " (", closeSeparator As String = ")", stripExistingSuffix As Boolean = True, startNumber As Integer = 1) As String
