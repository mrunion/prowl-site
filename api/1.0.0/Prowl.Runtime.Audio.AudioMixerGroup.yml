    path: ../Prowl/Prowl.Runtime/Audio/AudioMixer.cs
    startLine: 23
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime.Audio
  summary: >-
    A named bus that audio is routed through on its way to the device, carrying a volume and a mute

    for everything feeding it.
  remarks: >-
    Groups live inside an <xref href="Prowl.Runtime.Audio.AudioMixer" data-throw-if-not-resolved="false"></xref> and are referenced by an

    <xref href="Prowl.Runtime.AudioSource.OutputGroup" data-throw-if-not-resolved="false"></xref>. Each one owns a native sound group whose output is attached

    to its parent's, so a volume set on a parent scales every descendant. The native side is built on

    demand and thrown away when the device closes, so the asset stays pure data.
  example: []
  syntax:
    content: 'public sealed class AudioMixerGroup : Asset, IDisposable'
    content.vb: Public NotInheritable Class AudioMixerGroup Inherits Asset Implements IDisposable
