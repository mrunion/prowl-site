  nameWithType: PointLight.RenderShadows(RenderPipeline, Float3, IReadOnlyList<IRenderable>)
  fullName: Prowl.Runtime.PointLight.RenderShadows(Prowl.Runtime.Rendering.RenderPipeline, Prowl.Vector.Float3, System.Collections.Generic.IReadOnlyList<Prowl.Runtime.Rendering.IRenderable>)
  type: Method
  source:
    remote:
      path: Prowl.Runtime/Components/Lights/PointLight.cs
      branch: main
      repo: https://github.com/ProwlEngine/Prowl.git
    id: RenderShadows
    path: ../Prowl/Prowl.Runtime/Components/Lights/PointLight.cs
    startLine: 48
  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Render this light's shadow map(s) into the shared shadow atlas.

    Called by the render pipeline during the shadow pass.


    <p>

    Implementations rent and submit their own <xref href="Prowl.Runtime.CommandBuffer" data-throw-if-not-resolved="false"></xref> per face

    (point lights), cascade (directional), or single tile (spot). They CANNOT share

    a CB across multiple faces because each face calls <xref href="Prowl.Runtime.Rendering.RenderPipeline.AssignCameraMatrices(Prowl.Vector.Float4x4%2cProwl.Vector.Float4x4)" data-throw-if-not-resolved="false"></xref>

    which uploads view/proj into the single GlobalUniforms UBO sharing a CB would

    queue all the face draws to execute against whatever matrices the LAST face

    uploaded.

    </p>


    <p>

    The shadow atlas itself has already been bound + cleared by the caller in a

    separate setup CB before this method runs.

    </p>
  example: []
  syntax:
    content: public override void RenderShadows(RenderPipeline pipeline, Float3 shadowFocusPosition, IReadOnlyList<IRenderable> renderables)
    parameters:
    - id: pipeline
      type: Prowl.Runtime.Rendering.RenderPipeline
      description: The current render pipeline.
    - id: shadowFocusPosition
      type: Prowl.Vector.Float3
      description: >-
        World-space point shadows are prioritized around: the
             rendering camera's position, or the camera's <xref href="Prowl.Runtime.Camera.ShadowFocus" data-throw-if-not-resolved="false"></xref> position when
             set. Directional lights center their cascades on it; point and spot lights ignore it.
    - id: renderables
      type: System.Collections.Generic.IReadOnlyList{Prowl.Runtime.Rendering.IRenderable}
      description: List of all renderables that could cast shadows.
    content.vb: Public Overrides Sub RenderShadows(pipeline As RenderPipeline, shadowFocusPosition As Float3, renderables As IReadOnlyList(Of IRenderable))
  overridden: Prowl.Runtime.Light.RenderShadows(Prowl.Runtime.Rendering.RenderPipeline,Prowl.Vector.Float3,System.Collections.Generic.IReadOnlyList{Prowl.Runtime.Rendering.IRenderable})
  overload: Prowl.Runtime.PointLight.RenderShadows*
  nameWithType.vb: PointLight.RenderShadows(RenderPipeline, Float3, IReadOnlyList(Of IRenderable))
