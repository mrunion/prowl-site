  assemblies:
  - Prowl.Runtime
  namespace: Prowl.Runtime
  summary: >-
    Draw every surface's walkable overlay, not only the selected one's. The only way to
        watch obstacles carve while playing, since entering play mode clears the selection. Each
        overlay re-triangulates whenever its navmesh settles, so leave it off while profiling.
  example: []
  syntax:
    content: public static bool AlwaysShow
    return:
      type: System.Boolean
    content.vb: Public Shared AlwaysShow As Boolean
