  summary: >-
    A live world of GameObjects. Its stored form is a <xref href="Prowl.Runtime.Resources.SceneAsset" data-throw-if-not-resolved="false"></xref>, and any number of scenes can be

    instantiated from one, like the editor's edit copy and play copy.
